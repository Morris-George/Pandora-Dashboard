<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VM Reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#FBF6F7;--surface:#FFFFFF;--ink:#2A1F24;--ink2:#6B5A61;--line:#EADCDF;--accent:#FF93A0;--accent-text:#2A1F24;--fill-soft:#FFE4E8;--hover:#FFF1F3;--good:#1F7A4D;--bad:#FF93A0;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;--bad:#FF93A0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;--bad:#FF93A0;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{word-spacing:.09em;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--ink2);font-size:12.5px}
.crumb{color:var(--ink2);font-size:12.5px;font-weight:600;text-decoration:none}.crumb:hover{color:var(--accent-text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.btn:hover{background:var(--hover)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#2A1018}:root[data-theme="dark"] .btn.go{color:#2A1018}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#2A1018}}
.btn.bad{color:var(--accent-text)}.btn:disabled{opacity:.5;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}.card .meta{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.row{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(110px,.9fr) minmax(200px,1.4fr) auto;gap:8px 14px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .who{font-weight:700;overflow-wrap:anywhere}.row .who small{display:block;color:var(--ink2);font-weight:500}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
select{width:100%;max-width:340px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font:inherit;color:var(--ink);background:var(--bg)}
.pwbox{border:2px solid var(--accent);background:var(--fill-soft)}.pwbox h2{font-size:16px}.pwline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pwline input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;color:var(--ink);background:var(--surface);min-width:220px}.big{font-size:22px;font-weight:800;letter-spacing:.04em;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.note{color:var(--ink2);font-size:12px;margin-top:4px}
.empty{color:var(--ink2);padding:8px 2px}.err{background:#FF93A0;color:#2A1018;border-radius:10px;padding:10px 14px;font-weight:600}
@media (max-width:640px){.row{grid-template-columns:1fr}.row .btns{justify-content:flex-start}}

.crumb{cursor:pointer;background:none;border:0;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}.chip:hover{background:var(--hover)}.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#2A1018}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.filters{display:flex;flex-direction:column;gap:10px}.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kpi{padding:12px 14px;border-radius:12px;background:var(--bg);min-width:0}.kpi.hero{background:var(--fill-soft)}.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700}.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:7px}.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 120px;gap:10px;align-items:center;padding:3px 4px;border-radius:8px}.brow:hover{background:var(--hover)}.brow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:14px;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:0 6px 6px 0}.fill{height:100%;border-radius:0 6px 6px 0;background:#D9C8CD}.brow.top .fill{background:var(--accent)}.brow .val{text-align:right;font-weight:700;white-space:nowrap}.brow .val small{font-weight:500;color:var(--ink2);margin-left:6px}
.heatwrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:max-content}table.heat th{font-size:11px;font-weight:700;color:var(--ink2);padding:6px 8px;text-align:center;white-space:nowrap}table.heat th.r{text-align:left;color:var(--ink);font-size:13px;position:sticky;left:0;background:var(--surface);z-index:1}table.heat td{text-align:center;padding:10px 8px;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums;color:#2A1018;min-width:64px}table.heat td.z{color:var(--ink2);font-weight:500;background:transparent}table.heat td.t,table.heat th.t{background:transparent;color:var(--ink);font-weight:800}
.scale{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink2)}.scale i{display:block;width:160px;height:10px;border-radius:6px;background:linear-gradient(90deg,#FFF3F5,#FFD9DE,#FFB8C0,#FF93A0,#F7707F)}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.sc{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}.sc h3{margin:0;font-size:15px}.sc .tot{color:var(--ink2);font-size:12.5px;margin:2px 0 10px}.mini{display:grid;grid-template-columns:1fr 38px;gap:2px 8px;align-items:center;font-size:12.5px;margin-top:6px}.mini .b{grid-column:1/3;height:8px;border-radius:0 5px 5px 0;background:var(--accent)}.mini .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini .q{text-align:right;font-weight:700}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.rep{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;text-decoration:none}.rep:hover{border-color:var(--accent);box-shadow:0 0 0 3px #FF93A044}.rep b{font-size:16px}.rep .d{color:var(--ink2);font-size:12.5px}.rep .ic{width:40px;height:40px;border-radius:12px;background:var(--fill-soft);display:grid;place-items:center;margin-bottom:4px}.rep .ic svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tw{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:12px}.tw table{border-collapse:collapse;width:100%;min-width:max-content}.tw th,.tw td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.tw th{position:sticky;top:0;background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}.tw td.n{text-align:right;font-variant-numeric:tabular-nums}
details.tbl summary{cursor:pointer;font-weight:700;margin-bottom:10px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.drop.on{border-color:var(--accent);background:var(--hover)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;max-width:260px;display:none}
@media (max-width:640px){.brow{grid-template-columns:96px 1fr 84px}.brow .val small{display:none}}
.xhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--surface);color:var(--ink2);padding:7px 13px;font:inherit;font-weight:650;cursor:pointer;font-size:12px}.seg button[aria-pressed="true"]{background:var(--accent);color:#2A1018}
.xsearch{width:100%;max-width:460px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 16px}.xsearch:focus{outline:0;border-color:var(--accent)}
.exp-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.xlist{display:flex;flex-direction:column;gap:2px;min-width:0}
.xrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:12.5px}
.xrow:hover,.xrow[aria-pressed="true"]{background:var(--hover)}
.xrow .xname{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xrow .xmeta{display:block;color:var(--ink2);font-size:11px;font-weight:500;margin-top:2px}
.xrow .xval{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.xrow .xval small{display:block;color:var(--ink2);font-weight:500;font-size:11px}
.xdetail{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.xdetail h4{margin:0;font-size:15px}
.xk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 16px}.xk div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.xk b{display:block;font-size:17px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xk span{font-size:10px;color:var(--ink2);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.xk small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.xh{font-size:10px;color:var(--ink2);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 8px}
.xtop5{display:flex;flex-direction:column;gap:8px;font-size:12.5px}.xp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.xp span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xp em{font-style:normal;color:var(--ink2);font-size:11px;display:block}.xp b{text-align:right;font-variant-numeric:tabular-nums}.xp b small{display:block;color:var(--ink2);font-weight:500;font-size:11px}
.xbr{display:flex;flex-direction:column;gap:6px}.xbr .brow{grid-template-columns:minmax(90px,150px) 1fr 96px}
.xsku{font-style:normal;font-weight:700;color:var(--ink)}.xempty{padding:22px;text-align:center;color:var(--ink2)}
@media (max-width:600px){.xk{grid-template-columns:1fr 1fr}.xk div:last-child{grid-column:span 2}}
@media (max-width:900px){.exp-grid{grid-template-columns:1fr}.xrow{grid-template-columns:minmax(90px,1fr) 1.4fr auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><button class="crumb" id="back" type="button" hidden>&larr; All reports</button><h1 id="ttl">Reports</h1><div class="sub" id="meta"></div></div><div class="actions"></div></header>
  <div class="err" id="err" hidden></div>
  <section class="card" id="feed" hidden><h2>Add a report</h2><div class="meta">Only you (super admin) can do this. Choose an Excel file: any amounts, prices and sales values are removed automatically before it is saved, so the VM only ever sees items, categories and quantities. Reports you add stay in the list until you remove them.</div>
    <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>
    <div class="drop" id="drop"><button class="btn go" id="pick" type="button">Choose Excel file</button><span>or drop it here</span><span id="status" class="note"></span></div></section>
  <div id="main"></div>
  <section class="card" id="explorer" hidden></section>
</div>
<div id="tip" role="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id),ROLE=window.__PANDORA_ROLE||{role:'vm'},ADMIN=ROLE.role==='admin';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),pc=v=>Math.round(v*100)+'%';
function showErr(t){const e=$('err');e.hidden=!t;e.textContent=t||''}
const get=async u=>{const r=await fetch(u,{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.replace('/login.html');throw 0}return r};
const ICON='<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';

/* ---------- library: the list of reports ---------- */
let LIST=[];
async function showLibrary(){
  history.replaceState(null,'',location.pathname);
  $('explorer').hidden=true;XD=null;
  $('back').hidden=true;$('ttl').textContent='Reports';$('meta').textContent=ADMIN?'These are the reports the VM can open.':'Choose a report to open.';
  try{const j=await (await get('/api/vm')).json();LIST=j.reports||[]}catch(_){showErr('Could not load the reports. Please refresh the page.');return}
  $('main').innerHTML=(LIST.length?`<div class="libgrid">${LIST.map(r=>`<div class="rep" role="button" tabindex="0" data-open="${esc(r.id)}"><span class="ic">${ICON}</span><b>${esc(r.title)}</b><span class="d">${esc(r.period||'')}${r.period?' · ':''}${nf.format(r.rows)} lines</span>${ADMIN?`<span><button class="btn bad" data-del="${esc(r.id)}" type="button">Remove</button></span>`:''}</div>`).join('')}</div>`
   :`<section class="card"><div class="empty">${ADMIN?'No report yet. Choose an Excel file above.':'There is no report yet. Please check again later.'}</div></section>`)+'<section class="card" id="sp"></section>';
  loadStores();
}
document.addEventListener('click',async e=>{
  const del=e.target.closest('[data-del]');
  if(del){e.stopPropagation();if(!confirm('Remove this report? The VM will no longer see it.'))return;
    await fetch('/api/vm?op=delete',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:del.dataset.del})});showLibrary();return}
  const o=e.target.closest('[data-open]');if(o)openReport(o.dataset.open);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.open){e.preventDefault();openReport(e.target.dataset.open)}});
$('back').onclick=showLibrary;

/* ---------- one report ---------- */
let R=null,S={store:'ALL',ops:false};
const OPS=/operation|packag|services|boxes|bags?\b/i;
const shortStore=s=>String(s).replace(/^\s*\d+\s*-\s*/,'').replace(/\s*-\s*[A-Z]{1,3}\s*$/,'').replace(/^Pandora\s+/i,'').trim()||String(s);
async function openReport(id){
  showErr('');
  try{const r=await get('/api/vm?id='+encodeURIComponent(id));if(!r.ok)throw 0;R=await r.json()}catch(_){showErr('Could not open that report.');return}
  history.replaceState(null,'','#'+id);S={store:'ALL',ops:false};
  $('back').hidden=false;$('ttl').textContent=R.title;$('meta').textContent=R.period||'';
  R.kind==='qty-by-category'?drawQty():drawTable();
  loadExplorer(id);
}
function drawTable(){
  const MAX=500;
  $('main').innerHTML=`<section class="card"><div class="tw"><table><thead><tr>${R.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${R.rows.slice(0,MAX).map(r=>`<tr>${R.columns.map((_,i)=>{const v=r[i];return v==null||v===''?'<td></td>':typeof v==='number'?`<td class="n">${nf.format(v)}</td>`:`<td>${esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>${R.rows.length>MAX?`<div class="note">Showing the first ${MAX} of ${nf.format(R.rows.length)} lines.</div>`:''}</section>`;
}
function prep(){
  const ix=re=>R.columns.findIndex(c=>re.test(c)),is=ix(/store|branch|location|shop/i),ic=ix(/categor|group|class/i),iq=ix(/qty|quantity|units|pieces|pcs/i);
  const cells=new Map(),stores=new Set(),cats=new Set();
  for(const r of R.rows){const q=+r[iq];if(!isFinite(q))continue;const st=shortStore(r[is]),ct=String(r[ic]||'Other').trim();
    if(!S.ops&&OPS.test(ct))continue;stores.add(st);cats.add(ct);const k=st+'\u0001'+ct;cells.set(k,(cells.get(k)||0)+q)}
  return{cells,stores:[...stores].sort((a,b)=>a.localeCompare(b)),cats:[...cats]};
}
function drawQty(){
  const P=prep(),q=(st,ct)=>P.cells.get(st+'\u0001'+ct)||0;
  const selStores=S.store==='ALL'?P.stores:P.stores.filter(x=>x===S.store);
  const catTot=P.cats.map(c=>({n:c,v:selStores.reduce((n,s)=>n+q(s,c),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const total=catTot.reduce((n,x)=>n+x.v,0);
  const stTot=P.stores.map(s=>({n:s,v:P.cats.reduce((n,c)=>n+q(s,c),0)})).sort((a,b)=>b.v-a.v);
  const allTotal=stTot.reduce((n,x)=>n+x.v,0);
  const maxCat=catTot[0]?catTot[0].v:0;
  const chips=['ALL',...P.stores].map(s=>`<button class="chip" type="button" data-store="${esc(s)}" aria-pressed="${s===S.store}">${s==='ALL'?'All stores':esc(s)}</button>`).join('');
  const kBest=catTot[0];
  const kpis=`<div class="kpis"><div class="kpi hero"><div class="k">Pieces sold</div><div class="v">${nf.format(total)}</div><div class="s">${S.store==='ALL'?'all stores':esc(S.store)}</div></div>
   <div class="kpi"><div class="k">Best category</div><div class="v">${kBest?esc(kBest.n):'-'}</div><div class="s">${kBest?nf.format(kBest.v)+' pieces · '+pc(kBest.v/total):''}</div></div>
   <div class="kpi"><div class="k">${S.store==='ALL'?'Best store':'Share of all stores'}</div><div class="v">${S.store==='ALL'?(stTot[0]?esc(stTot[0].n):'-'):pc((stTot.find(x=>x.n===S.store)||{v:0}).v/(allTotal||1))}</div><div class="s">${S.store==='ALL'?(stTot[0]?nf.format(stTot[0].v)+' pieces':''):'of all pieces sold'}</div></div>
   <div class="kpi"><div class="k">Categories</div><div class="v">${catTot.length}</div><div class="s">${P.stores.length} stores</div></div></div>`;
  const bars=catTot.map((x,i)=>`<div class="brow ${i===0?'top':''}" data-tip="${esc(x.n)}: ${nf.format(x.v)} pieces (${pc(x.v/total)} of ${S.store==='ALL'?'all stores':esc(S.store)})"><span class="n" title="${esc(x.n)}">${esc(x.n)}</span><span class="track"><span class="fill" style="display:block;width:${maxCat?Math.max(2,x.v/maxCat*100):0}%"></span></span><span class="val">${nf.format(x.v)}<small>${pc(x.v/total)}</small></span></div>`).join('')||'<div class="empty">Nothing to show.</div>';
  // heat map: category rows x store columns, darker pink = more pieces
  const cmax=Math.max(1,...P.cats.flatMap(c=>P.stores.map(s=>q(s,c))));
  const ramp=['#FFF3F5','#FFD9DE','#FFB8C0','#FF93A0','#F7707F'];
  const col=v=>v<=0?'transparent':ramp[Math.min(4,Math.floor(v/cmax*4.999))];
  const cats=[...P.cats].sort((a,b)=>catTot_all(b)-catTot_all(a));
  function catTot_all(c){return P.stores.reduce((n,s)=>n+q(s,c),0)}
  const heat=`<div class="heatwrap"><table class="heat"><thead><tr><th class="r">Category</th>${P.stores.map(s=>`<th><button class="chip" style="padding:3px 10px;font-size:11px" type="button" data-store="${esc(s)}" aria-pressed="${s===S.store}">${esc(s)}</button></th>`).join('')}<th class="t">All</th></tr></thead><tbody>
   ${cats.map(c=>`<tr><th class="r">${esc(c)}</th>${P.stores.map(s=>{const v=q(s,c);return v>0?`<td style="background:${col(v)}" data-tip="${esc(c)} · ${esc(s)}: ${nf.format(v)} pieces">${nf.format(v)}</td>`:`<td class="z">–</td>`}).join('')}<td class="t">${nf.format(catTot_all(c))}</td></tr>`).join('')}
   <tr><th class="r t">All categories</th>${P.stores.map(s=>`<td class="t">${nf.format(stTot.find(x=>x.n===s).v)}</td>`).join('')}<td class="t">${nf.format(allTotal)}</td></tr></tbody></table></div>
   <div class="scale"><span>Fewer</span><i></i><span>More pieces</span></div>`;
  const cards=stTot.map(s=>{const l=P.cats.map(c=>({n:c,v:q(s.n,c)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v),m=l[0]?l[0].v:1;
    return`<div class="sc"><h3>${esc(s.n)}</h3><div class="tot">${nf.format(s.v)} pieces</div>${l.map(x=>`<div class="mini" data-tip="${esc(x.n)}: ${nf.format(x.v)} pieces (${pc(x.v/s.v)} of ${esc(s.n)})"><span class="n">${esc(x.n)}</span><span class="q">${nf.format(x.v)}</span><span class="b" style="width:${Math.max(3,x.v/m*100)}%"></span></div>`).join('')}</div>`}).join('');
  const tbl=`<div class="tw"><table><thead><tr><th>Store</th>${cats.map(c=>`<th>${esc(c)}</th>`).join('')}<th>All</th></tr></thead><tbody>${stTot.map(s=>`<tr><td>${esc(s.n)}</td>${cats.map(c=>`<td class="n">${nf.format(q(s.n,c))}</td>`).join('')}<td class="n">${nf.format(s.v)}</td></tr>`).join('')}</tbody></table></div>`;
  $('main').innerHTML=`<section class="card filters"><div class="frow"><span class="lbl">Store</span><div class="chips">${chips}</div></div>
    <div class="frow"><span class="lbl">Include</span><div class="chips"><button class="chip" type="button" data-ops="1" aria-pressed="${S.ops}">Packaging &amp; operations</button></div></div></section>
   <section class="card">${kpis}</section>
   <section class="card"><h2>Pieces sold by category</h2><div class="meta">${S.store==='ALL'?'All stores together':esc(S.store)}. The darkest bar is the best seller.</div><div class="bars">${bars}</div></section>
   <section class="card"><h2>Which store sells what</h2><div class="meta">Each box is the number of pieces. Select a store name to focus on it.</div>${heat}</section>
   <section class="card"><h2>Each store at a glance</h2><div class="meta">Every category in each store, best seller first.</div><div class="stores">${cards}</div></section>
   <section class="card"><details class="tbl"><summary>Show the numbers as a table</summary>${tbl}</details></section>`;
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-store]');if(s&&R){S.store=S.store===s.dataset.store&&s.dataset.store!=='ALL'?'ALL':s.dataset.store;drawQty();return}
  if(e.target.closest('[data-ops]')&&R){S.ops=!S.ops;if(S.store!=='ALL'&&!prep().stores.includes(S.store))S.store='ALL';drawQty()}
});

/* ---------- Category explorer: pieces and shares only, for the dates of this report ---------- */
let XD=null,XID=null;const X={cat:'All',grp:'type',sel:null,q:'',branch:'All'};
const TYPE_RULES={
 Bracelets:[['Tennis',/tennis/],['Bangle',/bangle|cuff/],['Leather & cord',/leather|cord|braided|textile/],['Snake chain',/snake/],['Heart clasp',/clasp/],['Other chains & plain',/./]],
 Charms:[['Spacer',/spacer/],['Clip',/\bclips?\b/],['Medallion',/medallion/],['Murano glass',/murano/],['Mini dangle',/\bmini\b/],['Dangle',/dangle/],['Charm',/./]],
 Earrings:[['Stud',/stud/],['Hoop & huggie',/hoop|huggie/],['Drop & other',/./]],
 Necklaces:[['Collier',/collier/],['Pendant',/pendant/],['Chain necklace',/chain|rope|link/],['Necklace',/./]],
 Rings:[['Heart',/heart/],['Crown & tiara',/crown|tiara/],['Star, moon & sun',/star|moon|sun/],['Other rings',/./]],
 Other:[['Pendant',/pendant/],['Safety chain',/safety/],['Care & tools',/./]]
};
const METAL_RULES=[['Rose gold-plated',/rose gold/],['Silver & gold two-tone',/(silver|sterling).*(14k|gold-plated)|(14k|gold-plated).*(silver|sterling)/],['14K gold-plated',/14k|gold-plated/],['Rhodium-plated',/rhodium/],['Sterling silver',/sterling|silver/],['Not stated',/./]];
const xpick=(rules,name)=>{const n=String(name||'').toLowerCase();for(const [label,re] of rules)if(re.test(n))return label;return 'Other'};
const xType=r=>TYPE_RULES[r.category]?xpick(TYPE_RULES[r.category],r.name):(r.name||'Unspecified');
const xKey=r=>X.grp==='metal'?xpick(METAL_RULES,r.name):xType(r);
const xsum=(rows,f)=>rows.reduce((n,r)=>n+f(r),0);
const xpct=(a,b)=>b>0?(a/b*100).toFixed(a/b<0.1?1:0)+'%':'—';
const xgroup=(rows,f)=>{const m={};rows.forEach(r=>{const k=f(r);const o=m[k]||(m[k]={name:k,units:0});o.units+=r.qty});return Object.values(m).sort((a,b)=>b.units-a.units)};
const fmtDay=d=>{const t=new Date(d+'T12:00:00');return isNaN(t)?d:t.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][t.getMonth()]+' '+t.getFullYear()};
async function loadExplorer(id){
  const box=$('explorer');box.hidden=false;XD=null;XID=id;
  box.innerHTML='<h2>Category explorer</h2><div class="meta">Loading…</div>';
  Object.assign(X,{cat:'All',grp:'type',sel:null,q:'',branch:'All'});
  let j;
  try{const r=await get('/api/vm?explorer='+encodeURIComponent(id));j=await r.json();if(!r.ok)throw 0}catch(_){box.innerHTML='<h2>Category explorer</h2><div class="empty">Could not load the explorer. Please refresh the page.</div>';return}
  if(XID!==id)return;
  if(j.noDates){box.innerHTML='<h2>Category explorer</h2><div class="empty">The explorer needs the dates of this report, and they could not be found in the file name. Please ask for the report to be added again with its dates in the name.</div>';return}
  XD={from:j.from,to:j.to,rows:(j.rows||[]).map(r=>({branch:r[0]||'Unspecified',category:r[1]||'Unspecified',sku:r[2],name:r[3],qty:r[4]}))};
  drawExplorer();
}
function drawExplorer(){
  const box=$('explorer');if(!XD)return;
  const dates=XD.from===XD.to?fmtDay(XD.from):fmtDay(XD.from)+' – '+fmtDay(XD.to);
  const head='<h2>Category explorer</h2>';
  if(!XD.rows.length){box.innerHTML=head+`<div class="meta">${esc(dates)}</div><div class="empty">There are no sales lines saved for these dates yet.</div>`;return}
  const branches=[...new Set(XD.rows.map(r=>r.branch))].sort((a,b)=>a.localeCompare(b));
  if(X.branch!=='All'&&!branches.includes(X.branch))X.branch='All';
  const scope=XD.rows.filter(r=>X.branch==='All'||r.branch===X.branch),cats=xgroup(scope,r=>r.category||'Unspecified').map(c=>c.name);
  if(X.cat!=='All'&&!cats.includes(X.cat)){X.cat='All';X.sel=null}
  const totalAll=xsum(scope,r=>r.qty);
  const catRows=X.cat==='All'?scope:scope.filter(r=>(r.category||'Unspecified')===X.cat);
  const words=X.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const qRows=words.length?catRows.filter(r=>{const hay=((r.sku||'')+' '+r.name+' '+(r.category||'')+' '+xType(r)+' '+xpick(METAL_RULES,r.name)).toLowerCase();return words.every(w=>hay.includes(w))}):catRows;
  const totalCat=xsum(catRows,r=>r.qty);
  const keyFn=X.cat==='All'?(r=>r.category||'Unspecified'):xKey;
  const list=xgroup(qRows,keyFn);
  if(X.sel&&!list.some(x=>x.name===X.sel))X.sel=null;
  const max=Math.max(1,...list.map(x=>Math.abs(x.units))),total=xsum(qRows,r=>r.qty);
  const chips=['All',...cats].map(c=>`<button class="chip" type="button" data-xcat="${esc(c)}" aria-pressed="${c===X.cat}">${c==='All'?'All categories':esc(c)}</button>`).join('');
  const sel=`<select id="xBranch" aria-label="Store" style="width:auto;min-width:150px"><option value="All">All stores</option>${branches.map(b=>`<option value="${esc(b)}"${b===X.branch?' selected':''}>${esc(shortStore(b))}</option>`).join('')}</select>`;
  const seg=X.cat==='All'?'':`<div class="seg" role="group" aria-label="Group by"><button type="button" data-xg="type" aria-pressed="${X.grp==='type'}">By type</button><button type="button" data-xg="metal" aria-pressed="${X.grp==='metal'}">By metal</button></div>`;
  const rowsHtml=list.length?list.map(x=>`<button class="xrow" type="button" data-xsel="${esc(x.name)}" aria-pressed="${x.name===X.sel}" title="${esc(x.name)}"><span><span class="xname">${esc(x.name)}</span><span class="xmeta">${xpct(x.units,total)} of ${X.cat==='All'?'all pieces':esc(X.cat.toLowerCase())}</span></span><span class="track"><span class="fill" style="display:block;width:${Math.max(2,Math.abs(x.units)/max*100)}%"></span></span><span class="xval">${nf.format(x.units)}<small>pieces</small></span></button>`).join(''):'<div class="xempty">Nothing matches that search for these dates and this store.</div>';
  const selRows=X.sel?qRows.filter(r=>keyFn(r)===X.sel):qRows;
  let title=X.sel?(X.cat==='All'?X.sel:X.cat+' · '+X.sel):(X.cat==='All'?'All categories':'All '+X.cat.toLowerCase());
  if(words.length)title+=` matching “${X.q.trim()}”`;
  const un=xsum(selRows,r=>r.qty);
  const pm={};selRows.forEach(r=>{const k=(r.sku||'—')+'|'+(r.name||'Unspecified');const o=pm[k]||(pm[k]={sku:r.sku||'—',name:r.name||'Unspecified',units:0});o.units+=r.qty});
  const prods=Object.values(pm).sort((a,b)=>b.units-a.units).slice(0,5);
  const br=xgroup(selRows,r=>r.branch||'Unspecified').slice(0,6),brMax=Math.max(1,...br.map(x=>Math.abs(x.units)));
  const detail=selRows.length?`<h4>${esc(title)}</h4>
   <div class="xk"><div><span>Pieces</span><b>${nf.format(un)}</b></div><div><span>Share</span><b>${xpct(un,totalAll)}</b><small>of all pieces</small></div><div><span>${X.cat==='All'?'Categories':'Of '+esc(X.cat.toLowerCase())}</span><b>${X.cat==='All'?new Set(selRows.map(r=>r.category)).size:xpct(un,totalCat)}</b></div></div>
   <div class="xh">Top products</div><div class="xtop5">${prods.map(p=>`<div class="xp"><span title="${esc(p.sku)} · ${esc(p.name)}">${esc(p.name)}<em><i class="xsku">${esc(p.sku)}</i></em></span><b>${nf.format(p.units)}<small>${xpct(p.units,un)}</small></b></div>`).join('')}</div>
   <div class="xh">By store</div><div class="xbr">${br.map(b=>`<div class="brow"><span class="n" title="${esc(b.name)}">${esc(shortStore(b.name))}</span><span class="track"><span class="fill" style="display:block;width:${Math.max(2,Math.abs(b.units)/brMax*100)}%"></span></span><span class="val">${nf.format(b.units)}<small>${xpct(b.units,un)}</small></span></div>`).join('')}</div>`:'<div class="xempty">Nothing to show.</div>';
  const keep=document.activeElement&&document.activeElement.id==='xSearch';
  box.innerHTML=`${head}<div class="meta">${esc(dates)} · the dates of this report. Pieces and shares only.</div>
   <div class="xhead"><div class="chips">${chips}</div>${seg}</div>
   <div class="frow" style="margin-bottom:6px"><span class="lbl">Store</span>${sel}</div>
   <input class="xsearch" id="xSearch" type="search" placeholder="Ask about a type, product or SKU, e.g. bangle, dangle, 590745" aria-label="Search types, products and SKUs" value="${esc(X.q)}">
   <div class="exp-grid"><div class="xlist">${rowsHtml}</div><div class="xdetail">${detail}</div></div>`;
  if(keep){const i=$('xSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-xcat]'),g=e.target.closest('[data-xg]'),s=e.target.closest('[data-xsel]');
  if(c){X.cat=c.dataset.xcat;X.sel=null;drawExplorer()}
  else if(g){X.grp=g.dataset.xg;X.sel=null;drawExplorer()}
  else if(s){X.sel=X.sel===s.dataset.xsel?null:s.dataset.xsel;drawExplorer()}
});
document.addEventListener('input',e=>{if(e.target.id==='xSearch'){X.q=e.target.value;X.sel=null;drawExplorer()}});
document.addEventListener('change',e=>{if(e.target.id==='xBranch'){X.branch=e.target.value;X.sel=null;drawExplorer()}});

/* ---------- Store UPT and ATV (whole store only, never people) ---------- */
const SP={from:'',to:'',min:'',max:'',n:0,t:0};
const egp0=n=>'EGP '+nf.format(n),upt2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const DIN='height:38px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font:inherit;color:var(--ink);background:var(--bg)';
async function loadStores(){
  const box=$('sp');if(!box)return;
  if(!$('spBody'))box.innerHTML='<h2>Store UPT &amp; ATV</h2><div class="meta">Loading…</div>';
  else $('spBody').style.opacity='.5';
  const my=++SP.n;let j;
  try{const r=await get('/api/vm?stores=1'+(SP.from?'&from='+SP.from:'')+(SP.to?'&to='+SP.to:''));j=await r.json();if(!r.ok)throw 0}catch(_){if(my===SP.n&&$('sp'))$('sp').innerHTML='<h2>Store UPT &amp; ATV</h2><div class="empty">Could not load this. Please refresh the page.</div>';return}
  if(my!==SP.n||!$('sp'))return; // a newer date pick is already on its way
  SP.min=j.min;SP.max=j.max;
  if(!SP.from&&j.max){SP.from=j.max.slice(0,8)+'01';SP.to=j.max;return loadStores()} // first time: the latest month with sales
  drawStores(j);
}
function drawStores(j){
  const box=$('sp');if(!box)return;
  const rows=j.stores||[];
  const line=(name,x,strong)=>`<tr${strong?' style="font-weight:800;background:var(--fill-soft)"':''}><td>${esc(name)}</td><td class="n">${upt2.format(x.upt)}</td><td class="n">${egp0(x.atv)}</td></tr>`;
  if(!$('spFrom')){ // the date boxes are drawn once and then left alone, so the calendar never closes under the VM's hand
    box.innerHTML=`<h2>Store UPT &amp; ATV</h2><div class="meta">UPT is pieces per invoice. ATV is the average invoice value, including VAT. Whole-store numbers only. <span id="spRange"></span></div>
     <div class="frow" style="margin-bottom:12px"><span class="lbl">From</span><input type="date" id="spFrom" style="${DIN}"><span class="lbl">To</span><input type="date" id="spTo" style="${DIN}"></div><div id="spBody"></div>`;
  }
  if($('spFrom').value!==SP.from)$('spFrom').value=SP.from;
  if($('spTo').value!==SP.to)$('spTo').value=SP.to;
  $('spRange').textContent=SP.min?'Sales are saved from '+fmtDay(SP.min)+' to '+fmtDay(SP.max)+'.':'';
  $('spBody').style.opacity='1';
  $('spBody').innerHTML=rows.length?`<div class="tw"><table><thead><tr><th>Store</th><th>UPT</th><th>ATV</th></tr></thead><tbody>${line('All stores',j.all,true)}${rows.map(x=>line(shortStore(x.branch),x,false)).join('')}</tbody></table></div>`:'<div class="empty">There are no sales saved for these dates.</div>';
}
function spPicked(){
  const a=$('spFrom'),b=$('spTo');if(!a||!b||!a.value||!b.value)return; // wait until both dates are filled in
  let f=a.value,t=b.value;
  if(f>t){if(document.activeElement===a)t=f;else f=t} // keep the range valid: move the other date, never swap them
  SP.from=f;SP.to=t;a.value=f;b.value=t;
  clearTimeout(SP.t);SP.t=setTimeout(loadStores,200);
}
['change','input'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.id==='spFrom'||e.target.id==='spTo')spPicked()}));
/* tooltips */
const tip=$('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.textContent=t.dataset.tip;tip.style.display='block'});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY+16)+'px'}});

/* ---------- super admin: add a report ---------- */
if(ADMIN){$('feed').hidden=false;
  const f=$('file'),drop=$('drop');$('pick').onclick=()=>f.click();f.onchange=()=>f.files[0]&&upload(f.files[0]);
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',e=>{const x=e.dataTransfer.files[0];if(x)upload(x)});
  async function upload(file){
    showErr('');$('status').textContent='Reading…';
    try{
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      const iso=v=>v instanceof Date?v.toISOString().slice(0,10):v;
      const sheets=wb.SheetNames.map(n=>{const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false});
        const cols=(g[0]||[]).map((c,i)=>c==null||c===''?'Column '+(i+1):String(c));
        return{name:n,columns:cols,rows:g.slice(1).map(r=>cols.map((_,i)=>iso(r[i]===undefined?null:r[i])))}}).filter(s=>s.columns.length);
      if(!sheets.length)throw new Error('The file has no data.');
      $('status').textContent='Cleaning and publishing…';
      const gz=await new Response(new Blob([JSON.stringify({file:file.name,sheets})]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      const r=await fetch('/api/vm',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/octet-stream'},body:gz});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(j.error||'Could not publish.');
      $('status').textContent='Added.'+(j.removed&&j.removed.length?' Removed automatically: '+j.removed.join(', ')+'.':'');showLibrary();
    }catch(e){$('status').textContent='';showErr(e.message||'Could not read that file.')}
    f.value='';
  }
}
showLibrary().then(()=>{const id=location.hash.slice(1);if(id)openReport(id)});
</script>
