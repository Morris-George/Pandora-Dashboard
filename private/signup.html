<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora — Create account</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3f1,#151413);--surface:light-dark(#fff,#211f1d);--surface2:light-dark(#faf8f6,#292623);--text:light-dark(#282522,#f7f2ed);--muted:light-dark(#817a74,#b7aea6);--line:light-dark(#e9e2dc,#3a3530);--accent:#9e174d;--accent2:#d85b83}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,var(--surface) 0%,var(--bg) 68%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.panel{width:min(100%,420px);padding:38px 34px 30px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #4b17300d;text-align:center}.logo{display:block;width:min(230px,78%);max-height:120px;object-fit:contain;margin:0 auto 26px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:750}.title{font-size:26px;letter-spacing:-.04em;margin:10px 0 8px}.sub{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 28px}form{text-align:left}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;color:var(--text);background:var(--surface2);outline:none}.field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #d85b831c}.password-wrap{position:relative}.password-wrap input{padding-right:68px}.toggle{position:absolute;right:10px;top:0;height:48px;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}.submit{width:100%;height:49px;margin-top:7px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:750;cursor:pointer}.submit:hover{background:#80123e}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;color:light-dark(#a32236,#ff9aa6);background:light-dark(#fff0f1,#3a1f24);border:1px solid light-dark(#f3cbd0,#6a2b35);border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.4;margin:0 0 16px}.foot{font-size:11px;color:var(--muted);margin:23px 0 0}.rule{width:42px;height:3px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:0 auto 20px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}.pick{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:14px 10px;font:inherit;font-size:13px;font-weight:750;cursor:pointer;line-height:1.3}.pick small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}.pick:hover{border-color:var(--accent2)}.pick[aria-pressed="true"]{border-color:var(--accent);background:light-dark(#fdf0f4,#33202a);box-shadow:0 0 0 2px #9e174d33}.pick:focus-visible,.submit:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.hint{font-size:13px;color:var(--muted);margin:0 0 6px;text-align:center}@media(max-width:380px){.choose{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}

select{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;color:var(--text);background:var(--surface2);outline:none}
select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #d85b831c}
.step[hidden]{display:none}.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:10px 0 0;font-size:13px}
.ok{display:none;color:light-dark(#14633b,#8fe0b4);background:light-dark(#eefaf3,#16301f);border:1px solid light-dark(#bfe6cd,#2c5a3b);border-radius:9px;padding:12px;font-size:14px;line-height:1.5;margin:0 0 16px;text-align:left}
.small{font-size:12px;color:var(--muted);margin:6px 0 0}.link{color:var(--accent);font-weight:700}
</style></head>
<body><main class="panel"><img class="logo" src="/pandora-logo.png" alt="Pandora"><div class="rule"></div><div class="eyebrow">Sales people</div><h1 class="title">Create your account</h1><p class="sub" id="sub">Use your mobile number. We will send you a code by text message.</p>
<div class="error" id="error" role="alert"></div><div class="ok" id="okbox" role="status"></div>

<form class="step" id="s1"><div class="field"><label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01012345678" required></div><button class="submit" type="submit">Send code</button></form>

<form class="step" id="s2" hidden><div class="field"><label for="code">Code from the text message</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required></div><button class="submit" type="submit">Verify</button><button class="back" type="button" id="back2">Use a different number</button></form>

<form class="step" id="s3" hidden>
<div class="field"><label for="store">Your store</label><select id="store" required></select></div>
<div class="field"><label for="name">Your name</label><select id="name" required></select><p class="small">Pick your name exactly as it appears in the sales report. Your manager checks it before your account opens.</p></div>
<div class="field"><label for="user">Choose a username</label><input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required><p class="small">3 to 30 letters or numbers, no spaces.</p></div>
<div class="field"><label for="pw">Choose a password</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required><p class="small">At least 8 characters.</p></div>
<div class="field"><label for="pw2">Type the password again</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
<button class="submit" type="submit">Create account</button></form>

<p class="foot"><a class="link" href="/login.html?project=staff">I already have an account</a></p></main>
<script>
const $=id=>document.getElementById(id),err=$('error'),okb=$('okbox');
let phone='',token='',names=[];
const show=n=>{['s1','s2','s3'].forEach(k=>$(k).hidden=k!=='s'+n)};
const fail=m=>{okb.style.display='none';err.textContent=m;err.style.display='block'};
const clear=()=>{err.style.display='none'};
async function call(body){try{const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));return{ok:r.ok&&j.ok,j}}catch(e){return{ok:false,j:{error:'No connection. Please try again.'}}}}
function busy(form,on,label){const b=form.querySelector('.submit');b.disabled=on;if(label)b.textContent=label}
$('s1').addEventListener('submit',async e=>{e.preventDefault();clear();const f=e.target;busy(f,true);const r=await call({action:'send',phone:$('phone').value});busy(f,false);
 if(!r.ok)return fail(r.j.error||'Something went wrong.');phone=r.j.phone;$('sub').textContent='We sent a code to '+phone+'.';show(2);$('code').focus()});
$('back2').onclick=()=>{clear();$('sub').textContent='Use your mobile number. We will send you a code by text message.';show(1)};
$('s2').addEventListener('submit',async e=>{e.preventDefault();clear();const f=e.target;busy(f,true);const r=await call({action:'verify',phone,code:$('code').value});busy(f,false);
 if(!r.ok)return fail(r.j.error||'Something went wrong.');token=r.j.token;names=r.j.names||[];
 if(!names.length)return fail('No names are available to choose. Please ask your manager.');
 const stores=[...new Set(names.map(n=>n.store))];$('store').innerHTML=stores.map(s=>'<option>'+esc(s)+'</option>').join('');fillNames();$('sub').textContent='Number verified. Now choose your name and a login.';show(3)});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillNames(){const st=$('store').value;$('name').innerHTML=names.filter(n=>n.store===st).map(n=>'<option>'+esc(n.name)+'</option>').join('')}
$('store').onchange=fillNames;
$('s3').addEventListener('submit',async e=>{e.preventDefault();clear();if($('pw').value!==$('pw2').value)return fail('The two passwords are not the same.');
 const f=e.target;busy(f,true);const r=await call({action:'create',token,store:$('store').value,name:$('name').value,username:$('user').value,password:$('pw').value});busy(f,false);
 if(!r.ok)return fail(r.j.error||'Something went wrong.');
 ['s1','s2','s3'].forEach(k=>$(k).hidden=true);$('sub').textContent='';okb.textContent='Your account was created. Your manager will approve it, then you can sign in with your username and password.';okb.style.display='block'});
</script></body></html>
