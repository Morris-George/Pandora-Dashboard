<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sales Person</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: header + hero, coaching cards, then chart cards in a two-column grid. One brand hue (pink) with a muted rose-gray for everything that is not the point. */
:root{
  --bg:#FBF6F7; --surface:#FFFFFF; --ink:#2A1F24; --ink2:#6B5A61; --line:#EADCDF;
  --accent:#FF93A0;--accent-text:#2A1F24; --fill:#FF93A0; --fill-soft:#FFE4E8; --hover:#FFF1F3; --mute:#D9C8CD;
  --good:#1F7A4D; --bad:#FF93A0;
  --s1:#FFD3D8; --s2:#FFB3BC; --s3:#FF93A0; --s4:#F27A8A;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171013; --surface:#241A1E; --ink:#F6EBEE; --ink2:#B9A5AC; --line:#3A2A30;
  --accent:#FF93A0;--accent-text:#FF93A0; --fill:#FF93A0; --fill-soft:#3A2229; --hover:#2D2025; --mute:#5A4650;
  --good:#5CC48E; --bad:#FF93A0;
  --s1:#7A3A48; --s2:#B5566A; --s3:#FF93A0; --s4:#FFC4CB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171013; --surface:#241A1E; --ink:#F6EBEE; --ink2:#B9A5AC; --line:#3A2A30;
  --accent:#FF93A0;--accent-text:#FF93A0; --fill:#FF93A0; --fill-soft:#3A2229; --hover:#2D2025; --mute:#5A4650;
  --good:#5CC48E; --bad:#FF93A0;
  --s1:#7A3A48; --s2:#B5566A; --s3:#FF93A0; --s4:#FFC4CB; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{word-spacing:.09em;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start;justify-content:space-between}
.crumb{color:var(--ink2);font-size:12.5px;font-weight:600;text-decoration:none;display:inline-block;margin-bottom:4px}
.crumb:hover{color:var(--accent-text)}
.brand h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.brand .sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--hover)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.cardhead h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.cardhead .meta{color:var(--ink2);font-size:12.5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.hint{color:var(--ink2);font-size:12px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:18px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.heroleft{background:var(--fill-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.heroleft .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap;min-width:0}
.heroleft .big small{font-size:16px;font-weight:700;color:var(--ink2);margin-inline-end:4px}
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent);color:#2A1018}
:root[data-theme="dark"] .pill{color:#2A1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#2A1018}}
.pill.soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .pill.soft{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.soft{color:var(--ink)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:10px 12px;border-radius:12px;background:var(--bg);min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700}
.kpi{min-width:0}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.delta{font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;color:var(--ink2)}
.delta.up{color:var(--good)} .delta.down{color:var(--accent-text)}
.delta svg{width:10px;height:10px;flex:none}

/* coaching */
.coach{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.tip{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tip .tag{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink2)}
.tip .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--fill-soft);color:var(--accent-text)}
.tip.win .ic{background:var(--good);color:#fff}
:root[data-theme="dark"] .tip.win .ic{color:#10261b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip.win .ic{color:#10261b}}
.tip h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.tip p{margin:0;color:var(--ink2);font-size:13px}
.tip .est{margin-top:auto;padding-top:6px;font-weight:800;color:var(--accent-text);font-size:13px}
.tip .est small{display:block;color:var(--ink2);font-weight:500;font-size:11.5px}

/* bars */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#2A1018}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#2A1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#2A1018}}
.bars{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 104px;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;text-decoration:none;color:inherit}
.brow:hover,.brow:focus-visible{background:var(--hover)}
.brow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .track{height:14px;position:relative}
.brow .fill{display:block;height:100%;background:var(--mute);border-radius:0 5px 5px 0;min-width:2px}
.brow.top .fill,.brow.me .fill{background:var(--accent)}
.brow .val{text-align:end;font-weight:700;white-space:nowrap;min-width:0}
.brow .val small{display:block;font-weight:500;color:var(--ink2);font-size:11px;margin-top:-2px}
.brow.me .n{color:var(--accent-text);font-weight:800}
.colbars .brow{grid-template-columns:minmax(90px,150px) 1fr minmax(128px,auto)}
@media (max-width:620px){.colbars .brow{grid-template-columns:84px 1fr minmax(112px,auto)}}
.bullet .track{background:color-mix(in srgb,var(--mute) 35%,transparent);border-radius:0 5px 5px 0}
.bullet .fill{background:var(--accent)}
.bullet .mark{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.bullet .gap{color:var(--accent-text);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink2);font-size:12px;margin-bottom:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legend i.tick{width:3px;height:14px;border-radius:2px;background:var(--ink);vertical-align:-3px}

.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack span{display:block;height:100%;border-left:2px solid var(--surface)}
.stack span:first-child{border-left:0}
.srow{display:grid;grid-template-columns:70px 1fr 110px;gap:10px;align-items:center;padding:6px}
.srow .n{font-weight:700}
.srow .val{text-align:end;font-weight:700;white-space:nowrap;min-width:0}
.srow .val small{display:block;font-weight:500;color:var(--ink2);font-size:11px}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--font);fill:var(--ink2);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .col{fill:var(--mute)}
svg.chart .col.peak{fill:var(--accent)}
svg.chart text.avglbl{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;font-weight:700}
svg.chart .avg{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:4 4}
svg.chart g.hit:hover .col,svg.chart g.hit:focus .col{fill:var(--fill)}
svg.chart g.hit:hover .col.peak{fill:var(--accent)}
svg.chart g.hit{outline:none}

table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
details.tbl{margin-top:12px}
details.tbl summary{cursor:pointer;color:var(--ink2);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.note{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--ink2);background:var(--surface)}
.note b{color:var(--ink)}

#tip{position:fixed;z-index:10000;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;max-width:260px;opacity:0;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip.on{opacity:1}

body.solo .nav, body.solo #prev, body.solo #next{display:none}
body.clean .nav, body.clean .hideclean, body.clean .hint, body.clean details.tbl, body.clean .chips.sw{display:none}
.exit{display:none;position:fixed;inset-inline-end:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:5;opacity:.55}
body.clean .exit{display:block}
@media (max-width:620px){.brow{grid-template-columns:96px 1fr 88px}.heroleft .big{font-size:32px}}
@media (prefers-reduced-motion:no-preference){.brow .fill{transition:width .3s ease}}

.datebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.datebar .dlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.datebar .dlab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.datebar input[type=date]{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit}
.datebar .dmsg{color:var(--ink2);font-size:12.5px;font-weight:600}
body.clean .datebar{display:none}
.datebar .mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-basis:100%}

/* Arabic: right-to-left, an Arabic font, and no letter-spacing or capitals (they break joined Arabic letters) */
html[lang="ar"]{--font:'Cairo','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
html[lang="ar"] body{word-spacing:normal}
html[lang="ar"] *{letter-spacing:0!important;text-transform:none!important}
html[dir="rtl"] .brow .fill{border-radius:5px 0 0 5px}
html[dir="rtl"] .bullet .track{border-radius:5px 0 0 5px}
html[dir="rtl"] .brow .n{unicode-bidi:plaintext;text-align:right}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <a class="crumb nav" id="crumb" href="/staff">&larr; Staff Performance</a>
      <h1 id="pname">Sales person</h1>
      <div class="sub" id="psub"></div>
    </div>
    <div class="actions">
      <button class="btn hideclean" id="langBtn" type="button" lang="ar" aria-label="Show this page in Arabic">العربية</button>
      <a class="btn hideclean" id="prev" href="#" data-i18n="prev" data-i18n-aria="prevAria" aria-label="Previous sales person in this store">&larr; Prev</a>
      <a class="btn hideclean" id="next" href="#" data-i18n="next" data-i18n-aria="nextAria" aria-label="Next sales person in this store">Next &rarr;</a>
      <button class="btn hideclean" id="cleanBtn" type="button" data-i18n="clean">Screenshot view</button>
    </div>
  </header>
  <section class="datebar hideclean" id="dateRow" hidden aria-label="Dates" data-i18n-aria="dates">
    <div class="mrow" id="monthRow" hidden><span class="dlbl" data-i18n="month">Month</span><div class="chips" id="monthChips"></div></div>
    <span class="dlbl" data-i18n="dates">Dates</span>
    <label class="dlab"><span data-i18n="from">From</span> <input type="date" id="dFrom"></label><label class="dlab"><span data-i18n="to">To</span> <input type="date" id="dTo"></label>
    <button class="btn" type="button" id="dLast7" data-i18n="last7">Last 7 days</button><button class="btn" type="button" id="dAll" data-i18n="whole">Whole period</button>
    <span class="dmsg" id="dMsg" role="status"></span>
  </section>
  <button class="btn exit" id="exitClean" type="button" data-i18n="exitClean">Exit screenshot view</button>
  <main id="out" style="display:flex;flex-direction:column;gap:16px;width:100%"></main>
</div>
<div id="tip" role="tooltip"></div>

<script>
const VAT=1.14, KEY='storeStaffSummary.v1', EXKEY='storeStaffSummary.ex.v1';
const DEFAULT_EX=/packaging|services|jewellery boxes/i;
/* ---- who is signed in: the server tells the page the role. Managers only ever see the stores of their own zone. ---- */
const ROLE=window.__PANDORA_ROLE||{role:'admin',label:'Super admin',allow:null,zones:null};
const ALLOW=ROLE.allow?ROLE.allow.map(s=>new RegExp(s,'i')):null;
const storeOk=n=>!ALLOW||ALLOW.some(r=>r.test(n));
const hideTeam=n=>/^\s*sales\s*team\s*$/i.test(n);
function scopeData(d){
  if(!ALLOW&&!d.stores.some(hideTeam)) return d;
  const sMap=new Map(),stores=[]; d.stores.forEach((s,i)=>{if(storeOk(s)&&!hideTeam(s)){sMap.set(i,stores.length);stores.push(s)}});
  const pMap=new Map(),people=[]; d.people.forEach((p,i)=>{if(sMap.has(p[1])){pMap.set(i,people.length);people.push([p[0],sMap.get(p[1])])}});
  const rows=[]; for(const r of d.rows){const np=pMap.get(r[0]); if(np!==undefined){const c=r.slice();c[0]=np;rows.push(c)}}
  return {...d,stores,people,rows};
}

const $=id=>document.getElementById(id);
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- language: English / Arabic (saved in this browser) ----------
   Item names, card titles (TITLES_EN) and category / collection names always stay in English; everything else follows the language.
   To translate the card titles too, set TITLES_EN to false. */
const LKEY='pandora.lang', TITLES_EN=true;
let LANG='en'; try{const v=localStorage.getItem(LKEY); if(v==='ar'||v==='en')LANG=v}catch(_){}
const AR=()=>LANG==='ar';
const TX={
  prev:['← Prev','→ السابق'], next:['Next →','التالي ←'],
  prevAria:['Previous sales person in this store','موظف المبيعات السابق في هذا الفرع'], nextAria:['Next sales person in this store','موظف المبيعات التالي في هذا الفرع'],
  clean:['Screenshot view','وضع لقطة الشاشة'], exitClean:['Exit screenshot view','إغلاق وضع لقطة الشاشة'],
  dates:['Dates','التواريخ'], month:['Month','الشهر'], from:['From','من'], to:['To','إلى'], last7:['Last 7 days','آخر 7 أيام'], whole:['Whole period','الفترة كاملة'], loading:['Loading…','جارٍ التحميل…'],
  person:['Sales person','موظف المبيعات'], vat:['all amounts include VAT','كل المبالغ شاملة الضريبة'],
  E_sign:['Signing you in…','جارٍ تسجيل دخولك…'], E_nopub:['No sales have been published yet','لم يتم نشر أي مبيعات بعد'],
  E_nofile:['No sales file is loaded in this browser','لا يوجد ملف مبيعات محمّل في هذا المتصفح'],
  E_myRange:['No sales found for you between these dates','لا توجد مبيعات لك بين هذين التاريخين'],
  E_myFile:['No sales found for you in this month’s file yet','لا توجد مبيعات لك في ملف هذا الشهر حتى الآن'],
  E_myMonth:['No sales found for you this month yet','لا توجد مبيعات لك هذا الشهر حتى الآن'],
  E_notfound:['That sales person was not found in the loaded file','لم يتم العثور على هذا الموظف في الملف المحمّل'],
  E_pRange:['No sales for this person between these dates','لا توجد مبيعات لهذا الموظف بين هذين التاريخين'],
  E_pMonth:['No sales for this person this month','لا توجد مبيعات لهذا الموظف هذا الشهر'],
  tailStaff:['Please check again later, or ask your manager.','من فضلك حاول مرة أخرى لاحقًا، أو اسأل مديرك.']
};
const t=k=>{const x=TX[k];return x?x[AR()?1:0]:k};
const H=(en,ar)=>(AR()&&!TITLES_EN)?ar:en; // card titles
const AR_WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MON={Jan:'يناير',Feb:'فبراير',Mar:'مارس',Apr:'أبريل',May:'مايو',Jun:'يونيو',Jul:'يوليو',Aug:'أغسطس',Sep:'سبتمبر',Oct:'أكتوبر',Nov:'نوفمبر',Dec:'ديسمبر'};
const trPeriod=p=>{p=String(p||''); return AR()?p.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b/g,(m,a)=>AR_MON[a]||m):p};
const LBL={'the store average':'متوسط الفرع','your store':'فرعك','all stores':'كل الفروع'};
const lb=s=>AR()?(LBL[s]||s):s;
const pcs=()=>AR()?'قطعة':'pieces';
const iso=s=>AR()?String(s).replace(/EGP\s[\d,.]+|\d[\d,.]*%/g,m=>'\u2066'+m+'\u2069'):s; // keeps amounts and percentages in order inside Arabic text
function applyLang(){
  const de=document.documentElement; de.lang=LANG; de.dir=AR()?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
  const b=$('langBtn'); if(b){b.textContent=AR()?'English':'العربية'; b.lang=AR()?'en':'ar'; b.setAttribute('aria-label',AR()?'عرض الصفحة بالإنجليزية':'Show this page in Arabic')}
}
function setLang(l){
  LANG=l; try{localStorage.setItem(LKEY,l)}catch(_){}
  applyLang();
  drawMonths();
  if(CTX){setHead();render()} else if(LASTERR) noData(LASTERR);
}

/* long numbers never wrap: they get a little smaller until they fit */
function fitNums(){
  document.querySelectorAll('.kpi .v,.big,.brow .val,.srow .val').forEach(el=>{
    el.style.fontSize='';
    let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    while(el.scrollWidth>el.clientWidth+1&&fs>9&&n++<40){fs-=0.5;el.style.fontSize=fs+'px'}
  });
}
addEventListener('resize',()=>{clearTimeout(fitNums.t);fitNums.t=setTimeout(fitNums,80)});
try{document.fonts&&document.fonts.ready.then(fitNums)}catch(_){}
const pct=v=>nf0.format(v*100)+'%';
const short=v=>Math.abs(v)>=1e6?nf1.format(v/1e6)+'M':Math.abs(v)>=1e3?nf1.format(v/1e3).replace('.0','')+'k':nf0.format(v);
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WDFULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEK_ORDER=[6,0,1,2,3,4,5]; // Saturday first
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function safeGet(k){for(const name of ['localStorage','sessionStorage']){try{const v=JSON.parse(window[name].getItem(k));if(v)return v}catch(e){}}return null}
const dayDate=n=>new Date(n*86400000); // UTC based
const dayLabel=n=>{const d=dayDate(n);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const personUrl=(store,name)=>'/staff/person?store='+encodeURIComponent(store)+'&name='+encodeURIComponent(name)+(dateQs()?'&'+dateQs():'');

/* ---------- data ---------- */
function prep(d){
  const saved=safeGet(EXKEY)||{ex:[],known:[]};
  const exIdx=new Set(); let exCount=0;
  if(SERVER&&Array.isArray(d.ex)) d.groups.forEach((g,i)=>{if(d.ex.includes(g)){exIdx.add(i);exCount++}});
  else d.groups.forEach((g,i)=>{const known=saved.known.includes(g); if(known?saved.ex.includes(g):DEFAULT_EX.test(g)){exIdx.add(i);exCount++}});
  const P=d.people.map(()=>({inv:new Map(),g:new Map(),day:new Map(),item:new Map(),qty:0,amt:0}));
  let dmin=null,dmax=null,hasDate=false,hasItem=false;
  for(const r of d.rows){
    if(r[5]!=null){hasDate=true; if(dmin===null||r[5]<dmin)dmin=r[5]; if(dmax===null||r[5]>dmax)dmax=r[5]}
    if(exIdx.has(r[1])) continue;
    const p=P[r[0]];
    let iv=p.inv.get(r[2]); if(!iv){iv={q:0,a:0};p.inv.set(r[2],iv)} iv.q+=r[3]; iv.a+=r[4];
    p.qty+=r[3]; p.amt+=r[4];
    let g=p.g.get(r[1]); if(!g){g={q:0,a:0,inv:new Set()};p.g.set(r[1],g)} g.q+=r[3]; g.a+=r[4]; g.inv.add(r[2]);
    if(r[5]!=null){let x=p.day.get(r[5]); if(!x){x={a:0,inv:new Set()};p.day.set(r[5],x)} x.a+=r[4]; x.inv.add(r[2])}
    if(r[6]!=null){hasItem=true; let x=p.item.get(r[6]); if(!x){x={q:0,a:0};p.item.set(r[6],x)} x.q+=r[3]; x.a+=r[4]}
  }
  return{P,exIdx,exCount,hasDate,hasItem,dmin,dmax};
}
function pool(P,S){
  let inv=0,qty=0,amt=0,n=0; const pen=new Map(),gamt=new Map(),b=[0,0,0,0];
  for(const i of S){const p=P[i]; if(!p.inv.size) continue; n++; inv+=p.inv.size; qty+=p.qty; amt+=p.amt;
    for(const [g,v] of p.g){pen.set(g,(pen.get(g)||0)+v.inv.size); gamt.set(g,(gamt.get(g)||0)+v.a)}
    for(const v of p.inv.values()){const q=v.q; if(q>0) b[q<=1?0:q<=2?1:q<=3?2:3]++}}
  const incl=amt*VAT;
  return{n,inv,qty,amt,incl,upt:inv?qty/inv:0,atv:inv?incl/inv:0,pen,gamt,b,bt:b[0]+b[1]+b[2]+b[3],avgIncl:n?incl/n:0,avgInv:n?inv/n:0,avgQty:n?qty/n:0};
}

/* ---------- small renderers ---------- */
const arrow=up=>`<svg viewBox="0 0 10 10" aria-hidden="true"><path d="${up?'M5 1 9 8H1z':'M5 9 1 2h8z'}" fill="currentColor"/></svg>`;
function delta(v,bench,label){
  if(!bench||!isFinite(bench)) return '';
  const r=(v-bench)/Math.abs(bench), l=lb(label), p=nf0.format(Math.abs(r)*100);
  if(Math.abs(r)<0.03) return `<div class="delta">${AR()?'قريب من '+l:'About the same as '+l}</div>`;
  return `<div class="delta ${r>0?'up':'down'}">${arrow(r>0)}${AR()?`${p}% ${r>0?'أكثر':'أقل'} من ${l}`:`${p}% ${r>0?'more':'less'} than ${l}`}</div>`;
}
function bars(rows){ // rows: {name,val,txt,sub,tip,top}
  const max=Math.max(...rows.map(r=>r.val),0)||1;
  return `<div class="bars">`+rows.map(r=>`<div class="brow${r.top?' top':''}" data-tip="${esc(r.tip||'')}" tabindex="0">
      <span class="n" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(0,r.val)/max*100}%"></span></span>
      <span class="val num">${esc(r.txt)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</span></div>`).join('')+`</div>`;
}

/* ---------- page ---------- */
const q=new URLSearchParams(location.search);
let wantStore=q.get('store')||'', wantName=q.get('name')||'';
const ISOD=/^\d{4}-\d{2}-\d{2}$/;
let wantFrom=ISOD.test(q.get('from')||'')?q.get('from'):'', wantTo=ISOD.test(q.get('to')||'')?q.get('to'):'';
let DAYMIN='',DAYMAX='';
let wantMonth=/^\d{4}-\d{2}$/.test(q.get('month')||'')?q.get('month'):'';
const dateQs=()=>[wantMonth?'month='+wantMonth:'',wantFrom?'from='+encodeURIComponent(wantFrom):'',wantTo?'to='+encodeURIComponent(wantTo):''].filter(Boolean).join('&');
let SERVER=false;
let CTX=null;
let MONTHS=[],CURM=null,MLOADED=false;

let LASTERR=null;
function noData(key){ // key: one of the E_ messages in TX
  LASTERR=key; CTX=null;
  $('pname').textContent=t('person'); $('psub').textContent='';
  const link='<a href="/staff" style="color:var(--accent-text);font-weight:700">Staff Performance</a>', adm=ROLE.role==='admin';
  const tail=ROLE.role==='staff'?t('tailStaff'):AR()?
    `افتح ${link} أولًا`+(adm?'، ثم حمّل ملف هذا الشهر، وبعدها اضغط على اسم.':' واختر اسمًا من الجدول.'):
    `Open ${link} first`+(adm?', load this month\'s file, then click a name.':' and pick a name from the table.');
  $('out').innerHTML=`<section class="card empty"><h2 style="margin:0 0 6px;color:var(--ink)">${esc(t(key))}</h2>${tail}</section>`;

function setHead(){
  if(!CTX) return;
  document.title=wantName+' · Staff Performance';
  $('pname').textContent=wantName;
  $('psub').innerHTML=`<bdi>${esc(wantStore)}</bdi> · <bdi>${esc(trPeriod(CTX.d.period||''))}</bdi> · ${esc(t('vat'))}`;
}

function benchPool(o){
  const incl=o.amt*VAT;
  return{n:o.n,inv:o.inv,qty:o.qty,amt:o.amt,incl,upt:o.inv?o.qty/o.inv:0,atv:o.inv?incl/o.inv:0,pen:new Map(o.pen),gamt:new Map(o.gamt),b:o.b,
    bt:o.b[0]+o.b[1]+o.b[2]+o.b[3],avgIncl:o.n?incl/o.n:0,avgInv:o.n?o.inv/o.n:0,avgQty:o.n?o.qty/o.n:0};
}
async function loadData(){
  try{
    const r=await fetch('/api/data?'+[ROLE.role==='staff'?'me=1':'',dateQs()].filter(Boolean).join('&'),{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return{err:'E_sign'}}
    if(r.ok){SERVER=true;return{d:await r.json()}}
    if(r.status===404) return{err:'E_nopub'};
  }catch(e){}
  SERVER=false; // server storage not set up: the old browser-only way
  const d=safeGet(KEY);
  return d&&d.rows&&d.people?{d}:{err:'E_nofile'};
}

/* ---- dates: change the period of the performance shown (the server only sends rows inside the range) ---- */
const rangeOn=()=>!!(wantFrom||wantTo);
const monthLabel=k=>{const [y,m]=k.split('-').map(Number); return (AR()?AR_MON[MON[m-1]]:MON[m-1])+' '+y};
function drawMonths(){
  const row=$('monthRow'); if(!row) return;
  row.hidden=!(SERVER&&MONTHS.length>1);
  const fm=(wantFrom||'').slice(0,7), tm=(wantTo||'').slice(0,7), span=!!(fm&&tm&&fm!==tm);
  const on=span?'':(wantMonth||CURM);
  $('monthChips').innerHTML=MONTHS.map(k=>`<button class="chip" type="button" aria-pressed="${k===on}" data-m="${k}">${monthLabel(k)}</button>`).join('');
}
async function loadMonths(){
  MLOADED=true;
  try{const r=await fetch('/api/data?months=1',{credentials:'same-origin',cache:'no-store'});
    if(r.ok){const j=await r.json();MONTHS=j.months||[];CURM=j.current||null}}catch(_){}
}
$('monthChips').addEventListener('click',e=>{const b=e.target.closest('[data-m]'); if(!b) return;
  wantMonth=b.dataset.m===CURM?'':b.dataset.m; wantFrom=''; wantTo='';
  try{history.replaceState(null,'','?'+[ 'store='+encodeURIComponent(wantStore),'name='+encodeURIComponent(wantName),dateQs() ].filter(Boolean).join('&'))}catch(_){}
  $('dMsg').textContent=t('loading'); build();
});
function syncDates(d){
  const row=$('dateRow'); if(!row) return;
  if(!SERVER||!d.dayMin||!d.dayMax){row.hidden=true;return}
  row.hidden=false; DAYMIN=d.dayMin; DAYMAX=d.dayMax;
  let lo=d.dayMin, hi=d.dayMax;
  if(MONTHS.length>1){ // every saved month can be reached from the date boxes
    const old=MONTHS[MONTHS.length-1], nw=MONTHS[0].split('-').map(Number);
    lo=old+'-01'; hi=new Date(Date.UTC(nw[0],nw[1],0)).toISOString().slice(0,10);
  }
  $('dFrom').min=$('dTo').min=lo; $('dFrom').max=$('dTo').max=hi;
  drawMonths();
  $('dFrom').value=d.from||d.dayMin; $('dTo').value=d.to||d.dayMax;
  $('dMsg').textContent='';
  const back=document.querySelector('a.nav'); if(back) back.href='/staff'+(dateQs()?'?'+dateQs():'');
}
async function applyDates(from,to){
  if(!DAYMIN) return;
  if(from&&to&&from>to){const x=from;from=to;to=x}
  wantFrom=from; wantTo=to;
  {const fm=(from||DAYMIN||'').slice(0,7), tm=(to||DAYMAX||'').slice(0,7); wantMonth=(fm&&fm===tm&&fm!==CURM)?fm:''}
  try{history.replaceState(null,'','?'+[ 'store='+encodeURIComponent(wantStore),'name='+encodeURIComponent(wantName),dateQs() ].filter(Boolean).join('&'))}catch(_){}
  $('dMsg').textContent=t('loading');
  await build();
}
$('dFrom').addEventListener('change',()=>{if($('dFrom').value&&$('dTo').value) applyDates($('dFrom').value,$('dTo').value)});
$('dTo').addEventListener('change',()=>{if($('dFrom').value&&$('dTo').value) applyDates($('dFrom').value,$('dTo').value)});
$('dAll').addEventListener('click',()=>applyDates('',''));
$('dLast7').addEventListener('click',()=>{
  if(!DAYMAX) return;
  const t=new Date(DAYMAX+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()-6);
  applyDates(t.toISOString().slice(0,10),DAYMAX);
});

async function build(){
  const L=await loadData();
  if(L.err) return noData(L.err);
  if(!MLOADED&&SERVER) await loadMonths();
  syncDates(L.d);
  const d=scopeData(L.d);
  let si,pi,M,S,C,P,X,mates,storeCount,rankStore;
  if(ROLE.role==='staff'){
    // a sales person only receives their own rows, plus store and company totals worked out on the server
    document.body.classList.add('solo');
    if(!d.rows.length||!d.bench) return noData(rangeOn()||wantMonth?'E_myRange':'E_myFile');
    wantStore=d.self.store; wantName=d.self.name; si=0; pi=0;
    X=prep(d); P=X.P;
    if(!P[0].inv.size) return noData(rangeOn()||wantMonth?'E_myRange':'E_myMonth');
    M=pool(P,[0]); S=benchPool(d.bench.store); C=benchPool(d.bench.company);
    mates=[0]; storeCount=d.bench.storeCount; rankStore=d.bench.rankStore;
  } else {
    si=d.stores.indexOf(wantStore);
    pi=d.people.findIndex(p=>p[0]===wantName&&d.stores[p[1]]===wantStore);
    if(si<0||pi<0) return noData('E_notfound');
    X=prep(d); P=X.P;
    if(!P[pi].inv.size) return noData(rangeOn()||wantMonth?'E_pRange':'E_pMonth');
    const storeIdx=d.people.map((p,i)=>i).filter(i=>d.people[i][1]===si);
    const allIdx=d.people.map((p,i)=>i);
    M=pool(P,[pi]); S=pool(P,storeIdx); C=pool(P,allIdx);
    mates=storeIdx.filter(i=>P[i].inv.size).sort((a,b)=>P[b].amt-P[a].amt);
    storeCount=mates.length; rankStore=mates.indexOf(pi)+1;
  }
  const alone=S.n<2, B=alone?C:S, bname=alone?'all stores':'your store';
  CTX={d,X,P,pi,si,M,S,C,B,bname,alone,mates,storeCount,rankStore}; LASTERR=null;
  setHead();
  const k=mates.indexOf(pi), pv=mates[k-1], nx=mates[k+1];
  const setNav=(id,idx)=>{const a=$(id); if(idx==null){a.setAttribute('aria-disabled','true');a.removeAttribute('href')}else{a.removeAttribute('aria-disabled');a.href=personUrl(wantStore,d.people[idx][0])}};
  setNav('prev',pv); setNav('next',nx);
  render();
}

function groupRows(){
  const {d,P,pi,M,B}=CTX, me=P[pi];
  return [...me.g.entries()].map(([g,v])=>({g,name:d.groups[g],a:v.a*VAT,q:v.q,share:me.amt?v.a/me.amt:0,
    pen:v.inv.size/M.inv,benchPen:B.inv?(B.pen.get(g)||0)/B.inv:0}));
}

function weekdayStats(){
  const {X,P,pi}=CTX; if(!X.hasDate) return null;
  const me=P[pi], acc=Array.from({length:7},()=>({a:0,n:0}));
  let total=0,days=0;
  for(const [dn,v] of me.day){const w=dayDate(dn).getUTCDay(); acc[w].a+=v.a*VAT; acc[w].n++; total+=v.a*VAT; days++}
  return{rows:WEEK_ORDER.map(w=>({wd:w,n:acc[w].n,avg:acc[w].n?acc[w].a/acc[w].n:0})),overall:days?total/days:0,activeDays:days};
}

const wdName=i=>AR()?AR_WD[i]:WDFULL[i];
function tips(G){
  const {d,P,pi,M,B,bname}=CTX, out=[], ar=AR(), bn=lb(bname);
  const top=[...G].sort((a,b)=>b.a-a.a)[0];
  if(top) out.push({cls:'win',ic:'★',
    h:ar?`أكثر ما تبيعه هو ${top.name}`:`Your best seller is ${top.name}`,
    p:ar?`${top.name} حقق EGP ${nf0.format(top.a)}، أي ${nf0.format(top.share*100)} من كل EGP 100 بعتها. استمر في عرضه أولًا.`
        :`${top.name} brought EGP ${nf0.format(top.a)}, which is ${nf0.format(top.share*100)} out of every EGP 100 you sold. Keep showing it first.`});
  const wd=weekdayStats();
  let dayTip=null;
  if(wd&&wd.activeDays>=7){const best=wd.rows.filter(r=>r.n>0).sort((a,b)=>b.avg-a.avg)[0];
    if(best&&wd.overall&&best.avg>wd.overall*1.1) dayTip={cls:'win',ic:'★',
      h:ar?`${wdName(best.wd)} هو أفضل يوم عندك`:`${WDFULL[best.wd]} is your best day`,
      p:ar?`في يوم ${wdName(best.wd)} تبيع في المتوسط حوالي EGP ${nf0.format(best.avg)}، أكثر من معدلك المعتاد (EGP ${nf0.format(wd.overall)}) في يوم البيع.`
          :`On ${WDFULL[best.wd]}s you sell about EGP ${nf0.format(best.avg)}, more than your usual EGP ${nf0.format(wd.overall)} on a selling day.`};}
  // add-on
  const keys=new Set(G.map(g=>g.g)); B.pen.forEach((v,g)=>keys.add(g));
  const gaps=[...keys].map(g=>({g,name:d.groups[g],pen:(P[pi].g.get(g)?P[pi].g.get(g).inv.size:0)/M.inv,bp:B.inv?(B.pen.get(g)||0)/B.inv:0}))
    .filter(x=>x.bp>=0.05&&x.bp-x.pen>=0.05).sort((a,b)=>(b.bp-b.pen)-(a.bp-a.pen));
  if(gaps.length){const x=gaps[0], cnt=B.pen.get(x.g)||0, avg=cnt?(B.gamt.get(x.g)*VAT)/cnt:0, est=(x.bp-x.pen)/2*M.inv*avg;
    out.push({cls:'',ic:'↗',
      h:ar?`اعرض ${x.name} على عملاء أكثر`:`Offer ${x.name} to more customers`,
      p:ar?`في ${bn}، ${nf0.format(x.bp*100)} من كل 100 عميل يشترون ${x.name}. عندك الرقم ${nf0.format(x.pen*100)} من كل 100. جرّب أن تقترحه مع القطعة الأساسية.`
          :`In ${bname}, ${nf0.format(x.bp*100)} out of every 100 customers buy ${x.name}. With you it is ${nf0.format(x.pen*100)} out of 100. Try suggesting it with the main piece.`,
      est:est>=100?(ar?`لو سدّدت نصف هذه الفجوة يمكن أن تزيد مبيعاتك بحوالي EGP ${nf0.format(est)}`:`If you close half of this gap you could add about EGP ${nf0.format(est)}`):''});}
  // pieces per customer
  if(M.upt<B.upt*0.98&&M.bt){
    const s1=M.b[0]/M.bt, t1=B.bt?B.b[0]/B.bt:0, unit=M.qty?M.incl/M.qty:0, est=0.25*M.b[0]*unit;
    out.push({cls:'',ic:'＋',
      h:ar?'ساعد العملاء على أخذ قطعة إضافية':'Help customers take one more piece',
      p:ar?`${nf0.format(s1*100)} من كل 100 من عملائك يخرجون بقطعة واحدة فقط (${bn}: ${nf0.format(t1*100)}). قبل إنهاء البيع اسأل: «هل تحب شيئًا يكمّل القطعة؟»`
          :`${nf0.format(s1*100)} out of 100 of your customers leave with only one piece (${bname}: ${nf0.format(t1*100)}). Before closing, ask: “Would you like something to go with it?”`,
      est:est>=100?(ar?`لو أخذ 1 من كل 4 منهم قطعة إضافية يمكن أن تزيد مبيعاتك بحوالي EGP ${nf0.format(est)}`:`If 1 in 4 of them took one more piece you could add about EGP ${nf0.format(est)}`):''});
  }
  // spend per customer
  if(M.atv<B.atv*0.97) out.push({cls:'',ic:'↑',
      h:ar?'اعرض خيارًا أعلى سعرًا':'Show one higher-priced choice',
      p:ar?`عميلك ينفق في المتوسط EGP ${nf0.format(M.atv)}. في ${bn} المتوسط EGP ${nf0.format(B.atv)}. عرض خيار أجمل بجانب الاختيار الأول يساعد.`
          :`Your customer spends EGP ${nf0.format(M.atv)} on average. In ${bname} it is EGP ${nf0.format(B.atv)}. Showing a nicer option next to the first choice helps.`});
  else if(M.atv>=B.atv*1.03) out.push({cls:'win',ic:'★',
      h:ar?'عملاؤك ينفقون جيدًا':'Your customers spend well',
      p:ar?`عميلك ينفق في المتوسط EGP ${nf0.format(M.atv)}، أكثر من ${bn} (EGP ${nf0.format(B.atv)}).`
          :`Your customer spends EGP ${nf0.format(M.atv)} on average, more than ${bname} (EGP ${nf0.format(B.atv)}).`});
  if(M.upt>=B.upt*0.98 && out.filter(t=>!t.cls).length===0) out.push({cls:'win',ic:'★',
      h:ar?'عمل ممتاز':'Good work',
      p:ar?`أنت في مستوى ${bn} أو أعلى في الأرقام الأساسية. استمر.`:`You are at or above ${bname} on the main numbers. Keep it up.`});
  if(dayTip) out.push(dayTip);
  return out.slice(0,4);
}

function render(){
  const {d,X,P,pi,M,B,bname,alone,storeCount,rankStore}=CTX, me=P[pi], ar=AR(), bn=lb(bname);
  const G=groupRows().sort((a,b)=>b.a-a.a), topG=G[0], pc=pcs();
  let h='';
  h+=`<section class="card hero">
    <div class="heroleft"><div class="lbl">${ar?'مبيعاتك':'Your sales'}</div>
      <div class="big num"><small>EGP</small> ${nf0.format(M.incl)}</div>
      <div class="ranks"><span class="pill">${alone?(ar?'هذا الشهر':'This month'):(ar?`رقم ${rankStore} من ${CTX.storeCount} في فرعك`:`#${rankStore} of ${CTX.storeCount} in your store`)}</span></div>
      <div style="color:var(--ink2);font-size:13px;margin-top:4px">${topG?`${ar?'أكثر ما تبيعه:':'You sell most:'} <b style="color:var(--ink)">${esc(topG.name)}</b>`:''}</div></div>
    <div class="kpis">
      <div class="kpi"><div class="k">${ar?'العملاء الذين خدمتهم':'Customers served'}</div><div class="v num">${nf0.format(M.inv)}</div>${alone?'':delta(M.inv,B.avgInv,'the store average')}</div>
      <div class="kpi"><div class="k">${ar?'القطع المباعة':'Pieces sold'}</div><div class="v num">${nf0.format(M.qty)}</div>${alone?'':delta(M.qty,B.avgQty,'the store average')}</div>
      <div class="kpi"><div class="k">${ar?'القطع لكل عميل':'Pieces per customer'}</div><div class="v num">${nf1.format(M.upt)}</div>${delta(M.upt,B.upt,bname)}</div>
      <div class="kpi"><div class="k">${ar?'إنفاق العميل':'Spend per customer'}</div><div class="v num"><small style="font-size:12px;color:var(--ink2)">EGP</small> ${nf0.format(M.atv)}</div>${delta(M.atv,B.atv,bname)}</div>
    </div></section>`;

  const T=tips(G);
  h+=`<section class="card"><div class="cardhead"><h2>${H('Tips for you','نصائح لك')}</h2><span class="meta">${ar?'الأخضر = تفعله جيدًا. الوردي = فرصة للنمو':'Green = you do this well. Pink = a chance to grow'}</span></div><div class="coach">`+
    T.map(t=>`<article class="tip ${t.cls}"><div class="tag"><span class="ic" aria-hidden="true">${t.ic}</span></div><h3>${esc(iso(t.h))}</h3><p>${esc(iso(t.p))}</p>${t.est?`<div class="est num">${esc(iso(t.est))}<small>${ar?'تقدير تقريبي وليس هدفًا.':'A rough guess, not a target.'}</small></div>`:''}</article>`).join('')+`</div></section>`;

  // collections (Pandora families): "Pandora Moments - Charm" -> Moments
  {
    const famOf=g=>String(g||'').split(' - ')[0].replace(/^\s*Pandora\s+/i,'').trim()||'Other';
    const fam=new Map(), get=f=>{let o=fam.get(f);if(!o){o={name:f,a:0,q:0,b:0};fam.set(f,o)}return o};
    let myTot=0,bTot=0;
    G.forEach(x=>{const o=get(famOf(x.name));o.a+=x.a;o.q+=x.q;myTot+=x.a});
    B.gamt.forEach((v,g)=>{const o=get(famOf(d.groups[g]));o.b+=v;bTot+=v});
    const F=[...fam.values()].filter(o=>o.a>0).sort((a,b)=>b.a-a.a), isAll=bname==='all stores';
    if(F.length) h+=`<section class="card"><div class="cardhead"><h2>${H('Your collections','مجموعاتك')}</h2><span class="meta">${ar?`حصة كل مجموعة من مبيعاتك، بجانب حصتها في ${isAll?'كل الفروع':'فرعك'}`:`Share of your sales, next to your ${isAll?'all-store':'store'} share`}</span></div><div class="colbars">`+
      bars(F.slice(0,8).map((o,i)=>({name:o.name,val:o.a,txt:'EGP '+nf0.format(o.a),sub:iso(nf0.format(o.a/myTot*100)+'%'+(bTot?' · '+(ar?(isAll?'الكل':'الفرع'):(isAll?'all':'store'))+' '+nf0.format(o.b/bTot*100)+'%':'')),top:i===0,tip:`${o.name} · EGP ${nf0.format(o.a)} · ${nf0.format(o.q)} ${pc}`})))+`</div></section>`;
  }
  h+=`<div class="grid2">`;
  const shown=G.slice(0,6);
  h+=`<section class="card"><div class="cardhead"><h2>${H('What you sell most','أكثر ما تبيعه')}</h2><span class="meta">${ar?'حسب المبيعات':'By sales'}</span></div>`+
    bars(shown.map((g,i)=>({name:g.name,val:g.a,txt:'EGP '+nf0.format(g.a),sub:nf0.format(g.q)+' '+pc,top:i===0,tip:`${g.name} · EGP ${nf0.format(g.a)} · ${nf0.format(g.q)} ${pc}`})))+`</section>`;

  if(X.hasItem&&me.item.size){
    const items=[...me.item.entries()].map(([k,v])=>{const it=d.items&&d.items[k]; const nm=Array.isArray(it)?(it[0]||it[1]||'Item'):String(it||'Item'); return{name:nm,a:v.a*VAT,q:v.q}}).sort((a,b)=>b.a-a.a).slice(0,5);
    h+=`<section class="card"><div class="cardhead"><h2>${H('Your top products','أفضل منتجاتك')}</h2><span class="meta">${ar?'حسب المبيعات':'By sales'}</span></div>`+
      bars(items.map((x,i)=>({name:x.name,val:x.a,txt:'EGP '+nf0.format(x.a),sub:nf0.format(x.q)+' '+pc,top:i===0,tip:`${x.name} · EGP ${nf0.format(x.a)}`})))+`</section>`;
  }

  if(X.hasDate){
    const wd=weekdayStats();
    if(wd&&wd.activeDays>=3){
      const mx=Math.max(...wd.rows.map(r=>r.avg),0), best=wd.rows.reduce((a,b)=>b.avg>a.avg?b:a);
      h+=`<section class="card"><div class="cardhead"><h2>${H('Your best days','أفضل أيامك')}</h2><span class="meta">${ar?'ما تبيعه في اليوم العادي':'What you sell on an average day'}</span></div>`+
        bars(wd.rows.map(r=>({name:wdName(r.wd),val:r.avg,txt:r.n?'EGP '+nf0.format(r.avg):(ar?'لا مبيعات':'No sales'),top:r===best&&mx>0,tip:`${wdName(r.wd)} · ${r.n?'EGP '+nf0.format(r.avg)+(ar?' في اليوم العادي':' on an average day'):(ar?'لا مبيعات':'no sales')}`})))+`</section>`;
    }
  } else {
    h+=`<section class="note">${ar?`<b>تريد رؤية أفضل أيامك وأفضل منتجاتك؟</b> افتح <a href="/staff" style="color:var(--accent-text);font-weight:700">Staff Performance</a> وحمّل ملف المبيعات مرة أخرى.`
      :`<b>Want to see your best days and top products?</b> Open <a href="/staff" style="color:var(--accent-text);font-weight:700">Staff Performance</a> and load the sales file again.`}</section>`;
  }
  h+=`</div>`;
  $('out').innerHTML=h;fitNums();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]'); if(c&&CTX){VIEW.cat=c.dataset.cat;render()}});
$('langBtn').onclick=()=>setLang(AR()?'en':'ar');
$('cleanBtn').onclick=()=>document.body.classList.add('clean');
$('exitClean').onclick=()=>document.body.classList.remove('clean');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('clean')});
const tip=$('tip');
function showTip(el,x,y){const t=el.getAttribute('data-tip'); if(!t){tip.classList.remove('on');return} tip.textContent=t; tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight; let L=x+14,T=y+14; if(L+w>innerWidth-8)L=x-w-14; if(T+h>innerHeight-8)T=y-h-14; tip.style.left=Math.max(8,L)+'px'; tip.style.top=Math.max(8,T)+'px'}
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]'); if(el)showTip(el,e.clientX,e.clientY); else tip.classList.remove('on')});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){const r=el.getBoundingClientRect(); showTip(el,r.left+Math.min(r.width,200)/2,r.top)}});
document.addEventListener('focusout',()=>tip.classList.remove('on'));
document.addEventListener('scroll',()=>tip.classList.remove('on'),{passive:true});
applyLang();
build();
</script>
</body>
</html>
