<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora — Sign in</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3f1,#151413);--surface:light-dark(#fff,#211f1d);--surface2:light-dark(#faf8f6,#292623);--text:light-dark(#282522,#f7f2ed);--muted:light-dark(#817a74,#b7aea6);--line:light-dark(#e9e2dc,#3a3530);--accent:#FF93A0;--accent2:#FF93A0;--accent-text:light-dark(#2A1F24,#FF93A0)}
*{box-sizing:border-box}body{word-spacing:.09em;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,var(--surface) 0%,var(--bg) 68%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.panel{width:min(100%,420px);padding:38px 34px 30px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #4b17300d;text-align:center}.logo{display:block;width:min(230px,78%);max-height:120px;object-fit:contain;margin:0 auto 26px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);font-weight:750}.title{font-size:26px;letter-spacing:-.04em;margin:10px 0 8px}.sub{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 28px}form{text-align:left}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;color:var(--text);background:var(--surface2);outline:none}.field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #FF93A044}.password-wrap{position:relative}.password-wrap input{padding-right:68px}.toggle{position:absolute;right:10px;top:0;height:48px;border:0;background:none;color:var(--accent-text);font-weight:700;cursor:pointer}.submit{width:100%;height:49px;margin-top:7px;border:0;border-radius:10px;background:var(--accent);color:#2A1018;font-size:14px;font-weight:750;cursor:pointer}.submit:hover{filter:brightness(.96)}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;color:light-dark(#2A1018,#FF93A0);background:light-dark(#FFE4E8,#3a1f24);border:1px solid #FF93A0;border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.4;margin:0 0 16px}.foot{font-size:11px;color:var(--muted);margin:23px 0 0}.rule{width:42px;height:3px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:0 auto 20px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}.pick{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:14px 10px;font:inherit;font-size:13px;font-weight:750;cursor:pointer;line-height:1.3}.pick small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}.pick:hover{border-color:var(--accent2)}.pick[aria-pressed="true"]{border-color:var(--accent);background:light-dark(#FFE4E8,#33202a);box-shadow:0 0 0 2px #FF93A055}.pick:focus-visible,.submit:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.hint{font-size:13px;color:var(--muted);margin:0 0 6px;text-align:center}@media(max-width:380px){.choose{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
</style><style id="desk">
.side{display:none}
@media (min-width:900px){
 body{display:grid!important;grid-template-columns:minmax(360px,44%) 1fr;padding:0!important;place-items:stretch!important;background:var(--bg)!important}
 .side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:64px 56px;color:#2A1018;background:linear-gradient(155deg,#FF93A0 0%,#FFA9B3 55%,#FFC4CB 100%);position:sticky;top:0;height:100vh}
 .side img{width:min(440px,78%);max-height:420px;object-fit:contain;margin:0}
 .side h2{margin:0;font-size:38px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
 .side p{margin:0;font-size:16px;line-height:1.6;opacity:.9;max-width:420px}
 .side ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px;font-weight:600}
 .side li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2A1018;margin-right:12px;opacity:.85}
 .panel{align-self:center;justify-self:center;width:min(100%,460px)!important;margin:48px 24px;border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important}
 .panel .logo,.panel .rule{display:none}
 .panel .eyebrow{text-align:left}.panel .title{font-size:34px;text-align:left}.panel .sub,.panel .hint,.panel .foot{text-align:left}
 .panel.wide{width:min(100%,700px)!important}.panel.wide .apps{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
}
@media (min-width:900px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
</style></head>
<body><aside class="side"><img src="/pandora-logo.png" alt="Pandora"></aside><main class="panel"><img class="logo" src="/pandora-logo.png" alt="Pandora"><div class="rule"></div><h1 class="title">Welcome back</h1><p class="sub" id="sub">Sign in to continue.</p>
<form id="loginForm"><div class="error" id="error" role="alert"></div><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="toggle" id="toggle" type="button">Show</button></div></div><p class="small" style="margin:-6px 0 14px;text-align:right"><a href="/forgot.html" style="color:var(--accent-text);font-weight:700;font-size:12.5px">Forgot your password?</a></p><button class="submit" id="submit" type="submit">Sign in</button></form>
<p class="hint" id="signupHint" style="margin-top:18px"><a href="/signup.html" style="color:var(--accent-text);font-weight:700">Sales person? Create your account</a></p><p class="foot">Restricted access · Pandora</p></main>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('submit'),pass=document.getElementById('password');
document.getElementById('toggle').addEventListener('click',()=>{const reveal=pass.type==='password';pass.type=reveal?'text':'password';document.getElementById('toggle').textContent=reveal?'Hide':'Show';});
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Checking…';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:pass.value})});
  const data=await r.json().catch(()=>({}));
  if((r.status===500||r.status===403||r.status===429)&&data.error)throw new Error(data.error);
  if(!r.ok||!data.ok)throw new Error('Incorrect username or password. Please try again.');
  location.replace(data.next||'/');
 }catch(ex){err.textContent=ex.message||'Sign-in failed. Please try again.';err.style.display='block';btn.disabled=false;btn.textContent='Sign in'}});
</script></body></html>
