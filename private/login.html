<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora — Sign in</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3f1,#151413);--surface:light-dark(#fff,#211f1d);--surface2:light-dark(#faf8f6,#292623);--text:light-dark(#282522,#f7f2ed);--muted:light-dark(#817a74,#b7aea6);--line:light-dark(#e9e2dc,#3a3530);--accent:#9e174d;--accent2:#d85b83}
*{box-sizing:border-box}body{word-spacing:.09em;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,var(--surface) 0%,var(--bg) 68%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.panel{width:min(100%,420px);padding:38px 34px 30px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #4b17300d;text-align:center}.logo{display:block;width:min(230px,78%);max-height:120px;object-fit:contain;margin:0 auto 26px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:750}.title{font-size:26px;letter-spacing:-.04em;margin:10px 0 8px}.sub{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 28px}form{text-align:left}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;color:var(--text);background:var(--surface2);outline:none}.field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #d85b831c}.password-wrap{position:relative}.password-wrap input{padding-right:68px}.toggle{position:absolute;right:10px;top:0;height:48px;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}.submit{width:100%;height:49px;margin-top:7px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:750;cursor:pointer}.submit:hover{background:#80123e}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;color:light-dark(#a32236,#ff9aa6);background:light-dark(#fff0f1,#3a1f24);border:1px solid light-dark(#f3cbd0,#6a2b35);border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.4;margin:0 0 16px}.foot{font-size:11px;color:var(--muted);margin:23px 0 0}.rule{width:42px;height:3px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:0 auto 20px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}.pick{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:14px 10px;font:inherit;font-size:13px;font-weight:750;cursor:pointer;line-height:1.3}.pick small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}.pick:hover{border-color:var(--accent2)}.pick[aria-pressed="true"]{border-color:var(--accent);background:light-dark(#fdf0f4,#33202a);box-shadow:0 0 0 2px #9e174d33}.pick:focus-visible,.submit:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.hint{font-size:13px;color:var(--muted);margin:0 0 6px;text-align:center}@media(max-width:380px){.choose{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
</style></head>
<body><main class="panel"><img class="logo" src="/pandora-logo.png" alt="Pandora"><div class="rule"></div><div class="eyebrow">Sales Intelligence</div><h1 class="title">Welcome back</h1><p class="sub" id="sub">Sign in to continue.</p>
<form id="loginForm"><div class="error" id="error" role="alert"></div><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="toggle" id="toggle" type="button">Show</button></div></div><button class="submit" id="submit" type="submit">Sign in</button></form>
<p class="hint" id="signupHint" style="margin-top:18px"><a href="/signup.html" style="color:var(--accent);font-weight:700">Sales person? Create your account</a></p><p class="foot">Restricted access · Pandora Sales Intelligence</p></main>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('submit'),pass=document.getElementById('password');
document.getElementById('toggle').addEventListener('click',()=>{const reveal=pass.type==='password';pass.type=reveal?'text':'password';document.getElementById('toggle').textContent=reveal?'Hide':'Show';});
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Checking…';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:pass.value})});
  const data=await r.json().catch(()=>({}));
  if((r.status===500||r.status===403||r.status===429)&&data.error)throw new Error(data.error);
  if(!r.ok||!data.ok)throw new Error('Incorrect username or password. Please try again.');
  location.replace(data.next||'/');
 }catch(ex){err.textContent=ex.message||'Sign-in failed. Please try again.';err.style.display='block';btn.disabled=false;btn.textContent='Sign in'}});
</script></body></html>
