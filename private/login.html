<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora Sales Intelligence — Sign in</title>
<style>
:root{--accent:#9e174d;--accent2:#d85b83;--bg:#f7f4f2;--surface:#fff;--text:#282522;--muted:#817a74;--line:#e9e2dc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#fff 0%,var(--bg) 68%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.panel{width:min(100%,420px);padding:38px 34px 30px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #4b17300d;text-align:center}.logo{display:block;width:min(230px,78%);max-height:120px;object-fit:contain;margin:0 auto 26px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:750}.title{font-size:26px;letter-spacing:-.04em;margin:10px 0 8px}.sub{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 28px}form{text-align:left}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;color:var(--text);background:#fff;outline:none}.field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #d85b831c}.password-wrap{position:relative}.password-wrap input{padding-right:68px}.toggle{position:absolute;right:10px;top:0;height:48px;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}.submit{width:100%;height:49px;margin-top:7px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:750;cursor:pointer}.submit:hover{background:#80123e}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;color:#a32236;background:#fff0f1;border:1px solid #f3cbd0;border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.4;margin:0 0 16px}.foot{font-size:11px;color:var(--muted);margin:23px 0 0}.rule{width:42px;height:3px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:0 auto 20px}
</style></head>
<body><main class="panel"><img class="logo" src="/pandora-logo.png" alt="Pandora"><div class="rule"></div><div class="eyebrow">Sales Intelligence</div><h1 class="title">Welcome back</h1><p class="sub">Sign in with your authorized account to access the dashboard.</p>
<form id="loginForm"><div class="error" id="error" role="alert"></div><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="toggle" id="toggle" type="button">Show</button></div></div><button class="submit" id="submit" type="submit">Sign in securely</button></form><p class="foot">Restricted access · Pandora Sales Intelligence</p></main>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('submit'),pass=document.getElementById('password');
document.getElementById('toggle').addEventListener('click',()=>{const reveal=pass.type==='password';pass.type=reveal?'text':'password';document.getElementById('toggle').textContent=reveal?'Hide':'Show';});
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Checking…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:pass.value})});const data=await r.json();if(!r.ok||!data.ok)throw new Error('Incorrect username or password. Please try again.');location.replace('/');}catch(ex){err.textContent=ex.message||'Sign-in failed. Please try again.';err.style.display='block';}finally{btn.disabled=false;btn.textContent='Sign in securely';}});
</script></body></html>
