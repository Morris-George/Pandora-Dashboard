<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora — Home</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f3f0,#141211);--surface:light-dark(#FFFAF1,#201d1b);--text:light-dark(#26211f,#f3eadb);--muted:light-dark(#857d77,#b7aea6);--line:light-dark(#ebe4de,#38332f);--accent:#FF93A0;--accent-text:light-dark(#2A1F24,#FF93A0);--soft:light-dark(#FFE9EC,#33202a);--ink:light-dark(#241d1f,#f3eadb)}
*{box-sizing:border-box}
body{word-spacing:.09em;margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;position:relative}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(620px 380px at 88% -60px,light-dark(rgba(255,147,160,.30),rgba(255,147,160,.14)),transparent 70%),radial-gradient(520px 340px at -4% 108%,light-dark(rgba(255,147,160,.16),rgba(255,147,160,.07)),transparent 70%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
/* opening: the logo alone, then it lifts away and the page builds in */
.intro{position:fixed;inset:0;z-index:9000;background:var(--bg);display:grid;place-items:center;transition:opacity .7s ease,visibility .7s}
.intro .logo{width:116px;animation:pop .9s cubic-bezier(.2,.8,.2,1) both;transition:transform .7s cubic-bezier(.65,.05,.2,1)}
body.go .intro{opacity:0;visibility:hidden}body.go .intro .logo{transform:translateY(-40px) scale(.7)}
.wrap{position:relative;width:min(100% - 40px,1080px);margin:0 auto;padding:84px 0 56px}
/* header: left-aligned, large */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:26px}
.hl{display:flex;align-items:center;gap:22px;min-width:0}
.mark{width:64px;height:auto;flex:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.title{font-size:clamp(30px,4.6vw,46px);line-height:1.04;letter-spacing:-.045em;margin:0;font-weight:800}
.title em{font-style:normal;color:var(--accent)}
.sub{font-size:14px;color:var(--muted);margin:8px 0 0}
.find{position:relative;width:min(100%,330px)}
.find svg{position:absolute;left:15px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.find input{width:100%;height:46px;padding:0 46px 0 42px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;transition:border-color .15s,box-shadow .15s}
.find input::placeholder{color:var(--muted)}.find input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px light-dark(rgba(255,147,160,.25),rgba(255,147,160,.2))}
.find kbd{position:absolute;right:13px;top:50%;transform:translateY(-50%);font:600 11px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 7px;pointer-events:none}.find input:focus~kbd{display:none}
/* section switcher */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;gap:8px;align-items:center}
.tab small{font-size:11px;color:var(--muted);font-weight:700}
.tab:hover{border-color:var(--accent)}.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab[aria-pressed="true"] small{color:inherit;opacity:.65}
/* sections and the tile grid */
.sec{margin:0 0 34px}
.sh{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.sh h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.sh .rule{flex:1;height:1px;background:var(--line)}
.sh .n{font-size:12px;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(4,1fr)}.tile{grid-column:span var(--sp,1)}}
.tile{--mx:50%;--my:50%;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:118px;padding:16px 16px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;overflow:hidden;isolation:isolate;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.tile:before{content:'';position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(240px 180px at var(--mx) var(--my),light-dark(rgba(255,147,160,.28),rgba(255,147,160,.2)),transparent 70%)}
.tile:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 18px 36px -18px rgba(255,147,160,.7)}.tile:hover:before{opacity:1}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--accent-text);transition:background .25s,color .25s,transform .25s}.tile .ic svg{width:20px;height:20px}
.tile:hover .ic{background:var(--accent);color:#2A1018;transform:rotate(-6deg) scale(1.06)}
.tile b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25;padding-right:22px}
.tile .d{display:none;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:5px;font-weight:400}
.tile .go{position:absolute;right:14px;bottom:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--accent-text);background:var(--soft);transition:transform .25s,background .25s,color .25s}.tile .go svg{width:13px;height:13px}
.tile:hover .go{transform:translateX(3px);background:var(--accent);color:#2A1018}
/* the first report of each section is the large one */
.tile.feat{background:light-dark(linear-gradient(135deg,#FFE3E8,#FFF3EE),linear-gradient(135deg,#3b2229,#241b1e));color:var(--text);border-color:light-dark(rgba(255,147,160,.55),rgba(255,147,160,.4))}
.tile.feat .ic{background:var(--accent);color:#2A1018}.tile.feat .d{display:block;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.feat .go{background:var(--accent);color:#2A1018}
.tile.feat:before{background:radial-gradient(260px 200px at var(--mx) var(--my),rgba(255,147,160,.32),transparent 70%)}
@media (min-width:700px){.tile.feat{grid-column:span 2}}
.tile .d.show{display:block}
/* build-in */
.sec,.hero,.tabs{opacity:0;transform:translateY(16px)}
body.go .hero{animation:rise .6s cubic-bezier(.2,.8,.2,1) .25s forwards}
body.go .tabs{animation:rise .6s cubic-bezier(.2,.8,.2,1) .4s forwards}
body.go .sec{animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.5s + var(--g) * .09s)}
/* once the page has built in, switching sections is instant (a short fade only) */
body.ready .sec,body.ready .hero,body.ready .tabs{opacity:1;transform:none;animation:none!important}
body.ready .sec.swap{animation:swap .22s ease-out!important}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro{display:none}.sec,.hero,.tabs{opacity:1;transform:none;animation:none!important}.tile,.tile *{transition:none!important}}
[hidden]{display:none!important}
.nores{text-align:center;color:var(--muted);font-size:14px;padding:30px}
.empty{color:var(--muted);font-size:14px;text-align:center}
.bdg{display:inline-block;min-width:20px;padding:1px 7px;margin-left:6px;border-radius:99px;background:#FF93A0;color:#2A1018;font-size:12px;font-weight:800;text-align:center}
.pandora-fab{right:82px!important;border-radius:999px!important}a.upl{right:182px!important;text-decoration:none;display:inline-flex;align-items:center;gap:7px}a.upl svg{width:15px;height:15px}@media(max-width:560px){a.upl{top:56px!important;right:12px!important}}
/* editing the order keeps the compact list */
.edit{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.edit .grp{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px 10px}
.edit .gh{margin:0 0 6px 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.edit .app{display:flex;gap:10px;align-items:center;padding:7px 10px 7px 8px;border-radius:14px;color:var(--text);text-decoration:none}
.edit .app .ic{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent-text)}.edit .app .ic svg{width:16px;height:16px}
.edit .app b{font-size:13.5px;font-weight:600}.edit .app .d,.edit .app .go{display:none}
.edrow{display:flex;align-items:center;gap:4px}.edrow .app{flex:1;pointer-events:none}.edrow button,.gh button,#edbar button{border:1px solid var(--line,#ddd);background:var(--surface,#fff);color:var(--text);border-radius:8px;padding:4px 9px;font:inherit;font-weight:600;cursor:pointer}
#edbar button{border-radius:999px;padding:8px 16px}
</style></head>
<body data-nopw>
<div class="intro"><img class="logo" src="/pandora-logo.png" alt="Pandora"></div>
<main class="wrap">
<header class="hero"><div class="hl"><img class="mark logo" src="/pandora-logo.png" alt=""><div><p class="eyebrow" id="date">&nbsp;</p><h1 class="title" id="hello">&nbsp;</h1><p class="sub" id="sub">Choose what you want to open.</p></div></div>
<div class="find" id="findbox" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="find" type="search" placeholder="Find a report" autocomplete="off" aria-label="Find a report"><kbd>/</kbd></div></header>
<nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
<div id="apps"></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/></svg>',
 vmzones:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 12h18M12 3v18"/></svg>',
 zonestock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg>',
 slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg>',
 refill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>',
 dist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v7M12 10l-7 6M12 10l7 6M5 16v4M19 16v4M12 10v10"/></svg>',
 recv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M8 12l3 3 5-6"/></svg>',
 schedule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M13 14h3M8 17h3"/></svg>',
 mysales2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>',
 storeteam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.9.8 3 2.6 3 5.6"/></svg>',
 activity:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',dashboards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.9.8 3 2.6 3 5.6"/></svg>',
 uploads:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
 approvals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.2"/><path d="M4 20c0-3.3 2.7-6 6-6 1.4 0 2.6.4 3.6 1.1M15.5 18.5l2 2 4-4.5"/></svg>',
 vm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',
 stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></svg>',
 stockcount:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2M7 8v8M11 8v8M15 8v8M18 8v8"/></svg>',
 stockchecker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6v10M7 6v10M10 6v10M13 6v5"/><circle cx="16.5" cy="15.5" r="3.5"/><path d="M19 18l2.2 2.2"/></svg>',
 access:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
 daily:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 15l2.5-2.5 2 2 3.5-3.5"/></svg>',
 film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
 maintenance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.5 17.2a1.8 1.8 0 0 0 2.6 2.6l5.8-5.8a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.1-.5-.5-2.1 2.8-2.2z"/></svg>',
 mysales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>'};
const DEF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';
let EDIT=null,LAST=null,VIS=[],TAB='all';
function paint(j){
  const g=j.greet||j.label||'';
  document.getElementById('hello').innerHTML=g?'Hello,<br><em>'+esc(g)+'</em>':'Welcome';
  document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',weekday:'long',day:'numeric',month:'long'}).format(new Date());
  if(j.apps.some(a=>a.id==='uploads')&&!document.querySelector('a.upl')){const u=document.createElement('a');u.className='pandora-fab upl';u.href='/uploads';u.innerHTML=ICON.uploads+'All Uploads';document.body.appendChild(u)}
  const apps=j.apps.filter(a=>a.id!=='uploads');
  const BASE=[['Sales',['overview','dashboards','staff','mysales','mysales2','storeteam','daily','film']],['Stock',['stock','stockcount','stockchecker','slow','transfer']],['Ordering',['refill','dist','recv']],['Visual Merchandising',['vmzones','zonestock','vm']],['Team & Access',['schedule','approvals','access','activity']],['Maintenance',['maintenance']]];
  // the super admin's saved order, with anything newer kept at the end of its usual section
  const saved=EDIT||j.homeOrder||[];
  const GROUPS=saved.length?saved.map(([n,ids])=>{const b=BASE.find(x=>x[0]===n);return [n,ids.concat(b?b[1].filter(i=>!ids.includes(i)):[])]}).concat(BASE.filter(b=>!saved.some(x=>x[0]===b[0]))):BASE;
  LAST=j;
  const ext=h=>/^https?:/i.test(h)?' target="_blank" rel="noopener"':'';
  const tile=(a,f,sp)=>`<a class="tile${f?' feat':''}" style="--sp:${sp||1}" href="${esc(a.href)}"${ext(a.href)} title="${esc(a.desc||'')}"><span class="ic">${ICON[a.id]||DEF}</span><span><b>${esc(a.title)}</b><span class="d">${esc(a.desc||'')}</span></span><span class="go" aria-hidden="true">${ARROW}</span></a>`;
  // on a wide screen every row is filled edge to edge: the big tile plus two, then rows of four, the last row shared out
  const spans=n=>{const r=[2],rest=n-1,first=Math.min(2,rest);for(let i=0;i<first;i++)r.push(first===1?2:1);let left=rest-first;while(left>0){const k=Math.min(4,left),base=Array(k).fill(1);for(let e=4-k,i=0;e>0;i=(i+1)%k,e--)base[i]++;r.push(...base);left-=k}return r};
  const row=a=>`<a class="app" href="${esc(a.href)}"${ext(a.href)}><span class="ic">${ICON[a.id]||DEF}</span><b>${esc(a.title)}</b></a>`;
  const used=new Set(),secs=[];
  GROUPS.forEach(([name,ids])=>{const list=ids.map(id=>apps.find(a=>a.id===id)).filter(Boolean);list.forEach(a=>used.add(a.id));if(list.length)secs.push([name,list])});
  const rest=apps.filter(a=>!used.has(a.id));if(rest.length)secs.push(['More',rest]);
  const box=document.getElementById('apps'),tabs=document.getElementById('tabs');
  if(!apps.length){box.className='';box.innerHTML='<div class="empty">There is nothing to open for your account yet. Please contact your manager.</div>'}
  else if(EDIT){box.className='edit';tabs.hidden=true;
    box.innerHTML=secs.map(([name,list],g)=>`<section class="grp"><h2 class="gh">${esc(name)} <button type="button" data-sec="${g}" data-d="-1">‹</button><button type="button" data-sec="${g}" data-d="1">›</button></h2>${list.map(a=>`<div class="edrow">${row(a)}<button type="button" data-g="${g}" data-id="${esc(a.id)}" data-d="-1">↑</button><button type="button" data-g="${g}" data-id="${esc(a.id)}" data-d="1">↓</button></div>`).join('')}</section>`).join('')}
  else{box.className='';
    if(TAB!=='all'&&!secs.some(x=>x[0]===TAB))TAB='all';
    tabs.hidden=secs.length<2;
    tabs.innerHTML=[['all','All',apps.length]].concat(secs.map(([n,l])=>[n,n,l.length])).map(([k,n,c])=>`<button type="button" class="tab" data-tab="${esc(k)}" aria-pressed="${k===TAB}">${esc(n)}<small>${c}</small></button>`).join('');
    box.innerHTML=secs.map(([name,list],g)=>`<section class="sec" data-name="${esc(name)}" style="--g:${g}"><div class="sh"><h2>${esc(name)}</h2><i class="rule"></i><span class="n">${list.length}</span></div><div class="tiles">${(sp=>list.map((a,i)=>tile(a,i===0,sp[i])).join(''))(spans(list.length))}</div></section>`).join('')}
  VIS=secs.map(([n,l])=>[n,l.map(a=>a.id)]);
  document.getElementById('findbox').hidden=!!EDIT||apps.length<6;applyFind();
  if(apps.some(a=>a.id==='access')&&!document.getElementById('edbar')){const d=document.createElement('div');d.id='edbar';d.style.cssText='display:flex;gap:8px;justify-content:center;margin:26px 0 0';box.after(d)}
  const bar=document.getElementById('edbar');if(bar)bar.innerHTML=EDIT?'<button type="button" id="edsave">Save order</button><button type="button" id="edcancel">Cancel</button><button type="button" id="edreset">Standard order</button>':'<button type="button" id="edopen">Edit cards order</button>';
  return apps;
}
function applyFind(){const q=(document.getElementById('find').value||'').trim().toLowerCase(),box=document.getElementById('apps');if(EDIT)return;let any=false;
  box.querySelectorAll('.sec').forEach(sc=>{let n=0;sc.querySelectorAll('.tile').forEach(t=>{const ok=!q||t.querySelector('b').textContent.toLowerCase().includes(q)||sc.dataset.name.toLowerCase().includes(q);t.hidden=!ok;if(ok)n++});
    sc.hidden=!n||(!q&&TAB!=='all'&&sc.dataset.name!==TAB);if(!sc.hidden)any=true});
  const old=box.querySelector('.nores');if(old)old.remove();if(q&&!any)box.insertAdjacentHTML('beforeend','<div class="nores">No report matches “'+esc(q)+'”.</div>')}
document.getElementById('find').addEventListener('input',applyFind);
document.getElementById('find').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=document.querySelector('#apps .sec:not([hidden]) .tile:not([hidden])');if(a)location.href=a.href}else if(e.key==='Escape'){e.target.value='';applyFind();e.target.blur()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))&&!document.getElementById('findbox').hidden){e.preventDefault();document.getElementById('find').focus()}});
// a soft light follows the pointer over each tile
document.getElementById('apps').addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('.tile');if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px')});
document.addEventListener('click',async e=>{
  const t=e.target.closest?e.target.closest('button,[data-tab]')||e.target:e.target,mv=(l,i,d)=>{const j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]]};
  if(t.dataset&&t.dataset.tab){TAB=t.dataset.tab;document.getElementById('find').value='';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===TAB));document.body.classList.add('ready');applyFind();document.querySelectorAll('.sec:not([hidden])').forEach(x=>{x.classList.remove('swap');void x.offsetWidth;x.classList.add('swap')});return}
  if(t.id==='edopen'){e.preventDefault();EDIT=VIS.filter(v=>v[0]!=='More');paint(LAST);return}
  if(t.id==='edcancel'){EDIT=null;paint(LAST);return}
  if(t.dataset&&t.dataset.sec){mv(EDIT,+t.dataset.sec,+t.dataset.d);paint(LAST);return}
  if(t.dataset&&t.dataset.id){const l=EDIT[+t.dataset.g][1];mv(l,l.indexOf(t.dataset.id),+t.dataset.d);paint(LAST);return}
  if(t.id==='edsave'||t.id==='edreset'){const home=t.id==='edsave'?EDIT:[];
    const r=await fetch('/api/access',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'homeorder',home})}).catch(()=>null);
    if(!r||!r.ok){alert('Could not save the order.');return}
    LAST.homeOrder=home;EDIT=null;paint(LAST)}
});
// the logo shows alone first, then lifts away and the page builds in
const reveal=()=>{document.body.classList.add('go');setTimeout(()=>document.body.classList.add('ready'),2200)};
if(matchMedia('(prefers-reduced-motion: reduce)').matches)reveal();else setTimeout(reveal,1300);
// the server already put who-you-are and what-you-can-open into the page, so it draws at once (no loading flash)
async function badge(){
  // waiting-for-approval count: fills in afterwards without redrawing anything
  try{const q=await fetch('/api/accounts',{credentials:'same-origin',cache:'no-store'});const d=q.ok?await q.json():null;if(!d)return;
    const n=d.accounts?d.accounts.filter(x=>x.status==='pending').length:0,f=d.resets?d.resets.length:0;
    const parts=[n?n+' waiting for approval':'',f?f+' forgot password':''].filter(Boolean);
    const card=document.querySelector('a.tile[href="/staff/accounts"]');if(!card||!parts.length)return;
    const dd=card.querySelector('.d');dd.textContent=parts.join(' · ');dd.classList.add('show');card.title=parts.join(' · ');
    card.querySelector('b').insertAdjacentHTML('beforeend',' <span class="bdg">'+(n+f)+'</span>')}catch(_){}
}
(async()=>{
 try{
  let j=window.__HOME;
  if(!j){
    const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    j=await r.json();if(!j.ok)throw 0;
  }
  const apps=paint(j);
  if(apps.some(a=>a.id==='approvals'))badge();
 }catch(_){document.getElementById('apps').innerHTML='<div class="empty">Could not load. Please refresh the page.</div>'}
})();
</script></body></html>
