<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora — Home</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3f1,#151413);--surface:light-dark(#fff,#211f1d);--text:light-dark(#282522,#f7f2ed);--muted:light-dark(#817a74,#b7aea6);--line:light-dark(#e9e2dc,#3a3530);--accent:#FF93A0;--accent-text:light-dark(#2A1F24,#FF93A0);--soft:light-dark(#FFE4E8,#33202a)}
*{box-sizing:border-box}
body{word-spacing:.09em;margin:0;min-height:100vh;background:radial-gradient(900px 420px at 50% -80px,light-dark(rgba(255,147,160,.20),rgba(255,147,160,.10)),transparent 70%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.stage{display:flex;flex-direction:column;align-items:center;padding:calc(50vh - 62px) 20px 40px;transition:padding-top 1.1s cubic-bezier(.65,.05,.2,1)}
body.go .stage{padding-top:clamp(24px,5vh,48px)}
.logo{display:block;width:116px;height:auto;max-height:120px;object-fit:contain;animation:pop .9s cubic-bezier(.2,.8,.2,1) both;transition:width 1.1s cubic-bezier(.65,.05,.2,1)}
body.go .logo{width:64px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
.greet{text-align:center;margin:14px 0 18px;opacity:0;transform:translateY(8px)}
body.go .greet{animation:rise .6s cubic-bezier(.2,.8,.2,1) .45s forwards}
.title{font-size:28px;letter-spacing:-.035em;margin:0 0 6px;font-weight:800}.sub{font-size:13.5px;color:var(--muted);margin:0}.sub b{color:var(--text);font-weight:600}
.find{position:relative;width:min(100%,420px);margin:0 0 22px;opacity:0;transform:translateY(8px)}body.go .find{animation:rise .5s cubic-bezier(.2,.8,.2,1) .6s forwards}
.find svg{position:absolute;left:15px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.find input{width:100%;height:44px;padding:0 44px 0 42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;box-shadow:0 1px 2px rgba(40,37,34,.05);transition:border-color .15s,box-shadow .15s}
.find input::placeholder{color:var(--muted)}.find input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px light-dark(rgba(255,147,160,.22),rgba(255,147,160,.18))}
.find kbd{position:absolute;right:13px;top:50%;transform:translateY(-50%);font:600 11px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 7px;pointer-events:none}.find input:focus~kbd{display:none}
.nores{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;padding:18px}
.apps{display:grid;gap:16px;width:min(100%,430px);align-items:start}
@media (min-width:640px){.apps{grid-template-columns:repeat(2,1fr);width:min(100%,680px)}}
@media (min-width:1000px){.apps{grid-template-columns:repeat(3,1fr);width:min(100%,1020px)}}
.grp{opacity:0;transform:translateY(14px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 12px 12px;box-shadow:0 1px 2px rgba(40,37,34,.04),0 8px 24px -14px rgba(40,37,34,.18);transition:box-shadow .2s,border-color .2s}.grp:hover{border-color:light-dark(#f3c9cf,#5a3a42);box-shadow:0 1px 2px rgba(40,37,34,.04),0 14px 30px -14px rgba(255,147,160,.45)}
body.go .grp{animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.7s + var(--g) * .08s)}
.gh{display:flex;align-items:center;gap:8px;margin:0 0 8px 8px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.gh:before{content:'';width:3px;height:12px;border-radius:2px;background:var(--accent)}.gh .n{margin-left:auto;margin-right:6px;min-width:20px;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--accent-text);font-size:10.5px;letter-spacing:0;text-align:center}
.app{display:flex;gap:12px;align-items:center;padding:8px 10px 8px 8px;border-radius:12px;color:var(--text);text-decoration:none;transition:background .15s}
.app:hover{background:var(--soft);transform:translateX(2px)}.app{transition:background .15s,transform .15s}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app .ic{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent-text);transition:background .15s,color .15s}.app .ic svg{width:17px;height:17px}
.app:hover .ic{background:var(--accent);color:#2A1018}
.app b{display:block;font-size:14px;font-weight:600;letter-spacing:-.005em}.app span.d{display:none}
.app .go{margin-left:auto;color:var(--accent-text);font-weight:800;font-size:16px;opacity:0;transition:opacity .15s,transform .15s}.app:hover .go{opacity:1;transform:translateX(2px)}
[hidden]{display:none!important}
.foot{margin:26px 0 0;font-size:12px;color:var(--muted);text-align:center}
.empty{color:var(--muted);font-size:14px;text-align:center}
.bdg{display:inline-block;min-width:20px;padding:1px 7px;margin-left:6px;border-radius:99px;background:#FF93A0;color:#2A1018;font-size:12px;font-weight:800;text-align:center}
.pandora-fab{right:82px!important;border-radius:999px!important}a.upl{right:182px!important;text-decoration:none;display:inline-flex;align-items:center;gap:7px}a.upl svg{width:15px;height:15px}@media(max-width:560px){a.upl{top:56px!important;right:12px!important}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage,.logo{transition:none;animation:none}.stage{padding-top:24px}.logo{width:64px}.greet,.grp,.find{opacity:1;transform:none;animation:none!important}}
.edrow{display:flex;align-items:center;gap:4px}.edrow .app{flex:1;pointer-events:none}.edrow button,.gh button,#edbar button{border:1px solid var(--line,#ddd);background:var(--surface,#fff);color:var(--text);border-radius:8px;padding:4px 9px;font:inherit;font-weight:600;cursor:pointer}
</style></head>
<body data-nopw><main class="stage"><img class="logo" src="/pandora-logo.png" alt="Pandora"><div class="greet"><h1 class="title" id="hello">&nbsp;</h1><p class="sub" id="sub">Choose what you want to open.</p></div>
<div class="find" id="findbox" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="find" type="search" placeholder="Find a report" autocomplete="off" aria-label="Find a report"><kbd>/</kbd></div>
<div class="apps" id="apps"></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/></svg>',
 vmzones:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 12h18M12 3v18"/></svg>',
 zonestock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg>',
 slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg>',
 refill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>',
 dist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v7M12 10l-7 6M12 10l7 6M5 16v4M19 16v4M12 10v10"/></svg>',
 recv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M8 12l3 3 5-6"/></svg>',
 schedule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M13 14h3M8 17h3"/></svg>',
 mysales2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>',
 storeteam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.9.8 3 2.6 3 5.6"/></svg>',
 activity:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',dashboards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.9.8 3 2.6 3 5.6"/></svg>',
 uploads:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
 approvals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.2"/><path d="M4 20c0-3.3 2.7-6 6-6 1.4 0 2.6.4 3.6 1.1M15.5 18.5l2 2 4-4.5"/></svg>',
 vm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',
 stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></svg>',
 stockcount:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2M7 8v8M11 8v8M15 8v8M18 8v8"/></svg>',
 stockchecker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6v10M7 6v10M10 6v10M13 6v5"/><circle cx="16.5" cy="15.5" r="3.5"/><path d="M19 18l2.2 2.2"/></svg>',
 access:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
 daily:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 15l2.5-2.5 2 2 3.5-3.5"/></svg>',
 film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
 mysales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>'};
const DEF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
function paint(j){
  document.getElementById('sub').innerHTML='<b>'+new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',weekday:'long',day:'numeric',month:'long'}).format(new Date())+'</b> · Choose what you want to open.';
  document.getElementById('hello').textContent=j.greet?'Hello '+j.greet:j.label?'Hello, '+j.label:'Welcome';
  if(j.apps.some(a=>a.id==='uploads')&&!document.querySelector('a.upl')){const u=document.createElement('a');u.className='pandora-fab upl';u.href='/uploads';u.innerHTML=ICON.uploads+'All Uploads';document.body.appendChild(u)}
  const apps=j.apps.filter(a=>a.id!=='uploads');
  const BASE=[['Sales',['overview','insights','dashboards','staff','mysales','mysales2','storeteam','daily','film']],['Stock',['stock','stockcount','stockchecker','slow','transfer']],['Ordering',['refill','dist','recv']],['Visual Merchandising',['vmzones','zonestock','vm']],['Team & Access',['schedule','approvals','access','activity']]];
  // the super admin's saved order, with anything newer kept at the end of its usual section
  const saved=EDIT||j.homeOrder||[];
  const GROUPS=saved.length?saved.map(([n,ids])=>{const b=BASE.find(x=>x[0]===n);return [n,ids.concat(b?b[1].filter(i=>!ids.includes(i)):[])]}).concat(BASE.filter(b=>!saved.some(x=>x[0]===b[0]))):BASE;
  LAST=j;
  const tile=a=>`<a class="app" href="${esc(a.href)}" title="${esc(a.desc||'')}"><span class="ic">${ICON[a.id]||DEF}</span><b>${esc(a.title)}</b><span class="d">${esc(a.desc||'')}</span><span class="go" aria-hidden="true">&rsaquo;</span></a>`;
  const used=new Set(),secs=[];
  GROUPS.forEach(([name,ids])=>{const list=ids.map(id=>apps.find(a=>a.id===id)).filter(Boolean);list.forEach(a=>used.add(a.id));if(list.length)secs.push([name,list])});
  const rest=apps.filter(a=>!used.has(a.id));if(rest.length)secs.push(['More',rest]);
  document.getElementById('apps').innerHTML=apps.length?secs.map(([name,list],g)=>`<section class="grp" style="--g:${g}"><h2 class="gh">${esc(name)}${EDIT?''.concat(''):`<span class="n">${list.length}</span>`}${EDIT?` <button type="button" data-sec="${g}" data-d="-1">‹</button><button type="button" data-sec="${g}" data-d="1">›</button>`:''}</h2>${list.map(a=>EDIT?`<div class="edrow">${tile(a)}<button type="button" data-g="${g}" data-id="${esc(a.id)}" data-d="-1">↑</button><button type="button" data-g="${g}" data-id="${esc(a.id)}" data-d="1">↓</button></div>`:tile(a)).join('')}</section>`).join(''):'<div class="empty">There is nothing to open for your account yet. Please contact your manager.</div>';
  VIS=secs.map(([n,l])=>[n,l.map(a=>a.id)]);
  const fb=document.getElementById('findbox');fb.hidden=EDIT||apps.length<6;applyFind();
  if(apps.some(a=>a.id==='access')&&!document.getElementById('edbar')){const d=document.createElement('div');d.id='edbar';d.style.cssText='display:flex;gap:8px;justify-content:center;margin:16px 0';document.getElementById('apps').after(d)}
  const bar=document.getElementById('edbar');if(bar)bar.innerHTML=EDIT?'<button type="button" id="edsave">Save order</button><button type="button" id="edcancel">Cancel</button><button type="button" id="edreset">Standard order</button>':'<button type="button" id="edopen">Edit cards order</button>';
  return apps;
}
let EDIT=null,LAST=null,VIS=[];
function applyFind(){const q=(document.getElementById('find').value||'').trim().toLowerCase(),box=document.getElementById('apps');let any=false;
  box.querySelectorAll('.grp').forEach(g=>{let n=0;g.querySelectorAll('.app').forEach(a=>{const ok=!q||a.querySelector('b').textContent.toLowerCase().includes(q)||g.querySelector('.gh').textContent.toLowerCase().includes(q);a.hidden=!ok;if(ok)n++});g.hidden=!n;if(n)any=true});
  const old=box.querySelector('.nores');if(old)old.remove();if(q&&!any)box.insertAdjacentHTML('beforeend','<div class="nores">No report matches “'+esc(q)+'”.</div>')}
document.getElementById('find').addEventListener('input',applyFind);
document.getElementById('find').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=document.querySelector('#apps .grp:not([hidden]) .app:not([hidden])');if(a)location.href=a.href}else if(e.key==='Escape'){e.target.value='';applyFind();e.target.blur()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))&&!document.getElementById('findbox').hidden){e.preventDefault();document.getElementById('find').focus()}});
document.addEventListener('click',async e=>{
  const t=e.target,mv=(l,i,d)=>{const j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]]};
  if(t.id==='edopen'){e.preventDefault();EDIT=VIS.filter(v=>v[0]!=='More');paint(LAST);return}
  if(t.id==='edcancel'){EDIT=null;paint(LAST);return}
  if(t.dataset&&t.dataset.sec){mv(EDIT,+t.dataset.sec,+t.dataset.d);paint(LAST);return}
  if(t.dataset&&t.dataset.id){const l=EDIT[+t.dataset.g][1];mv(l,l.indexOf(t.dataset.id),+t.dataset.d);paint(LAST);return}
  if(t.id==='edsave'||t.id==='edreset'){const home=t.id==='edsave'?EDIT:[];
    const r=await fetch('/api/access',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'homeorder',home})}).catch(()=>null);
    if(!r||!r.ok){alert('Could not save the order.');return}
    LAST.homeOrder=home;EDIT=null;paint(LAST)}
});
// the logo shows alone and centred first, then glides up and the pages appear one by one
const reveal=()=>document.body.classList.add('go');
if(matchMedia('(prefers-reduced-motion: reduce)').matches)reveal();else setTimeout(reveal,1500);
// the server already put who-you-are and what-you-can-open into the page, so it draws at once (no loading flash)
async function badge(){
  // waiting-for-approval count: fills in afterwards without redrawing anything
  try{const q=await fetch('/api/accounts',{credentials:'same-origin',cache:'no-store'});const d=q.ok?await q.json():null;if(!d)return;
    const n=d.accounts?d.accounts.filter(x=>x.status==='pending').length:0,f=d.resets?d.resets.length:0;
    const parts=[n?n+' waiting for approval':'',f?f+' forgot password':''].filter(Boolean);
    const card=document.querySelector('a.app[href="/staff/accounts"]');if(!card||!parts.length)return;
    card.querySelector('.d').textContent=parts.join(' · ');card.title=parts.join(' · ');
    card.querySelector('b').insertAdjacentHTML('beforeend',' <span class="bdg">'+(n+f)+'</span>')}catch(_){}
}
(async()=>{
 try{
  let j=window.__HOME;
  if(!j){
    const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    j=await r.json();if(!j.ok)throw 0;
  }
  const apps=paint(j);
  if(apps.some(a=>a.id==='approvals'))badge();
 }catch(_){document.getElementById('apps').innerHTML='<div class="empty">Could not load. Please refresh the page.</div>'}
})();
</script></body></html>
