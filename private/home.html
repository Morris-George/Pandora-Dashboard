<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pandora — Home</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3f1,#151413);--surface:light-dark(#fff,#211f1d);--surface2:light-dark(#faf8f6,#292623);--text:light-dark(#282522,#f7f2ed);--muted:light-dark(#817a74,#b7aea6);--line:light-dark(#e9e2dc,#3a3530);--accent:#FF93A0;--accent2:#FF93A0;--accent-text:light-dark(#2A1F24,#FF93A0)}
*{box-sizing:border-box}body{word-spacing:.09em;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,var(--surface) 0%,var(--bg) 68%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.panel{width:min(100%,420px);padding:38px 34px 30px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #4b17300d;text-align:center}.logo{display:block;width:min(230px,78%);max-height:120px;object-fit:contain;margin:0 auto 26px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);font-weight:750}.title{font-size:26px;letter-spacing:-.04em;margin:10px 0 8px}.sub{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 28px}form{text-align:left}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input,.field select{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;color:var(--text);background:var(--surface2);outline:none}.field input:focus,.field select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #FF93A044}.password-wrap{position:relative}.password-wrap input{padding-right:68px}.toggle{position:absolute;right:10px;top:0;height:48px;border:0;background:none;color:var(--accent-text);font-weight:700;cursor:pointer}.submit{width:100%;height:49px;margin-top:7px;border:0;border-radius:10px;background:var(--accent);color:#2A1018;font-size:14px;font-weight:750;cursor:pointer}.submit:hover{filter:brightness(.96)}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;color:light-dark(#2A1018,#FF93A0);background:light-dark(#FFE4E8,#3a1f24);border:1px solid #FF93A0;border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.4;margin:0 0 16px}.foot{font-size:11px;color:var(--muted);margin:23px 0 0}.rule{width:42px;height:3px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:0 auto 20px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}.pick{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:14px 10px;font:inherit;font-size:13px;font-weight:750;cursor:pointer;line-height:1.3}.pick small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}.pick:hover{border-color:var(--accent2)}.pick[aria-pressed="true"]{border-color:var(--accent);background:light-dark(#FFE4E8,#33202a);box-shadow:0 0 0 2px #FF93A055}.pick:focus-visible,.submit:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.hint{font-size:13px;color:var(--muted);margin:0 0 6px;text-align:center}@media(max-width:380px){.choose{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}

.ok{display:none;color:light-dark(#14633b,#8fe0b4);background:light-dark(#eefaf3,#16301f);border:1px solid light-dark(#bfe6cd,#2c5a3b);border-radius:9px;padding:12px;font-size:14px;line-height:1.5;margin:0 0 16px;text-align:left}
.small{font-size:12px;color:var(--muted);margin:6px 0 0}.link{color:var(--accent-text);font-weight:700}.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.bdg{display:inline-block;min-width:20px;padding:1px 7px;margin-left:6px;border-radius:99px;background:#FF93A0;color:#2A1018;font-size:12px;font-weight:800;text-align:center}</style><style>
.panel.wide{width:min(100%,560px)}.apps{display:grid;gap:12px;text-align:left;margin:4px 0 0}
.app{display:flex;gap:14px;align-items:center;padding:16px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);text-decoration:none}
.app:hover{border-color:var(--accent2);box-shadow:0 0 0 3px #FF93A044}.app:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.app .ic{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;background:light-dark(#FFE4E8,#33202a);color:var(--accent-text)}.app .ic svg{width:22px;height:22px}
.app b{display:block;font-size:15px}.app span.d{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}.app .go{margin-left:auto;color:var(--accent-text);font-weight:800;font-size:18px}
.empty{color:var(--muted);font-size:14px}.pandora-fab{right:82px!important}a.upl{right:182px!important;text-decoration:none;display:inline-flex;align-items:center;gap:7px}a.upl svg{width:15px;height:15px}@media(max-width:560px){a.upl{top:56px!important;right:12px!important}}
</style>
<style id="desk">
.side{display:none}
@media (min-width:900px){
 body{display:grid!important;grid-template-columns:minmax(360px,44%) 1fr;padding:0!important;place-items:stretch!important;background:var(--bg)!important}
 .side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:64px 56px;color:#2A1018;background:linear-gradient(155deg,#FF93A0 0%,#FFA9B3 55%,#FFC4CB 100%);position:sticky;top:0;height:100vh}
 .side img{width:min(440px,78%);max-height:420px;object-fit:contain;margin:0}
 .side h2{margin:0;font-size:38px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
 .side p{margin:0;font-size:16px;line-height:1.6;opacity:.9;max-width:420px}
 .side ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px;font-weight:600}
 .side li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2A1018;margin-right:12px;opacity:.85}
 .panel{align-self:center;justify-self:center;width:min(100%,460px)!important;margin:48px 24px;border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important}
 .panel .logo,.panel .rule{display:none}
 .panel .eyebrow{text-align:left}.panel .title{font-size:34px;text-align:left}.panel .sub,.panel .hint,.panel .foot{text-align:left}
 .panel.wide{width:min(100%,700px)!important}.panel.wide .apps{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
}
@media (min-width:900px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
</style></head>
<body><aside class="side"><img src="/pandora-logo.png" alt="Pandora"></aside><main class="panel wide"><img class="logo" src="/pandora-logo.png" alt="Pandora"><div class="rule"></div><h1 class="title" id="hello">&nbsp;</h1><p class="sub" id="sub">Choose what you want to open.</p>
<div class="apps" id="apps"></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={dashboards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 staff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.9.8 3 2.6 3 5.6"/></svg>',
 uploads:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
 approvals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.2"/><path d="M4 20c0-3.3 2.7-6 6-6 1.4 0 2.6.4 3.6 1.1M15.5 18.5l2 2 4-4.5"/></svg>',
 vm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',
 stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></svg>',
 mysales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9M15 7h5v5"/></svg>'};
const DEF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
function paint(j){
  document.getElementById('hello').textContent=j.greet?'Hello '+j.greet:j.label?'Hello, '+j.label:'Welcome';
  if(j.apps.some(a=>a.id==='uploads')&&!document.querySelector('a.upl')){const u=document.createElement('a');u.className='pandora-fab upl';u.href='/uploads';u.innerHTML=ICON.uploads+'All Uploads';document.body.appendChild(u)}
  const apps=j.apps.filter(a=>a.id!=='uploads');
  document.getElementById('apps').innerHTML=apps.length?apps.map(a=>`<a class="app" href="${esc(a.href)}"><span class="ic">${ICON[a.id]||DEF}</span><span><b>${esc(a.title)}</b><span class="d">${esc(a.desc||'')}</span></span><span class="go" aria-hidden="true">&rsaquo;</span></a>`).join(''):'<div class="empty">There is nothing to open for your account yet. Please contact your manager.</div>';
  return apps;
}
// the server already put who-you-are and what-you-can-open into the page, so it draws at once (no loading flash)
async function badge(){
  // waiting-for-approval count: fills in afterwards without redrawing anything
  try{const q=await fetch('/api/accounts',{credentials:'same-origin',cache:'no-store'});const d=q.ok?await q.json():null;if(!d)return;
    const n=d.accounts?d.accounts.filter(x=>x.status==='pending').length:0,f=d.resets?d.resets.length:0;
    const parts=[n?n+' waiting for approval':'',f?f+' forgot password':''].filter(Boolean);
    const card=document.querySelector('a.app[href="/staff/accounts"]');if(!card||!parts.length)return;
    card.querySelector('.d').textContent=parts.join(' · ');
    card.querySelector('b').insertAdjacentHTML('beforeend',' <span class="bdg">'+(n+f)+'</span>')}catch(_){}
}
(async()=>{
 try{
  let j=window.__HOME;
  if(!j){
    const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    j=await r.json();if(!j.ok)throw 0;
  }
  const apps=paint(j);
  if(apps.some(a=>a.id==='approvals'))badge();
 }catch(_){document.getElementById('apps').innerHTML='<div class="empty">Could not load. Please refresh the page.</div>'}
})();
</script></body></html>
