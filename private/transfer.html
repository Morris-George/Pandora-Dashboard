<script>
/* Sharp pictures: the small built-in picture shows first, the full-size one (from pandoraeg.com, found by our server at /api/pic) replaces it whenever a picture is shown big. */
window.HD=(function(){const KEY='pandora-hd-v1',M=new Map(),L=new Map(),R=new Map(),F=new Map();let c={};try{c=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const base=s=>String(s||'').trim().toUpperCase().split('-')[0];
const big=u=>{try{const x=new URL(String(u).replace(/^http:/,'https:'),location.href);x.searchParams.set('width','900');return x.href}catch(e){return u}};
function url(sku){const b=base(sku);if(!b||b[0]==='?')return Promise.resolve('');if(c[b])return Promise.resolve(c[b]);
  if(!M.has(b)){const pr=fetch('/api/pic?sku='+encodeURIComponent(b),{credentials:'same-origin'}).then(r=>r.json()).then(j=>{const u=j&&j.url||'';if(u){c[b]=u;try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}return u}).catch(()=>'');M.set(b,pr);pr.then(u=>{if(!u)M.delete(b)})}return M.get(b)}
/* load(): finds the full-size picture AND downloads + decodes it ahead of time, so showing it later is instant (no small blurry picture first) */
function load(sku){const b=base(sku);if(!b||b[0]==='?')return Promise.resolve('');if(R.has(b))return Promise.resolve(R.get(b));if(L.has(b))return L.get(b);
  if(F.has(b)&&Date.now()-F.get(b)<60000)return Promise.resolve('');
  const p=url(sku).then(u=>u?new Promise(res=>{const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{const d=()=>{R.set(b,im.src);res(im.src)};im.decode?im.decode().then(d,d):d()};im.onerror=()=>res('');im.src=big(u)}):'');
  L.set(b,p);p.then(s=>{L.delete(b);if(!s)F.set(b,Date.now())});return p}
/* up(): swaps the small picture for the sharp one. hold=true keeps the small one hidden until the sharp one is ready (max 1.5 s), so the blurry picture is never seen */
function up(img,sku,hold){if(!img||!sku)return;const t=(img._hd=(img._hd||0)+1),b=base(sku),r=R.get(b);
  if(r){img.src=r;img.style.opacity='';return}
  if(hold&&b&&b[0]!=='?'){img.style.transition='opacity .12s';img.style.opacity='0';setTimeout(()=>{if(img._hd===t)img.style.opacity=''},1500)}
  load(sku).then(s=>{if(img._hd!==t)return;if(s)img.src=s;img.style.opacity=''})}
const dvOf=img=>{const e=img.closest&&img.closest('[data-hd]');return e?e.dataset.hd:''};
/* warm-up: pictures that are on screen (or about to be) are fetched in the background, 3 at a time; touching one fetches it straight away */
const WQ=[];let wbusy=0,wio=null;
function wpump(){while(wbusy<3&&WQ.length){const s=WQ.shift();wbusy++;load(s).finally(()=>{wbusy--;wpump()})}}
const SEL='.img img,.ovp img,#hitPic img,#sidePic img';
let q=0;function scan(){q=0;
  document.querySelectorAll('.ovp img,#hitPic img').forEach(i=>{if(i._hdSeen)return;i._hdSeen=1;up(i,dvOf(i),true)});
  if('IntersectionObserver' in window){if(!wio)wio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;wio.unobserve(e.target);const d=dvOf(e.target);if(d){WQ.push(d);wpump()}}),{rootMargin:'200px'});
    document.querySelectorAll('.img img,#sidePic img').forEach(i=>{if(i._hdW)return;i._hdW=1;wio.observe(i)})}}
try{new MutationObserver(()=>{if(!q)q=requestAnimationFrame(scan)}).observe(document.documentElement,{childList:true,subtree:true})}catch(e){}
['pointerover','pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev,e=>{const i=e.target&&e.target.closest&&e.target.closest(SEL);if(i){const d=dvOf(i);if(d)load(d)}},{capture:true,passive:true}));
return {up,url,big,dvOf,load}})();
</script>

const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const fmtd=d=>{if(!d)return '';const t=Date.parse(d);return t?new Date(t).toLocaleDateString([],{day:'numeric',month:'short'}):''};
let D=null,ITEMS=[],SOLD=new Map(),STK=new Map(),PKG=new Map();
const PK={scope:'',q:'',cat:'',mv:false,only:false,sel:new Map(),lim:300};
const catOf=(g,nm)=>{const pick=t=>{t=String(t||'').toLowerCase();if(!t)return '';if(/safety/.test(t))return 'Charms';if(/earring|\bstud|hoop|huggie/.test(t))return 'Earrings';if(/bracelet|bangle/.test(t))return 'Bracelets';if(/pendant|necklace|collier/.test(t))return 'Necklace and Pendant';if(/charm|clip|dangle|spacer|medallion|murano/.test(t))return 'Charms';if(/\bring/.test(t))return 'Rings';return ''};return pick(g)||pick(nm)||(g?String(g).split(' - ').pop():'Other')};

const pkAll=()=>[...new Set([...ITEMS.map(i=>i.store),...[...SOLD.keys()].map(k=>k.slice(k.indexOf('|')+1))])].sort();
const pkStores=()=>[...new Set(ITEMS.map(i=>i.store))].sort();
const pkQty=(g,st)=>STK.get(g.sku+'|'+st)||0;
const pkUsed=(e,st,skip)=>e.lines.reduce((a,l,ix)=>a+(ix!==skip&&l.from===st?l.qty:0),0);
const pkRoom=(e,st,skip)=>Math.max(0,pkQty(e.g,st)-pkUsed(e,st,skip));
const pkPcs=e=>e.lines.reduce((a,l)=>a+(l.to?l.qty:0),0);
async function load(fresh){showErr('');$('meta').textContent='Loading stock from ERP…';
  try{D=await api('/api/transfer'+(fresh?'?fresh=1':''));
    ITEMS=D.items.map(r=>({sku:r[0],ean:r[1],name:String(r[2]).replace(/^\s*[0-9A-Z]+(-[0-9A-Z]{1,4})?-\d{8,14}\s*-?\s*/i,'')||r[2],grp:r[3],cat:catOf(r[3],r[2]),store:r[4],qty:r[5]}));
    SOLD=new Map(D.sales.map(x=>[x[0]+'|'+x[1],{q:x[2],last:x[3]}]));STK=new Map(ITEMS.map(i=>[i.sku+'|'+i.store,i.qty]));
    PKG=new Map();for(const i of ITEMS){const g=PKG.get(i.sku)||PKG.set(i.sku,{sku:i.sku,name:i.name,cat:i.cat,ean:i.ean,items:[]}).get(i.sku);g.items.push(i)}
    for(const [k,e] of [...PK.sel]){const g=PKG.get(k);if(!g){PK.sel.delete(k);continue}e.g=g;e.lines=e.lines.filter(l=>pkQty(g,l.from)>0);for(let ix=0;ix<e.lines.length;ix++)e.lines[ix].qty=Math.min(e.lines[ix].qty,pkRoom(e,e.lines[ix].from,ix))}
    $('meta').innerHTML=`Stock in ERP now: <b>${fmt(ITEMS.reduce((a,i)=>a+i.qty,0))}</b> pieces, <b>${fmt(PKG.size)}</b> SKUs in <b>${pkStores().length}</b> stores · sales of the last ${D.months} months · loaded ${new Date(D.at).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. Samples, main warehouse and transit are left out.`;
    $('box').hidden=$('foot').hidden=false;pkDraw()}catch(e){$('meta').textContent='';showErr(e.message)}}
$('reload').onclick=async()=>{const b=$('reload');b.disabled=true;await load(true);b.disabled=false};
// where the SKU sells: stores that sold it in the last months (best need first), with what they hold now; only where another store can send it
function sugOf(g){const out=[];for(const s of pkAll()){const o=SOLD.get(g.sku+'|'+s);if(!o||!(o.q>0))continue;if(!g.items.some(i=>i.store!==s))continue;out.push({to:s,sold:o.q,have:pkQty(g,s)})}return out.sort((a,b)=>(b.sold-b.have)-(a.sold-a.have)||b.sold-a.sold)}
const pkScoped=g=>PK.scope?g.items.filter(i=>i.store===PK.scope):g.items;
function pkList(){const q=PK.q.trim().toUpperCase();
  return [...PKG.values()].filter(g=>pkScoped(g).length&&(!PK.cat||g.cat===PK.cat)&&(!PK.only||PK.sel.has(g.sku))&&(!q||g.sku.includes(q)||String(g.name).toUpperCase().includes(q)||String(g.ean).includes(q))&&(!PK.mv||sugOf(g).length))
   .sort((a,b)=>(PK.sel.has(b.sku)-PK.sel.has(a.sku))||(pkScoped(b).reduce((x,i)=>x+i.qty,0)-pkScoped(a).reduce((x,i)=>x+i.qty,0))||a.sku.localeCompare(b.sku))}
const hint=(g,st)=>{if(!st)return '';const o=SOLD.get(g.sku+'|'+st);return `sold ${fmt(o?o.q:0)} · has ${fmt(pkQty(g,st))}`};
function pkLn(e,l,ix){const froms=e.g.items.map(i=>i.store);
  return `<div class="ln" data-ln="${ix}"><select data-lf aria-label="From store">${froms.map(st=>`<option${st===l.from?' selected':''}>${esc(st)}</option>`).join('')}</select><span class="arr">${ic('arrow')}</span><select data-lt aria-label="To store"><option value="">Choose a store</option>${pkAll().filter(st=>st!==l.from).map(st=>`<option${st===l.to?' selected':''}>${esc(st)}</option>`).join('')}</select><input type="number" inputmode="numeric" min="0" max="${pkQty(e.g,l.from)}" value="${l.qty}" data-lq aria-label="Pieces"><span class="note">pcs</span><small class="note">${hint(e.g,l.to)}</small><button class="x" data-lx aria-label="Remove this line">${ic('x')}</button></div>`}
const pkStay=e=>'Staying: '+e.g.items.map(i=>`<b>${esc(i.store)}</b> ${fmt(pkRoom(e,i.store))}`).join(' · ');
function pkPlanHtml(g){const e=PK.sel.get(g.sku),sg=sugOf(g),so=SOLD,have=g.items.map(i=>{const o=so.get(g.sku+'|'+i.store);return `<b>${esc(i.store)}</b> ${fmt(i.qty)}${o&&o.q?` <span class="have">(sold ${fmt(o.q)})</span>`:''}`}).join(' · ');
  const head=`<div class="note">In stock: ${have}</div>`;
  if(!e)return `<div class="pkp" style="display:block">${head}${sg.length?`<div class="note">Sells at: ${sg.map(x=>`<b>${esc(x.to)}</b> ${fmt(x.sold)} <span class="have">(has ${fmt(x.have)})</span>`).join(' · ')}</div>`:'<div class="note">No other store sold it in the last '+D.months+' months.</div>'}</div>`;
  const used=new Set(e.lines.map(l=>l.to)),sgs=sg.filter(x=>!used.has(x.to));
  return `<div class="pkp" style="display:block">${head}<div class="lns">${e.lines.map((l,ix)=>pkLn(e,l,ix)).join('')}</div><div class="row" style="margin-top:6px"><button class="sug" data-ladd>+ Add a transfer line</button>${sgs.length?`<span class="note">Suggested:</span>${sgs.map(x=>`<button class="sug" data-pksug="${esc(x.to)}">+ ${esc(x.to)} <small>sold ${fmt(x.sold)} · has ${fmt(x.have)}</small></button>`).join('')}`:''}<span class="note" data-pkleft>${pkStay(e)}</span></div></div>`}
function pkRow(g){const e=PK.sel.get(g.sku),si=pkScoped(g),tot=si.reduce((a,i)=>a+i.qty,0);
  return `<div class="pk${e?' sel':''}" data-pk="${esc(g.sku)}"><div class="pkt"><span class="ck">${ic('check')}</span>${pic(g.sku).replace('class="img"','class="img lg"')}<div class="mid"><b title="${esc(g.name)}">${esc(g.name||g.sku)}</b><div class="note">${esc(g.sku)} · ${esc(g.cat)} · in stock in <b style="display:inline">${g.items.length}</b> store${g.items.length>1?'s':''}</div></div><div class="qt">${(D.prices||{})[g.sku]?`<div class="note" title="Latest selling price per piece, VAT included">EGP <b style="display:inline">${fmt(D.prices[g.sku])}</b> each</div>`:''}<b>${fmt(tot)}</b> <small class="note">in stock</small></div></div>${pkPlanHtml(g)}</div>`}
function pkRedo(r){const g=PKG.get(r.dataset.pk);if(!g)return;const t=document.createElement('div');t.innerHTML=pkRow(g);r.replaceWith(t.firstChild);pkSum();pkDrawScope()}
function pkDrawScope(){const stores=pkStores(),cn=st=>new Set(ITEMS.filter(i=>!st||i.store===st).map(i=>i.sku)).size,sn=st=>[...PK.sel.values()].filter(e=>e.lines.some(l=>l.to&&l.qty>0&&(!st||l.from===st))).length;
  $('pkScope').innerHTML=[''].concat(stores).map(st=>`<span class="chip ${PK.scope===st?'on':''}" data-pkscope="${esc(st)}">${st?esc(st):'All stores together'} <b>${fmt(cn(st))}</b>${sn(st)?` <span class="note">· ${sn(st)} to move</span>`:''}</span>`).join('')}
function pkDraw(){
  if(PK.scope&&!pkStores().includes(PK.scope))PK.scope='';pkDrawScope();
  const cats=[...new Set(ITEMS.filter(i=>!PK.scope||i.store===PK.scope).map(i=>i.cat))].sort();if(PK.cat&&!cats.includes(PK.cat))PK.cat='';
  $('pkCat').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option ${c===PK.cat?'selected':''}>${esc(c)}</option>`).join('');
  $('pkMv').classList.toggle('on',PK.mv);$('pkPk').classList.toggle('on',PK.only);
  const l=pkList(),shown=l.slice(0,PK.lim);
  $('pkCnt').textContent=`${fmt(l.length)} SKUs shown${l.length>shown.length?` (first ${fmt(shown.length)}, search or pick a store to narrow)`:''}`;
  $('pkList').innerHTML=shown.map(pkRow).join('')+(l.length>shown.length?`<button class="btn" data-pkmore style="margin:6px 0">Show ${fmt(Math.min(300,l.length-shown.length))} more</button>`:'')||'<div class="note" style="padding:20px">No items match.</div>';pkSum()}
function pkSum(){const v=[...PK.sel.values()].filter(e=>pkPcs(e)>0),pcs=v.reduce((a,e)=>a+pkPcs(e),0),L=v.flatMap(e=>e.lines.filter(l=>l.to&&l.qty>0)),f=new Set(L.map(l=>l.from)).size,t=new Set(L.map(l=>l.to)).size;
  $('pkSum').innerHTML=v.length?`<b>${fmt(v.length)}</b> SKUs · <b>${fmt(pcs)}</b> pieces · from <b>${f}</b> store${f>1?'s':''} to <b>${t}</b> store${t>1?'s':''}`:'<span class="note">Nothing to move yet. Tap an item, then set from, to and the pieces.</span>';
  $('pkGo').innerHTML=ic('dl')+' Download Excel';$('pkGo').disabled=!v.length}
function pkExport(){const rows=[];
  for(const e of [...PK.sel.values()])for(const l of e.lines)if(l.to&&l.qty>0)rows.push({price:((D&&D.prices)||{})[e.g.sku]||'',from:l.from,to:l.to,sku:e.g.sku,ean:e.g.ean,name:e.g.name,cat:e.g.cat,qty:l.qty});
  rows.sort((a,b)=>a.from.localeCompare(b.from)||a.to.localeCompare(b.to)||a.cat.localeCompare(b.cat)||a.sku.localeCompare(b.sku));if(!rows.length)return;
  const L=r=>({'From store':r.from,'To store':r.to,'SKU':r.sku,'EAN':r.ean,'Item':r.name,'Category':r.cat,'Price (EGP)':r.price,'Pcs':r.qty,'Done':''});
  const wb=XLSX.utils.book_new(),mk=(a,w)=>{const ws=XLSX.utils.json_to_sheet(a);ws['!cols']=w;return ws};
  XLSX.utils.book_append_sheet(wb,mk(rows.map(L),[{wch:16},{wch:20},{wch:16},{wch:15},{wch:42},{wch:20},{wch:11},{wch:6},{wch:7}]),'Transfer list');
  const used=new Set(['Transfer list']);
  for(const st of [...new Set(rows.map(r=>r.from))]){let nm=('Send from '+String(st).replace(/[\\\/?*:\[\]]/g,' ')).slice(0,31),k=2;while(used.has(nm))nm=nm.slice(0,28)+' '+k++;used.add(nm);
    XLSX.utils.book_append_sheet(wb,mk(rows.filter(r=>r.from===st).map(r=>({'Send to':r.to,'SKU':r.sku,'EAN':r.ean,'Item':r.name,'Category':r.cat,'Price (EGP)':r.price,'Pcs':r.qty,'Done':''})),[{wch:22},{wch:16},{wch:15},{wch:42},{wch:20},{wch:11},{wch:6},{wch:7}]),nm)}
  const fs=[...new Set(rows.map(r=>r.from))];
  XLSX.writeFile(wb,'Transfer '+(fs.length===1?fs[0]:'all stores')+' '+new Date().toISOString().slice(0,10)+'.xlsx')}
$('pkQ').oninput=()=>{PK.q=$('pkQ').value;PK.lim=300;pkDraw()};$('pkCat').onchange=()=>{PK.cat=$('pkCat').value;PK.lim=300;pkDraw()};
const pkCtx=el=>{const r=el.closest('.pk'),ln=el.closest('.ln');return r&&ln?{r,e:PK.sel.get(r.dataset.pk),ix:+ln.dataset.ln}:null};
// the best store to send from: the scope store if it holds the item, else the one with the most room
const pkFrom=e=>{const hs=e.g.items.filter(i=>pkRoom(e,i.store)>0);return (hs.find(i=>i.store===PK.scope)||hs.sort((a,b)=>pkRoom(e,b.store)-pkRoom(e,a.store))[0]||e.g.items[0]).store};
document.addEventListener('input',e=>{const inp=e.target.closest('[data-lq]');if(!inp)return;const c=pkCtx(inp);if(!c||!c.e)return;const l=c.e.lines[c.ix];
  let v=Math.max(0,Math.floor(Number(inp.value)||0));const mx=pkRoom(c.e,l.from,c.ix);if(v>mx){v=mx;inp.value=v}l.qty=v;c.r.querySelector('[data-pkleft]').innerHTML=pkStay(c.e);pkSum();pkDrawScope()});
document.addEventListener('change',e=>{const f=e.target.closest('[data-lf]'),t=e.target.closest('[data-lt]'),x=f||t;if(!x)return;const c=pkCtx(x);if(!c||!c.e)return;const l=c.e.lines[c.ix];
  if(f){l.from=f.value;if(l.to===l.from)l.to='';l.qty=Math.min(l.qty||pkRoom(c.e,l.from,c.ix),pkRoom(c.e,l.from,c.ix))}else l.to=t.value;pkRedo(c.r)});
document.addEventListener('click',e=>{const t=e.target;
  const sc=t.closest('[data-pkscope]');if(sc){PK.scope=sc.dataset.pkscope;PK.lim=300;pkDraw();return}
  if(t.closest('[data-pkmv]')){PK.mv=!PK.mv;PK.lim=300;pkDraw();return}
  if(t.closest('[data-pkpicked]')){PK.only=!PK.only;PK.lim=300;pkDraw();return}
  if(t.closest('[data-pknone]')){PK.sel.clear();pkDraw();return}
  if(t.closest('[data-pkmore]')){PK.lim+=300;pkDraw();return}
  if(t.closest('[data-pkgo]')){pkExport();return}
  const lx=t.closest('[data-lx]');if(lx){const c=pkCtx(lx);if(c&&c.e){c.e.lines.splice(c.ix,1);pkRedo(c.r)}return}
  const la=t.closest('[data-ladd]');if(la){const r=la.closest('.pk'),en=PK.sel.get(r.dataset.pk);if(en){const fr=pkFrom(en);en.lines.push({from:fr,to:'',qty:pkRoom(en,fr)});pkRedo(r)}return}
  const sg=t.closest('[data-pksug]');if(sg){const r=sg.closest('.pk'),en=PK.sel.get(r.dataset.pk);if(en){const x=sugOf(en.g).find(y=>y.to===sg.dataset.pksug);let fr=pkFrom(en);if(fr===sg.dataset.pksug)fr=(en.g.items.find(i=>i.store!==sg.dataset.pksug&&pkRoom(en,i.store)>0)||en.g.items.find(i=>i.store!==sg.dataset.pksug)).store;
    en.lines.push({from:fr,to:sg.dataset.pksug,qty:Math.min(Math.max(1,x?x.sold-x.have:1),pkRoom(en,fr))});pkRedo(r)}return}
  if(t.closest('.img img,.pkp'))return;
  const r=t.closest('[data-pk]');if(r){const g=PKG.get(r.dataset.pk);if(!g)return;if(PK.sel.has(g.sku))PK.sel.delete(g.sku);else PK.sel.set(g.sku,{g,lines:[]});pkRedo(r)}});

load();
</script>
