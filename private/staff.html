<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Staff Performance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky control bar over a KPI strip, then a store ranking chart and a staff table. Rose-tinted neutrals, one pink data hue. */
:root{
  --bg:#FBF6F7; --surface:#FFFAF1; --ink:#2A1F24; --ink2:#6B5A61; --line:#EADCDF;
  --accent:#FF93A0;--accent-text:#2A1F24; --fill:#FF93A0; --fill-soft:#FFE4E8; --hover:#FFF1F3; --good:#1F7A4D;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171013; --surface:#241A1E; --ink:#F3EADB; --ink2:#B9A5AC; --line:#3A2A30;
  --accent:#FF93A0;--accent-text:#FF93A0; --fill:#FF93A0; --fill-soft:#3A2229; --hover:#2D2025; --good:#5CC48E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171013; --surface:#241A1E; --ink:#F3EADB; --ink2:#B9A5AC; --line:#3A2A30;
  --accent:#FF93A0;--accent-text:#FF93A0; --fill:#FF93A0; --fill-soft:#3A2229; --hover:#2D2025; --good:#5CC48E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{word-spacing:.09em;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.brand .sub{color:var(--ink2);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#2A1018}
:root[data-theme="dark"] .btn.primary{color:#2A1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#2A1018}}
.btn.primary:hover{filter:brightness(1.06)}

.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);color:var(--ink2)}
.drop.over{border-color:var(--accent);background:var(--fill-soft)}
.drop b{color:var(--ink)}
.err{color:#2A1018;background:#FF93A0;border-radius:10px;padding:10px 14px;font-weight:600}

.controls{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;min-width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#2A1018}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#2A1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#2A1018}}
.search{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;min-width:180px;flex:1;max-width:280px}
details.groups summary{cursor:pointer;color:var(--ink2);font-weight:600}
.dlab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.dlab input[type=date]{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit}
.dmsg{color:var(--ink2);font-size:12.5px;font-weight:600}
details.groups .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px;margin-top:10px;max-height:220px;overflow:auto}
details.groups label{display:flex;gap:8px;align-items:center;font-size:12.5px;min-width:0}
details.groups label span{overflow-wrap:anywhere}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.cardhead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.cardhead .meta{color:var(--ink2);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:10px 12px;border-radius:12px;background:var(--bg);min-width:0}
.kpi.hero{grid-column:span 2;background:var(--fill-soft)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700}
.kpi{min-width:0}.kpi .v{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi.hero .v{font-size:28px}
@media (max-width:520px){.kpi.hero{grid-column:span 1}.kpi.hero .v{font-size:22px}}

.bars{display:flex;flex-direction:column;gap:4px}
.brow{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;padding:4px 6px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.brow:hover{background:var(--hover)}
.brow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .track{height:14px;border-radius:0 5px 5px 0;background:transparent;position:relative}
.brow .fill{height:100%;background:var(--fill);border-radius:0 5px 5px 0;min-width:2px}
.brow .val{text-align:right;font-weight:700;white-space:nowrap;min-width:0}
.hint{color:var(--ink2);font-size:12px;margin-top:8px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,th.l{text-align:left}
td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td.l{text-align:left}
tr.person:hover td{background:var(--hover)}
tr.storehead td{background:var(--bg);font-weight:800;text-align:left;padding-top:12px;border-bottom:0}
tr.sub td{font-weight:800;border-bottom:2px solid var(--line)}
tr.grand td{font-weight:800;background:var(--fill-soft);border-bottom:0}
td.rank{width:34px;color:var(--ink2);font-weight:700;text-align:left}
.pname{font-weight:600}
a.pname{color:inherit;text-decoration:none}
a.pname:hover{color:var(--accent-text);text-decoration:underline}
a.pname::after{content:' \203A';color:var(--accent-text);font-weight:800}
tr.person[data-href]{cursor:pointer}
tr.famrow{cursor:pointer}tr.famrow:hover td{background:var(--hover)}tr.famrow[aria-selected="true"] td{background:var(--fill-soft)}
.famdetail{margin-top:14px}.famdetail h3{margin:0 0 8px;font-size:15px;font-weight:800}
.pill{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:#2A1018;vertical-align:1px}
:root[data-theme="dark"] .pill{color:#2A1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#2A1018}}
.cellbar{position:relative;min-width:150px}
.cellbar i{position:absolute;left:0;top:6px;bottom:6px;background:var(--fill-soft);border-radius:0 5px 5px 0;z-index:0}
.cellbar span{position:relative;z-index:1}
.share{color:var(--ink2)}
.sortcol{color:var(--accent-text)}
.empty{padding:28px;text-align:center;color:var(--ink2)}

body.clean .controls, body.clean .drop, body.clean header.top .actions .hideclean, body.clean .hint{display:none}
.exit{display:none;position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:5;opacity:.55}
body.clean .exit{display:block}
@media (max-width:620px){.brow{grid-template-columns:90px 1fr 92px}}
@media (prefers-reduced-motion:no-preference){.brow .fill{transition:width .3s ease}}
.pagefoot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line,#e9e2dc);display:grid;gap:4px;font-size:12px}.pagefoot .sub{margin:0}.pagefoot:not(:has(.sub:not(:empty))){display:none}
/* ---- report additions: change vs the period before, daily rhythm, standouts, money within reach, team map ---- */
:root{--bad:#B03A56;--fill2:#8E4B5C;--goodbg:#E3F3EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bad:#FF93A0;--fill2:#FFD0D6;--goodbg:#1D3A2C}}
:root[data-theme="dark"]{--bad:#FF93A0;--fill2:#FFD0D6;--goodbg:#1D3A2C}
.dl{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.dl.up{color:var(--good);background:var(--goodbg)}.dl.down{color:var(--bad);background:var(--fill-soft)}.dl.flat{color:var(--ink2);background:var(--bg)}
.kpi .d{margin-top:3px;min-height:18px;font-size:11px;color:var(--ink2)}
.brief{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:5px;font-size:14px}
.brief li{padding-left:16px;position:relative}.brief li::before{content:'';position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--fill)}
.brief b{font-weight:800}
.sectl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin:14px 0 6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.days{display:flex;align-items:flex-end;gap:2px;height:72px}
.days i{flex:1;min-width:2px;background:var(--fill);border-radius:3px 3px 0 0;opacity:.75}
.days i.best{background:var(--fill2);opacity:1}.days i.zero{background:var(--line);opacity:1}
.days i:hover{opacity:1}
.dayax{display:flex;justify-content:space-between;color:var(--ink2);font-size:11px;margin-top:4px}
.brow4{grid-template-columns:120px 1fr 110px 62px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.award{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg);text-decoration:none;color:inherit;min-width:0;border:1px solid transparent}
a.award:hover{border-color:var(--accent);background:var(--hover)}
.award .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--fill-soft);display:grid;place-items:center;color:var(--fill2)}
.award .ic svg{width:20px;height:20px}
.award .t{min-width:0}.award .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700}
.award .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award .vv{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oppgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.oppbig{background:var(--fill-soft);border-radius:16px;padding:16px;min-width:0}
.oppbig .k{font-size:12.5px;color:var(--ink2);font-weight:600}.oppbig .k b{color:var(--ink)}
.oppbig .big{font-size:34px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;line-height:1.15;margin-top:2px}
.oppbig .sub{color:var(--ink2);font-size:12.5px;min-height:18px}
.oppbig input[type=range]{width:100%;margin:12px 0 2px;accent-color:var(--fill2)}
.simax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:14px 0 8px;background:var(--bg)}
.split i{display:block;height:100%}.split .a{background:var(--fill)}.split .b{background:var(--fill2)}
.leg{display:grid;gap:4px;font-size:12.5px}
.leg span{display:flex;gap:8px;align-items:baseline}.leg em{flex:none;width:9px;height:9px;border-radius:3px;align-self:center}
.leg b{margin-left:auto;white-space:nowrap}
.how{display:grid;gap:10px}
.how div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;font-size:13px}
.how p{margin:0;color:var(--ink2)}
.play{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.play.add{background:var(--fill);color:#2A1018}.play.up{background:var(--fill2);color:var(--surface)}
.play.more{background:var(--bg);border-color:var(--line);color:var(--ink)}.play.lead{background:var(--goodbg);color:var(--good)}
.coach{display:grid;gap:2px;margin-top:6px}
.crow{display:grid;grid-template-columns:22px minmax(0,1.1fr) auto minmax(0,2fr) auto;gap:6px 12px;align-items:center;padding:9px 8px;border-radius:10px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}.crow:hover{background:var(--hover)}
.crow .no{color:var(--ink2);font-weight:700}.crow .who{min-width:0}.crow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .who small{color:var(--ink2);font-size:12px}.crow .why{color:var(--ink2);font-size:12.5px;min-width:0}
.crow .gain{font-weight:800;white-space:nowrap;text-align:right}
.more-btn{margin-top:10px}
.duo{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.mapwrap{position:relative}.mapwrap svg{display:block;width:100%;height:auto;overflow:visible}
.mapwrap text{font-family:var(--font);fill:var(--ink2);font-size:11px}
.mapwrap .qd{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:10px;opacity:.8}
.mapwrap .nm{fill:var(--ink);font-weight:700;font-size:11px;pointer-events:none}
.mapwrap circle{fill:var(--fill);fill-opacity:.5;stroke:var(--fill2);stroke-width:1.2;cursor:pointer}
.mapwrap a:hover circle,.mapwrap a:focus circle{fill-opacity:.95}
.wk{display:grid;gap:6px}
.wkrow{display:grid;grid-template-columns:38px 1fr 84px;gap:8px;align-items:center;font-size:13px}
.wkrow .t{height:12px;border-radius:0 5px 5px 0}.wkrow .t i{display:block;height:100%;background:var(--fill);border-radius:0 5px 5px 0;min-width:2px;opacity:.75}
.wkrow.best .t i{background:var(--fill2);opacity:1}.wkrow.best{font-weight:800}
.wkrow .val{text-align:right;white-space:nowrap}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;max-width:240px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip b{display:block;font-weight:800}
.stamp{display:none;text-align:center;color:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.04em}
body.clean .stamp{display:block}
body.clean .oppbig input[type=range],body.clean .simax,body.clean .more-btn{display:none}
td.foc{text-align:left}
@media (max-width:900px){.oppgrid,.duo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.crow{grid-template-columns:22px minmax(0,1fr) auto}.crow .why{grid-column:2/-1;order:5}.crow .gain{grid-column:2/-1;text-align:left;order:6}.oppbig .big{font-size:28px}.brow4{grid-template-columns:90px 1fr 92px 54px}}
@media print{body{background:#fff;padding:0}.controls,.drop,.actions,.exit,.hint,.more-btn,.oppbig input[type=range],.simax,#pandora-side,.pandora-side{display:none!important}.card{break-inside:avoid;border-color:#ddd}.stamp{display:block}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <h1>Staff Performance</h1>
    </div>
    <div class="actions">
      <button class="btn hideclean" id="xlsBtn" type="button">Download Excel</button>
      <button class="btn hideclean" id="cleanBtn" type="button">Screenshot view</button>
    </div>
  </header>
  <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" hidden><span id="dropStatus" hidden></span>
  <div class="err" id="err" hidden></div>

  <section class="controls" aria-label="Filters">
    <div class="row"><span class="lbl">Store</span><div class="chips" id="storeChips"></div></div>
    <div class="row" id="monthRow" hidden><span class="lbl">Month</span><div class="chips" id="monthChips"></div>
      <button class="chip" type="button" id="getOlder" hidden>Get earlier months from ERP</button><span class="dmsg" id="mMsg" role="status"></span></div>
    <div class="row" id="dateRow" hidden><span class="lbl">Dates</span>
      <label class="dlab">From <input type="date" id="dFrom"></label><label class="dlab">To <input type="date" id="dTo"></label>
      <div class="chips"><button class="chip" type="button" id="dLast7">Last 7 days</button><button class="chip" type="button" id="dAll">Latest month</button></div>
      <span class="dmsg" id="dMsg" role="status"></span></div>
    <div class="row"><span class="lbl">Rank by</span><div class="chips" id="metricChips"></div>
      <input class="search" id="q" type="search" placeholder="Search sales person or store" aria-label="Search sales person or store"></div>
    <details class="groups"><summary>Item groups counted <span id="gcount"></span></summary><div class="glist" id="glist"></div></details>
  </section>

  <button class="btn exit" id="exitClean" type="button">Exit screenshot view</button>
  <main id="out" style="display:flex;flex-direction:column;gap:16px;width:100%"></main>
  <footer class="pagefoot"><div class="sub" id="source"></div><div class="sub" id="roleNote"></div></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const VAT=1.14, KEY='storeStaffSummary.v1', EXKEY='storeStaffSummary.ex.v1';
const SAMPLE=null;
/* ---- who is signed in: the server tells the page the role. Managers only ever see the stores of their own zone. ---- */
const ROLE=window.__PANDORA_ROLE||{role:'admin',label:'Super admin',allow:null,zones:null};
const ALLOW=ROLE.allow?ROLE.allow.map(s=>new RegExp(s,'i')):null;
const storeOk=n=>!ALLOW||ALLOW.some(r=>r.test(n));
const hideTeam=n=>/^\s*sales\s*team\s*$/i.test(n);
function scopeData(d){
  if(!ALLOW&&!d.stores.some(hideTeam)) return d;
  const sMap=new Map(),stores=[]; d.stores.forEach((s,i)=>{if(storeOk(s)&&!hideTeam(s)){sMap.set(i,stores.length);stores.push(s)}});
  const pMap=new Map(),people=[]; d.people.forEach((p,i)=>{if(sMap.has(p[1])){pMap.set(i,people.length);people.push([p[0],sMap.get(p[1])])}});
  const rows=[]; for(const r of d.rows){const np=pMap.get(r[0]); if(np!==undefined){const c=r.slice();c[0]=np;rows.push(c)}}
  return {...d,stores,people,rows};
}

const METRICS=[
 {id:'incl',label:'Amount incl. VAT',f:p=>p.incl},
 {id:'amt',label:'Before VAT',f:p=>p.amt},
 {id:'inv',label:'Invoices',f:p=>p.inv},
 {id:'qty',label:'Quantity',f:p=>p.qty},
 {id:'upt',label:'UPT',f:p=>p.upt},
 {id:'atv',label:'ATV',f:p=>p.atv}];
const DEFAULT_EX=/packaging|services|jewellery boxes/i;
const st={span:false,data:null,store:'ALL',metric:'incl',q:'',ex:new Set(),from:'',to:'',fam:'',month:'',months:[],cur:null,close:50,allCoach:false,prev:null,prevLabel:''};
{const u=new URLSearchParams(location.search);st.from=/^\d{4}-\d{2}-\d{2}$/.test(u.get('from')||'')?u.get('from'):'';st.to=/^\d{4}-\d{2}-\d{2}$/.test(u.get('to')||'')?u.get('to'):'';st.month=/^\d{4}-\d{2}$/.test(u.get('month')||'')?u.get('month'):''}
const dateQs=()=>[st.month?'month='+st.month:'',st.from?'from='+encodeURIComponent(st.from):'',st.to?'to='+encodeURIComponent(st.to):''].filter(Boolean).join('&');
let SERVER=null; // true: the sales data lives on the server; false: this browser only (old way)
const $=id=>document.getElementById(id);
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* long numbers never wrap: they get a little smaller until they fit */
function fitNums(){
  document.querySelectorAll('.kpi .v,.big,.brow .val,.srow .val').forEach(el=>{
    el.style.fontSize='';
    let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    while(el.scrollWidth>el.clientWidth+1&&fs>9&&n++<40){fs-=0.5;el.style.fontSize=fs+'px'}
  });
}
addEventListener('resize',()=>{clearTimeout(fitNums.t);fitNums.t=setTimeout(fitNums,80)});
try{document.fonts&&document.fonts.ready.then(fitNums)}catch(_){}

const egp=v=>'EGP\u00a0'+nf0.format(v);
const fmt=(id,v)=>id==='upt'?nf2.format(v):MONEY.has(id)?egp(v):nf0.format(v);

function safeGet(k){for(const n of ['localStorage','sessionStorage']){try{const v=JSON.parse(window[n].getItem(k));if(v)return v}catch(e){}}return null}
function safeSet(k,v){const j=JSON.stringify(v);try{localStorage.setItem(k,j);try{sessionStorage.removeItem(k)}catch(e){}}catch(e){try{sessionStorage.setItem(k,j)}catch(e2){}}}

function setData(d){
  const full=d; d=scopeData(d);
  if(!d.rows.length){document.querySelector('.controls').hidden=true;$('out').innerHTML='<section class="card empty"><h2 style="margin:0 0 6px;color:var(--ink)">No sales for your zone in this file</h2>The file has no stores from '+esc(ROLE.zone||'your zone')+'. Load the Query Report that includes them.</section>';$('source').textContent=ROLE.label;return}
  st.data=d; st.full=full; document.querySelector('.controls').hidden=false;
  const saved=safeGet(EXKEY)||{ex:[],known:[]};
  st.ex=new Set();
  if(SERVER&&Array.isArray(d.ex)){ d.ex.forEach(g=>{if(d.groups.includes(g))st.ex.add(g)}); }
  else d.groups.forEach(g=>{
    const known=saved.known.includes(g);
    if(known?saved.ex.includes(g):DEFAULT_EX.test(g)) st.ex.add(g);
  });
  if(st.store!=='ALL' && !d.stores.includes(st.store)) st.store='ALL';
  buildControls(); syncDates(d); render(); loadPrev();
}
let exTimer=null;
function persistEx(){
  if(SERVER){ if(ROLE.role!=='admin')return; clearTimeout(exTimer); exTimer=setTimeout(()=>{fetch('/api/data?op=settings',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({ex:[...st.ex]})}).catch(()=>{})},600); return; }
  safeSet(EXKEY,{ex:[...st.ex],known:st.data.groups});
}

/* ---- the numbers: one pass over the rows gives every person, store and the total. Each also keeps the pieces per invoice
   (one-piece invoices), the invoices per category and the sales per day. Everything is worked out in the page from the rows the
   server already sent to this person, so nobody sees more here than the table itself shows. ---- */
const catOf=g=>{const s=String(g||''),i=s.lastIndexOf(' - ');return (i>=0?s.slice(i+3):s).trim()||'Other'};
function computeOn(d,exSet){
  const exIdx=new Set(); d.groups.forEach((g,i)=>{if(exSet.has(g))exIdx.add(i)});
  const mk=()=>({inv:new Map(),qty:0,amt:0,cat:new Map(),days:new Map()});
  const P=d.people.map(mk), S=d.stores.map(mk), G=mk(), cg=d.groups.map(catOf);
  const add=(o,r,c)=>{o.inv.set(r[2],(o.inv.get(r[2])||0)+r[3]);o.qty+=r[3];o.amt+=r[4];
    let k=o.cat.get(c);if(!k)o.cat.set(c,k=new Set());k.add(r[2]);
    if(r[5]!=null)o.days.set(r[5],(o.days.get(r[5])||0)+r[4])};
  for(const r of d.rows){ // [person, group, invoice, qty, amt, day, item]
    if(exIdx.has(r[1])) continue;
    const c=cg[r[1]]; add(P[r[0]],r,c); add(S[d.people[r[0]][1]],r,c); add(G,r,c);
  }
  const fin=o=>{const inv=o.inv.size;let one=0,pos=0;for(const q of o.inv.values()){if(q>0){pos++;if(q<=1)one++}}
    const incl=o.amt*VAT;return{inv,qty:o.qty,amt:o.amt,incl,upt:inv?o.qty/inv:0,atv:inv?incl/inv:0,aup:o.qty>0?incl/o.qty:0,one,pos,cat:o.cat,days:o.days}};
  const stores=d.stores.map((name,si)=>({name,tot:fin(S[si]),people:[]}));
  d.people.forEach((p,i)=>{const f=fin(P[i]); if(p[0]==='Returns & adjustments') return; /* counted in the store totals, never listed as a person */ if(f.inv>0||f.amt!==0) stores[p[1]].people.push({name:p[0],store:d.stores[p[1]],...f})});
  return{stores:stores.filter(s=>s.people.length),grand:fin(G)};
}
function compute(){
  const k=[...st.ex].sort().join('|');
  if(!st.cmp||st.cmp.d!==st.data||st.cmp.k!==k) st.cmp={d:st.data,k,v:computeOn(st.data,st.ex)};
  return st.cmp.v;
}

/* ---- the period before: the same days one month earlier (or the same number of days just before, when the dates cross months).
   Asked from the same /api/data, so the server applies the same limits (zone, own store). ---- */
const prevCache=new Map();
const iso=d=>d.toISOString().slice(0,10);
const dShort=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
function curRange(){const d=st.data;if(!d)return null;const a=d.from||d.dayMin,b=d.to||d.dayMax;return a&&b?{from:a,to:b,n:Math.round((Date.parse(b)-Date.parse(a))/864e5)+1}:null}
function prevRange(){
  const c=curRange(); if(!SERVER||!c) return null;
  const A=new Date(c.from+'T00:00:00Z'),B=new Date(c.to+'T00:00:00Z'); let pa,pb;
  if(c.from.slice(0,7)===c.to.slice(0,7)){
    const y=A.getUTCFullYear(),m=A.getUTCMonth()-1,last=new Date(Date.UTC(y,m+1,0)).getUTCDate(),lastCur=new Date(Date.UTC(y,m+2,0)).getUTCDate();
    pa=new Date(Date.UTC(y,m,Math.min(A.getUTCDate(),last)));
    pb=new Date(Date.UTC(y,m,(A.getUTCDate()===1&&B.getUTCDate()===lastCur)?last:Math.min(B.getUTCDate(),last)));
  } else { pb=new Date(A.getTime()-864e5); pa=new Date(pb.getTime()-(c.n-1)*864e5); }
  return {from:iso(pa),to:iso(pb)};
}
async function loadPrev(){
  const d=st.data, pr=prevRange(); st.prev=null; st.prevLabel=''; st.pc=null;
  if(!pr) return;
  const key=pr.from+'|'+pr.to; let j=prevCache.get(key);
  if(j===undefined){
    try{const r=await fetch('/api/data?from='+pr.from+'&to='+pr.to,{credentials:'same-origin',cache:'no-store'}); j=r.ok?scopeData(await r.json()):null}catch(_){j=null}
    if(j&&(!Array.isArray(j.rows)||!j.rows.length)) j=null;
    prevCache.set(key,j);
  }
  if(st.data!==d||!j) return;
  st.prev=j; st.prevLabel=pr.from===pr.to?dShort(pr.from):dShort(pr.from)+' – '+dShort(pr.to); render();
}
function prevNumbers(){
  if(!st.prev) return null;
  const k=[...st.ex].sort().join('|');
  if(!st.pc||st.pc.d!==st.prev||st.pc.k!==k){
    const v=computeOn(st.prev,st.ex), S=new Map(), P=new Map();
    v.stores.forEach(s=>{S.set(s.name,s.tot);s.people.forEach(p=>P.set(s.name+'|'+p.name,p))});
    st.pc={d:st.prev,k,v:{grand:v.grand,S,P}};
  }
  return st.pc.v;
}
const chg=(a,b)=>b>0&&isFinite(a)?(a-b)/b:null;
function dl(c){
  if(c===null||c===undefined) return '';
  const p=Math.round(c*100); if(Math.abs(p)>999) return '';
  return `<span class="dl ${p>0?'up':p<0?'down':'flat'}">${p>0?'+':p<0?'−':''}${Math.abs(p)}%</span>`;
}
const egpK=v=>{const a=Math.abs(v);return 'EGP '+(a>=1e6?(v/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e4?nf0.format(v/1e3)+'K':nf0.format(v))};
const pct=v=>nf0.format(v*100)+'%';

/* ---- money within reach: each person against the average of their OWN store (same customers, same mall).
   Add a piece = their invoices x the pieces they are short per invoice x their own price per piece.
   Trade up   = their pieces x how far their price per piece is under the store's. People already above the average add nothing. ---- */
const MIN_INV=5;
function coach(p,s){
  const T=s.tot, o={p,store:s.name,add:0,up:0,play:'lead',why:'',hint:''};
  if(p.inv>=MIN_INV&&p.qty>0&&T.inv>=MIN_INV*2&&s.people.length>1){
    o.add=Math.max(0,T.upt-p.upt)*p.inv*p.aup;
    o.up=Math.max(0,T.aup-p.aup)*p.qty;
    if(o.add<p.incl*.01) o.add=0; if(o.up<p.incl*.01) o.up=0;
  }
  o.total=o.add+o.up;
  const oneShare=p.pos?p.one/p.pos:0;
  if(o.total>0&&o.add>=o.up){o.play='add';o.why=`${nf2.format(p.upt)} pieces per invoice, the store does ${nf2.format(T.upt)}. ${pct(oneShare)} of invoices are one piece.`}
  else if(o.total>0){o.play='up';o.why=`Average piece ${egp(p.aup)}, the store sells at ${egp(T.aup)}.`}
  else{
    const med=[...s.people].map(x=>x.inv).sort((a,b)=>a-b)[Math.floor(s.people.length/2)]||0;
    if(p.inv<med*.7&&s.people.length>2){o.play='more';o.why=`Strong baskets, but ${nf0.format(p.inv)} invoices against ${nf0.format(med)} for a typical colleague.`}
    else o.why=`At or above the store on pieces per invoice and price per piece.`;
  }
  // the category this person offers least, compared with the store
  let best=null;
  if(p.inv>=MIN_INV) for(const [c,set] of T.cat){
    const sp=set.size/T.inv, pp=((p.cat.get(c)||{size:0}).size)/p.inv, gap=sp-pp;
    if(sp>=.1&&gap>=.06&&(!best||gap>best.gap)) best={c,gap,sp,pp};
  }
  if(best) o.hint=`${best.c}: in ${pct(best.pp)} of invoices, store ${pct(best.sp)}.`;
  return o;
}
const PLAY={add:'Add a piece',up:'Trade up',more:'More customers',lead:'Leading'};
const playChip=k=>`<span class="play ${k}">${PLAY[k]}</span>`;

function buildControls(){
  const d=st.data;
  $('storeChips').innerHTML=['ALL',...[...d.stores].sort()].map(s=>
    `<button class="chip" type="button" data-store="${esc(s)}" aria-pressed="${s===st.store}">${s==='ALL'?'All stores':esc(s)}</button>`).join('');
  $('metricChips').innerHTML=METRICS.map(m=>
    `<button class="chip" type="button" data-metric="${m.id}" aria-pressed="${m.id===st.metric}">${m.label}</button>`).join('');
  $('glist').innerHTML=[...d.groups].sort().map((g,i)=>
    `<label><input type="checkbox" data-g="${esc(g)}" ${st.ex.has(g)?'':'checked'}><span>${esc(g)}</span></label>`).join('');

function roleNote(){
  const el=$('roleNote'); if(!el||!st.data) return;
  if(ALLOW){el.textContent=`${ROLE.label} · ${st.data.stores.length} store${st.data.stores.length===1?'':'s'}: ${[...st.data.stores].sort().join(', ')}`;return}
  const all=(st.full||st.data).stores, zones=(ROLE.zones||[]).map(z=>{const rx=z.allow.map(x=>new RegExp(x,'i'));return{label:z.label,rx,n:all.filter(n=>rx.some(r=>r.test(n))).length}});
  const loose=all.filter(n=>!zones.some(z=>z.rx.some(r=>r.test(n))));
  el.textContent=`Super admin · `+zones.map(z=>`${z.label}: ${z.n} store${z.n===1?'':'s'}`).join(' · ')+(loose.length?` · Not in any zone (managers cannot see): ${loose.join(', ')}`:'');
}
function updGcount(){const n=st.ex.size;$('gcount').textContent=n?`(${n} left out)`:'(all counted)'}


/* ---- collections (Pandora families): "Pandora Moments - Charm" -> Moments. Follows the store chip, the dates and the item groups counted. ---- */
const famOf=g=>String(g||'').split(' - ')[0].replace(/^\s*Pandora\s+/i,'').trim()||'Other';
function collectionsHtml(){
  const d=st.data; if(!d||!d.rows.length) return '';
  const exIdx=new Set(); d.groups.forEach((g,i)=>{if(st.ex.has(g))exIdx.add(i)});
  const fg=d.groups.map(famOf), F=new Map(); let tot=0;
  for(const r of d.rows){ // [person, group, invoice, qty, amt]
    if(exIdx.has(r[1])) continue;
    const pi=r[0], si=d.people[pi][1];
    if(st.store!=='ALL'&&d.stores[si]!==st.store) continue;
    let f=F.get(fg[r[1]]); if(!f) F.set(fg[r[1]],f={name:fg[r[1]],amt:0,qty:0,inv:new Set(),p:new Map()});
    f.amt+=r[4]; f.qty+=r[3]; f.inv.add(r[2]); tot+=r[4];
    const o=f.p.get(pi)||{amt:0,qty:0}; o.amt+=r[4]; o.qty+=r[3]; f.p.set(pi,o);
  }
  const list=[...F.values()].filter(f=>f.amt!==0||f.qty!==0).sort((a,b)=>b.amt-a.amt);
  if(!list.length) return '';
  if(st.fam&&!F.has(st.fam)) st.fam='';
  const max=Math.max(...list.map(f=>f.amt),1), all=st.store==='ALL';
  const top=f=>{let b=null;for(const [pi,o] of f.p) if(!b||o.amt>b.o.amt) b={pi,o};return b?d.people[b.pi][0]+(all?' · '+d.stores[d.people[b.pi][1]]:''):'—'};
  const rows=list.map(f=>`<tr class="famrow" data-fam="${esc(f.name)}" aria-selected="${f.name===st.fam}"><td class="l"><b>${esc(f.name)}</b></td><td class="cellbar"><i style="width:${Math.max(2,f.amt/max*100)}%"></i><span class="num">${egp(f.amt*VAT)}</span></td><td class="num">${tot?nf0.format(f.amt/tot*100):0}%</td><td class="num">${nf0.format(f.qty)}</td><td class="num">${nf0.format(f.inv.size)}</td><td class="l">${esc(top(f))}</td></tr>`).join('');
  let detail='';
  if(st.fam){
    const f=F.get(st.fam), ppl=[...f.p.entries()].map(([pi,o])=>({pi,...o})).sort((a,b)=>b.amt-a.amt).slice(0,10);
    detail=`<div class="famdetail"><h3>Who sells the most ${esc(f.name)}</h3><div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Sales person</th><th class="l">Store</th><th>Qty</th><th>Incl. VAT</th><th>Share of ${esc(f.name)}</th></tr></thead><tbody>`+
      ppl.map((p,i)=>{const s=d.stores[d.people[p.pi][1]],n=d.people[p.pi][0];return `<tr class="person" data-href="${esc(pUrl(s,n))}"><td class="rank num">${i+1}</td><td class="l"><a class="pname" href="${esc(pUrl(s,n))}">${esc(n)}</a></td><td class="l">${esc(s)}</td><td class="num">${nf0.format(p.qty)}</td><td class="num">${egp(p.amt*VAT)}</td><td class="num">${f.amt?nf0.format(p.amt/f.amt*100):0}%</td></tr>`}).join('')+`</tbody></table></div></div>`;
  }
  return `<section class="card" id="collections"><div class="cardhead"><h2>Sales by collection</h2><span class="meta">${all?'All stores':esc(st.store)} · ${esc(st.data.period||'')} · select a collection to see who sells it most</span></div>
    <div class="tablewrap"><table><thead><tr><th class="l">Collection</th><th>Incl. VAT</th><th>Share</th><th>Qty</th><th>Invoices</th><th class="l">Top seller</th></tr></thead><tbody>${rows}</tbody></table></div>${detail}</section>`;
}

function kpis(t,label,pv,pace){
  const tile=(k,v,c,hero)=>`<div class="kpi${hero?' hero':''}"><div class="k">${k}</div><div class="v num">${v}</div>${pv?`<div class="d">${dl(c)}</div>`:''}</div>`;
  return `<div class="kpis">`+
   tile(label+' incl. VAT',egp(t.incl),pv&&chg(t.incl,pv.incl),true)+
   tile('Before VAT',egp(t.amt),pv&&chg(t.amt,pv.amt))+
   tile('Invoices',nf0.format(t.inv),pv&&chg(t.inv,pv.inv))+
   tile('Quantity',nf0.format(t.qty),pv&&chg(t.qty,pv.qty))+
   tile('UPT',nf2.format(t.upt),pv&&chg(t.upt,pv.upt))+
   tile('ATV',egp(t.atv),pv&&chg(t.atv,pv.atv))+
   (pace?`<div class="kpi"><div class="k">Month pace</div><div class="v num">${egp(pace)}</div>${pv?'<div class="d">incl. VAT at this rate</div>':''}</div>`:'')+`</div>`;
}
const pUrl=(store,name)=>'/staff/person?store='+encodeURIComponent(store)+'&name='+encodeURIComponent(name)+(dateQs()?'&'+dateQs():'');

function cells(p,m,max,extraShare){

  return mk('inv',nf0.format(p.inv))+mk('qty',nf0.format(p.qty))+mk('amt',egp(p.amt))+mk('incl',egp(p.incl))+mk('upt',nf2.format(p.upt))+mk('atv',egp(p.atv));

/* month pace: only when the dates start on the 1st of a month that is still running */
function monthPace(t){
  const c=curRange(); if(!c||c.from.slice(8)!=='01'||c.from.slice(0,7)!==c.to.slice(0,7)) return 0;
  const [y,m]=c.from.split('-').map(Number), dim=new Date(Date.UTC(y,m,0)).getUTCDate(), done=Number(c.to.slice(8));
  if(done>=dim||done<3||c.to.slice(0,7)!==new Date().toISOString().slice(0,7)) return 0;
  return t.incl/done*dim;
}
function briefHtml(t,pv,stores,all){
  const L=[];
  const c=pv?chg(t.incl,pv.incl):null;
  L.push(`Sales are <b>${egp(t.incl)}</b> incl. VAT from ${nf0.format(t.inv)} invoices`+(c!==null?`, <b>${c>=0?'up':'down'} ${nf0.format(Math.abs(c*100))}%</b> on ${esc(st.prevLabel)}.`:'.'));
  if(all&&stores.length>1){
    const top=[...stores].sort((a,b)=>b.tot.incl-a.tot.incl)[0]; let s=`<b>${esc(top.name)}</b> leads with ${pct(t.incl?top.tot.incl/t.incl:0)} of sales`;
    const P=prevNumbers(); if(P){const g=stores.map(x=>({n:x.name,c:chg(x.tot.incl,(P.S.get(x.name)||{}).incl)})).filter(x=>x.c!==null).sort((a,b)=>b.c-a.c);
      if(g.length>1&&g[0].c>0) s+=`; <b>${esc(g[0].n)}</b> grew fastest (+${nf0.format(g[0].c*100)}%)`;
      if(g.length>1&&g[g.length-1].c<0) s+=`; <b>${esc(g[g.length-1].n)}</b> is down ${nf0.format(Math.abs(g[g.length-1].c*100))}%`}
    L.push(s+'.');
  }
  if(t.pos) L.push(`<b>${pct(t.one/t.pos)}</b> of invoices leave with a single piece. Every second piece added is the fastest extra sale.`);
  return `<ul class="brief">${L.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayDate=n=>new Date(n*864e5);
const dayLbl=n=>WD[dayDate(n).getUTCDay()]+' '+dayDate(n).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
function daysHtml(t){
  if(t.days.size<3) return '';
  const ks=[...t.days.keys()], a=Math.min(...ks), b=Math.max(...ks); if(b-a>190) return '';
  let max=0,best=a; const v=[]; for(let n=a;n<=b;n++){const x=(t.days.get(n)||0)*VAT; v.push(x); if(x>max){max=x;best=n}}
  return `<div class="sectl"><span>Sales per day</span><span>Best day: ${dayLbl(best)} · ${egp(max)}</span></div>
    <div class="days">${v.map((x,i)=>`<i class="${a+i===best?'best':x<=0?'zero':''}" style="height:${max?Math.max(3,x/max*100):3}%" data-tip="${esc('<b>'+dayLbl(a+i)+'</b>'+egp(x))}"></i>`).join('')}</div>
    <div class="dayax"><span>${dayLbl(a)}</span><span>${dayLbl(b)}</span></div>`;
}
function weekHtml(t){
  const c=curRange(); if(!c||c.n<7||!t.days.size) return '';
  const sum=Array(7).fill(0), cnt=Array(7).fill(0), a=Math.round(Date.parse(c.from)/864e5);

      const icode=String(r['Item Code']||'').trim(), iname=String(r['Item Name']||r['Item']||'').trim();
      let ti=null; if(icode||iname){const tk=icode+'|'+iname; if(!tI.has(tk)){tI.set(tk,items.length);items.push([iname,icode])} ti=tI.get(tk)}
      out.push([pI.get(pk),idx(gI,groups,String(r['Item Group']||'').trim()),idx(iI,invs,r['Sales Invoice']),
        Number(r['Contribution Qty'])||0,Math.round((Number(r['Contribution Amount'])||0)*1000)/1000,day,ti]);
    }
    if(!out.length) throw new Error('No sales rows found in that file.');
    const d={file:file.name.replace(/\.[^.]+$/,'').slice(0,70),period:fmtPeriod(dmin,dmax),stores,people,groups,items,rows:out};
    if(SERVER){
      setData(d); d.ex=[...st.ex];
      $('dropStatus').textContent='Publishing…';
      const msg=await publish(d);
      $('dropStatus').textContent=msg;
    } else { safeSet(KEY,d); setData(d); $('dropStatus').textContent='Loaded '+nf0.format(out.length)+' rows'; }
  }catch(e){showErr(e.message||'Could not read that file.');$('dropStatus').textContent=''}
}

/* ---- publishing (super admin) ---- */
async function publish(d){
  try{
    const json=JSON.stringify(d); let body=json, headers={'Content-Type':'application/json'};
    if(typeof CompressionStream!=='undefined'){
      const gz=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      body=gz; headers={'Content-Type':'application/octet-stream'};
    }
    const r=await fetch('/api/data',{method:'POST',credentials:'same-origin',headers,body});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok) return 'Published: managers and sales people now see '+nf0.format(j.rows)+' rows';
    return 'Not published: '+(j.error||('error '+r.status));
  }catch(e){return 'Not published: no connection'}
}
function applyRoleUI(){
  if(SERVER&&ROLE.role!=='admin'){
        const g=document.querySelector('details.groups'); if(g) g.hidden=true;
  }
}

/* ---- events ---- */
$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};
document.addEventListener('click',e=>{
  const fr=e.target.closest('tr[data-fam]');
  if(fr&&!getSelection().toString()){st.fam=st.fam===fr.dataset.fam?'':fr.dataset.fam;render();return}
  if(e.target.closest('#coachAll')){st.allCoach=!st.allCoach;render();return}
  const row=e.target.closest('tr.person[data-href]');
  if(row&&!e.target.closest('a')&&!getSelection().toString()){location.href=row.dataset.href;return}
  const c=e.target.closest('[data-store]'),m=e.target.closest('[data-metric]'),p=e.target.closest('[data-pick]');
  if(c){st.store=c.dataset.store;render()}
  else if(m){st.metric=m.dataset.metric;render()}
  else if(p){st.store=p.dataset.pick;render();window.scrollTo({top:0,behavior:'smooth'})}
});
$('q').oninput=e=>{st.q=e.target.value;render()};
$('glist').onchange=e=>{const g=e.target.dataset.g;if(e.target.checked)st.ex.delete(g);else st.ex.add(g);persistEx();updGcount();render()};
$('xlsBtn').onclick=exportXlsx;
/* the slider only rewrites the amounts, so it keeps moving smoothly */
document.addEventListener('input',e=>{
  if(e.target.id!=='sim') return;
  st.close=Number(e.target.value)||50; const full=Number(e.target.dataset.full)||0, s=simText(full);
  $('simPct').textContent=st.close+'%'; $('simVal').textContent='+'+egp(s.v); $('simMonth').textContent=s.month;
  document.querySelectorAll('[data-sim]').forEach(el=>{el.textContent=(el.dataset.plus?'+':'')+egp(Number(el.dataset.sim)*st.close/100)});
});
/* small hover notes on the day bars and the team map */
(function(){
  let tip=null; const hide=()=>{if(tip){tip.remove();tip=null}};
  document.addEventListener('pointerover',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){hide();return}
    if(!tip){tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip)}
    tip.innerHTML=t.dataset.tip; const r=t.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';
    tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px';
  });
  addEventListener('scroll',hide,{passive:true});
})();
$('cleanBtn').onclick=()=>document.body.classList.add('clean');
$('exitClean').onclick=()=>document.body.classList.remove('clean');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('clean')});

function showEmpty(){
  document.querySelector('.controls').hidden=true;
  $('source').textContent='No query loaded yet';
  $('out').innerHTML=(SERVER&&ROLE.role!=='admin')
    ?'<section class="card empty"><h2 style="margin:0 0 6px;color:var(--ink)">No sales published yet</h2>The super admin has not published this month\u2019s sales file yet.</section>'
    :'<section class="card empty"><h2 style="margin:0 0 6px;color:var(--ink)">Load this month\u2019s query</h2>The super admin adds the Query Report on the <b>All Uploads</b> page. The store and sales person summary appears here once it is added.</section>';
}
/* ---- dates: everyone can change the dates of the performance they see (the server only sends rows inside the range) ---- */
function syncDates(d){
  const row=$('dateRow'); if(!row) return;
  if(!SERVER||!d.dayMin||!d.dayMax){row.hidden=true;return}
  row.hidden=false;
  st.dayMin=d.dayMin; st.dayMax=d.dayMax;
  let lo=d.dayMin, hi=d.dayMax;
  if(st.months.length>1){ // every saved month can be reached from the date boxes
    const old=st.months[st.months.length-1], nw=st.months[0].split('-').map(Number);
    lo=old+'-01'; hi=new Date(Date.UTC(nw[0],nw[1],0)).toISOString().slice(0,10);
  }
  $('dFrom').min=$('dTo').min=lo; $('dFrom').max=$('dTo').max=hi;
  $('dFrom').value=d.from||d.dayMin; $('dTo').value=d.to||d.dayMax;
  $('dMsg').textContent='';
}
async function applyDates(from,to){
  const msg=$('dMsg'); if(!st.dayMin) return;
  if(from&&to&&from>to){const x=from;from=to;to=x}
  const qs=[from?'from='+encodeURIComponent(from):'',to?'to='+encodeURIComponent(to):''].filter(Boolean).join('&');
  msg.textContent='Loading…';
  try{
    const r=await fetch('/api/data'+(qs?'?'+qs:''),{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    if(!r.ok){msg.textContent='Could not load those dates.';return}
    const j=await r.json();
    if(!scopeData(j).rows.length){msg.textContent='No sales between these dates. Pick other dates.';return}
    const fm=(from||st.dayMin||'').slice(0,7), tm=(to||st.dayMax||'').slice(0,7);
    st.span=!!(fm&&tm&&fm!==tm); st.month=(!st.span&&fm&&fm!==st.cur)?fm:'';
    st.from=from; st.to=to; setData(j); drawMonths();
    try{history.replaceState(null,'',location.pathname+(qs?'?'+qs:''))}catch(_){}
  }catch(e){msg.textContent='No connection.'}
}
$('dFrom').addEventListener('change',()=>{if($('dFrom').value&&$('dTo').value) applyDates($('dFrom').value,$('dTo').value)});
$('dTo').addEventListener('change',()=>{if($('dFrom').value&&$('dTo').value) applyDates($('dFrom').value,$('dTo').value)});
$('dAll').addEventListener('click',()=>openMonth(st.cur||st.month));
$('dLast7').addEventListener('click',()=>{
  if(!st.dayMax) return;
  const t=new Date(st.dayMax+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()-6);
  applyDates(t.toISOString().slice(0,10),st.dayMax);
});
/* ---- months: every month is saved on the server, so older months can be opened any time ---- */
const monthLabel=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'});
function drawMonths(){
  const row=$('monthRow'); if(!row) return;
  const admin=ROLE.role==='admin';
  $('getOlder').hidden=!admin;
  row.hidden=!(st.months.length>1||admin);
  const on=st.span?'':(st.month||st.cur);
  $('monthChips').innerHTML=st.months.map(k=>`<button class="chip" type="button" aria-pressed="${k===on}" data-m="${k}">${monthLabel(k)}</button>`).join('');
}
async function loadMonths(){
  try{const r=await fetch('/api/data?months=1',{credentials:'same-origin',cache:'no-store'});
    if(r.ok){const j=await r.json();st.months=j.months||[];st.cur=j.current||null}}catch(_){}
  if(st.month&&st.month===st.cur)st.month='';
  drawMonths();
  if(st.data) syncDates(st.data);
  if(ROLE.role==='admin'&&st.months.length<2&&!$('mMsg').textContent) $('mMsg').textContent='Only this month is saved so far. Press the button to get earlier months.';
}
async function openMonth(k,from,to){
  const msg=$('mMsg'); msg.textContent='Loading…';
  try{
    const m=(k===st.cur)?'':k;
    const qs=[m?'month='+m:'',from?'from='+from:'',to?'to='+to:''].filter(Boolean).join('&');
    const r=await fetch('/api/data'+(qs?'?'+qs:''),{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    if(!r.ok){msg.textContent=r.status===404?monthLabel(k)+' is not saved yet.':'Could not load '+monthLabel(k)+'.';return}
    const j=await r.json();
    if(!scopeData(j).rows.length){msg.textContent='No sales for '+monthLabel(k)+'.';return}
    st.span=false; st.month=m; st.from=from||''; st.to=to||''; setData(j); drawMonths(); msg.textContent='';
    try{history.replaceState(null,'',location.pathname+(qs?'?'+qs:''))}catch(_){}
  }catch(e){msg.textContent='No connection.'}
}
$('monthChips').addEventListener('click',e=>{const b=e.target.closest('[data-m]'); if(b) openMonth(b.dataset.m)});
$('getOlder').addEventListener('click',async()=>{
  const msg=$('mMsg'),btn=$('getOlder'); btn.disabled=true;
  const have=new Set(st.months), todo=[]; let [y,m]=(st.cur||new Date().toISOString().slice(0,7)).split('-').map(Number);
  for(let i=0;i<6;i++){m--; if(m<1){m=12;y--} const k=y+'-'+String(m).padStart(2,'0'); if(!have.has(k)) todo.push(k)}
  if(!todo.length){msg.textContent='The last 6 months are already saved.';btn.disabled=false;return}
  let got=0,stopped=false;
  for(let i=0;i<todo.length&&!stopped;i++){
    msg.textContent='Getting '+monthLabel(todo[i])+' from ERP ('+(i+1)+' of '+todo.length+'). Please keep this page open.';
    try{
      const r=await fetch('/api/erp?month='+todo[i],{method:'POST',credentials:'same-origin'}), j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok){msg.textContent='Stopped at '+monthLabel(todo[i])+': '+(j.error||'ERP did not answer.');stopped=true}
      else if(j.staff>0) got++;
    }catch(e){msg.textContent='No connection while getting '+monthLabel(todo[i])+'.';stopped=true}
  }
  await loadMonths();
  if(!stopped) msg.textContent=got?'Added '+got+' earlier month'+(got>1?'s':'')+'.':'ERP had no staff sales for those months.';
  btn.disabled=false;
});
async function boot(){
  applyRoleUI();
  try{
    const r=await fetch('/api/data'+(dateQs()?'?'+dateQs():''),{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    if(r.ok){SERVER=true; applyRoleUI(); setData(await r.json()); loadMonths(); return}
    if(r.status===404&&st.month){st.month=''; return boot()}
    if(r.status===404){SERVER=true; applyRoleUI(); showEmpty(); return}
  }catch(e){}
  SERVER=false; // server storage not set up: keep the old browser-only way
  const saved0=safeGet(KEY)||SAMPLE;
  if(saved0) setData(saved0); else showEmpty();
}
boot();
</script>
