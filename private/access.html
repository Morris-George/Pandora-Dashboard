<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Report access</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#FBF6F7;--surface:#FFFFFF;--ink:#2A1F24;--ink2:#6B5A61;--line:#EADCDF;--accent:#FF93A0;--accent-text:#2A1F24;--fill-soft:#FFE4E8;--hover:#FFF1F3;--good:#1F7A4D;--bad:#FF93A0;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;--bad:#FF93A0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;--bad:#FF93A0;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{word-spacing:.09em;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--ink2);font-size:12.5px}
.crumb{color:var(--ink2);font-size:12.5px;font-weight:600;text-decoration:none}.crumb:hover{color:var(--accent-text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.btn:hover{background:var(--hover)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#2A1018}:root[data-theme="dark"] .btn.go{color:#2A1018}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#2A1018}}
.btn.bad{color:var(--accent-text)}.btn:disabled{opacity:.5;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}.card .meta{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.row{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(110px,.9fr) minmax(200px,1.4fr) auto;gap:8px 14px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .who{font-weight:700;overflow-wrap:anywhere}.row .who small{display:block;color:var(--ink2);font-weight:500}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
select{width:100%;max-width:340px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font:inherit;color:var(--ink);background:var(--bg)}
.pwbox{border:2px solid var(--accent);background:var(--fill-soft)}.pwbox h2{font-size:16px}.pwline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pwline input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;color:var(--ink);background:var(--surface);min-width:220px}.big{font-size:22px;font-weight:800;letter-spacing:.04em;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.note{color:var(--ink2);font-size:12px;margin-top:4px}
.empty{color:var(--ink2);padding:8px 2px}.err{background:#FF93A0;color:#2A1018;border-radius:10px;padding:10px 14px;font-weight:600}
@media (max-width:640px){.row{grid-template-columns:1fr}.row .btns{justify-content:flex-start}}

.grp{display:flex;flex-direction:column;gap:6px}
.grp .top2{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between}
.item{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:11px 6px;border-top:1px solid var(--line)}
.item .nm{font-weight:700;overflow-wrap:anywhere}.item .nm small,.item .dt{display:block;color:var(--ink2);font-weight:500;font-size:12.5px}
.item .btns{display:flex;gap:6px;justify-content:flex-end}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:13px;margin:6px 0 4px}.drop.on{border-color:var(--accent);background:var(--fill-soft)}
.top .sub{max-width:560px}.st{font-size:12.5px;font-weight:600;margin-top:4px;min-height:18px}
@media (max-width:640px){.item{grid-template-columns:1fr}.item .btns{justify-content:flex-start}}

.pick{display:flex;flex-direction:column;gap:6px;margin-top:4px}.pick label{font-weight:700;font-size:13px}
.pick select{max-width:460px;height:44px;font-size:15px;font-weight:600}
.who2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:2px 0 4px}.who2 h2{margin:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--fill-soft);color:var(--accent-text)}
.chip.off{background:var(--line);color:var(--ink2)}.chip.wait{background:#FFF1D6;color:#8A5A00}
.rep{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:6px 14px;align-items:center;padding:11px 6px;border-top:1px solid var(--line)}
.rep:first-of-type{border-top:0}.rep b{overflow-wrap:anywhere}.rep .d{color:var(--ink2);font-size:12.5px}
.rep .nt{font-size:12px;font-weight:700;color:var(--accent-text);background:var(--fill-soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
.cnt{color:var(--ink2);font-size:12.5px;font-weight:600}
@media (max-width:640px){.rep{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><a class="crumb" href="/">&larr; Home</a><h1>Report access</h1><div class="sub">Pick a person to see which reports they are allowed to open. This is exactly what appears on their own home screen.</div></div><div class="actions"><a class="btn" href="/staff/accounts" style="text-decoration:none">Staff approvals</a></div></header>
  <div class="err" id="err" hidden></div>
  <section class="card">
    <div class="pick"><label for="who">Person</label><select id="who" disabled><option>Loading…</option></select></div>
    <div class="note">Only the super admin can open this page.</div>
  </section>
  <section class="card" id="out" hidden></section>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORDER=['Super admin','Brand manager and Overseer','Area managers','Store managers','Visual Merchandiser','Finance','Stock Count accounts','Sales people'];
let people=[];
function showErr(t){const e=$('err');e.hidden=!t;e.textContent=t||''}
function status(p){return p.status==='active'?'':p.status==='pending'?'<span class="chip wait">Waiting for approval</span>':'<span class="chip off">Switched off</span>'}
function draw(){
  const p=people.find(x=>x.key===$('who').value),box=$('out');
  if(!p){box.hidden=true;return}
  box.hidden=false;
  const note=p.status==='active'?'':p.status==='pending'?'Not approved yet, so they cannot sign in. This is what they would get once approved.':'This account is switched off. This is what they would get when it is switched on.';
  box.innerHTML=`<div class="who2"><h2>${esc(p.name)}</h2><span class="chip">${esc(p.label)}</span>${status(p)}</div>
    <div class="meta">${esc(p.scope)}</div>
    ${note?`<div class="note" style="margin:0 0 8px">${esc(note)}</div>`:''}
    <div class="cnt">${p.apps.length} report${p.apps.length===1?'':'s'} and page${p.apps.length===1?'':'s'}</div>
    ${p.apps.length?p.apps.map(a=>`<div class="rep"><b>${esc(a.title)}</b><span class="d">${esc(a.desc)}</span>${a.note?`<span class="nt">${esc(a.note)}</span>`:'<span></span>'}</div>`).join(''):'<div class="empty">Nothing yet. Open Staff approvals to give this person access.</div>'}`;
}
async function load(){
  try{
    const r=await fetch('/api/access',{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    const j=await r.json();
    if(!r.ok||!j.ok){showErr(j.error||'Could not load.');$('who').innerHTML='<option>Could not load</option>';return}
    showErr('');
    people=j.people;
    const groups=ORDER.concat([...new Set(people.map(p=>p.group))].filter(g=>!ORDER.includes(g)));
    let h='<option value="">Choose a person…</option>';
    for(const g of groups){
      const list=people.filter(p=>p.group===g).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
      if(!list.length)continue;
      h+=`<optgroup label="${esc(g)}">`+list.map(p=>`<option value="${esc(p.key)}">${esc(p.name)}${p.store&&g==='Sales people'||p.store&&g==='Store managers'?' · '+esc(p.store):''}${p.status==='active'?'':p.status==='pending'?' (waiting)':' (off)'}</option>`).join('')+'</optgroup>';
    }
    $('who').innerHTML=h;$('who').disabled=false;
    const keep=sessionStorage.getItem('accessWho');
    if(keep&&people.some(p=>p.key===keep)){$('who').value=keep;draw()}
  }catch(e){showErr('Could not load. Please refresh the page.')}
}
$('who').addEventListener('change',()=>{try{sessionStorage.setItem('accessWho',$('who').value)}catch(_){}draw()});
load();
</script>
</body>
</html>
