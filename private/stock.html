<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stock balance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#FBF6F7;--surface:#FFFFFF;--ink:#2A1F24;--ink2:#6B5A61;--line:#EADCDF;--accent:#FF93A0;--accent-text:#2A1F24;--fill-soft:#FFE4E8;--hover:#FFF1F3;--good:#1F7A4D;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{word-spacing:.09em;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--ink2);font-size:12.5px}
.crumb{color:var(--ink2);font-size:12.5px;font-weight:600;text-decoration:none}.crumb:hover{color:var(--accent-text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.btn:hover{background:var(--hover)}.btn:disabled{opacity:.5;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.cardhead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}.cardhead .meta{color:var(--ink2);font-size:12.5px}
.err{background:#FF93A0;color:#2A1018;border-radius:10px;padding:10px 14px;font-weight:600}
.empty{color:var(--ink2);padding:22px;text-align:center}
.controls{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;min-width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600;font-size:13px}.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#2A1018}
.dlab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.dlab input,.search{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit}
.dlab input:disabled{opacity:.55}
.search{min-width:200px;flex:1;max-width:300px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--ink2);padding:7px 13px;font:inherit;font-weight:650;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#2A1018}
.dmsg{color:var(--ink2);font-size:12.5px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:800}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--ink2);font-size:11.5px}
tr.cat{cursor:pointer}tr.cat:hover td{background:var(--hover)}tr.cat[aria-selected="true"] td{background:var(--fill-soft)}
tr.total td{font-weight:800;background:var(--fill-soft);border-bottom:0}
.cellbar{position:relative;min-width:150px}.cellbar i{position:absolute;left:0;top:6px;bottom:6px;background:var(--fill-soft);border-radius:0 5px 5px 0;z-index:0}.cellbar span{position:relative;z-index:1}
tr.cat[aria-selected="true"] .cellbar i{background:var(--accent);opacity:.45}
.neg{color:#c2334a;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;padding:5px 2px;font-size:13px}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .t{height:12px;background:var(--line);border-radius:0 6px 6px 0;position:relative}.bar .t i{display:block;height:100%;background:var(--accent);border-radius:0 6px 6px 0;min-width:2px}
.bar .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:800}
.pagefoot{color:var(--ink2);font-size:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><a class="crumb" href="/">&larr; Home</a><h1>Stock balance</h1><div class="sub" id="subtitle">How many pieces are in stock in each category.</div></div><div class="actions"></div></header>
  <div class="err" id="err" hidden></div>

  <section class="card controls" id="controls" aria-label="Filters" hidden>
    <div class="row"><span class="lbl">Dates</span>
      <label class="dlab">From <input type="date" id="dFrom"></label><label class="dlab">To <input type="date" id="dTo"></label>
      <div class="chips"><button class="chip" type="button" data-preset="today">Today</button><button class="chip" type="button" data-preset="month">This month</button><button class="chip" type="button" data-preset="30">Last 30 days</button><button class="chip" type="button" id="refresh" hidden>Sync</button></div>
      <span class="dmsg" id="dMsg" role="status"></span></div>
    <div class="row" id="brandRow"><span class="lbl">Brand</span><div class="chips" id="brandChips"></div></div>
    <div class="row"><span class="lbl">Store</span><div class="chips" id="locChips"></div></div>
    <div class="row"><span class="lbl" id="catLbl">Category</span><div class="chips" id="catChips"></div></div>
    <div class="row"><span class="lbl">Group by</span><div class="seg" id="grp" role="group" aria-label="Group by"><button type="button" data-g="cat" aria-pressed="true">Category</button><button type="button" data-g="fam" aria-pressed="false">Collection</button></div>
      <input class="search" id="q" type="search" placeholder="Search an item or SKU" aria-label="Search an item or SKU"></div>
  </section>

  <section class="kpis" id="kpis" hidden></section>

  <section class="card" id="catCard" hidden>
    <div class="cardhead"><h2 id="catTitle">Stock by category</h2><span class="meta" id="catMeta"></span></div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>

  <section class="card" id="detail" hidden></section>

  <section class="card" id="items" hidden>
    <div class="cardhead"><h2>Balance Qty by item</h2><span class="meta" id="itemsMeta"></span></div>
    <div class="tablewrap"><table><thead id="ithead"></thead><tbody id="itbody"></tbody></table></div>
    <div style="margin-top:12px;text-align:center"><button class="btn" type="button" id="itMore" hidden>Show more items</button></div>
  </section>
  <footer class="pagefoot" id="foot"></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const egp=v=>'EGP '+nf0.format(v);
const pcs=v=>nf0.format(v);
const lIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>{const p=String(s).split('-');return p.length===3?(+p[2])+' '+MON[+p[1]-1]+' '+p[0]:s};
const ISO=/^\d{4}-\d{2}-\d{2}$/;

/* row: [code, name, group, warehouse, opening, in, out, balance, value] */
const C=0,N=1,G=2,W=3,O=4,I=5,U=6,B=7,V=8;
const S={rows:[],meta:null,loc:'ALL',group:'cat',q:'',sel:'',from:'',to:'',itemsN:100,brand:'Pandora',cat:'ALL'};
{const u=new URLSearchParams(location.search),t=new Date();
 S.from=ISO.test(u.get('from')||'')?u.get('from'):lIso(new Date(t.getFullYear(),t.getMonth(),1));
 S.to=ISO.test(u.get('to')||'')?u.get('to'):lIso(t)}

/* category of a stock line: from the item group, then the item name (same rules as the dashboards) */
function catOfGroup(g){const low=String(g||'').toLowerCase();
  if(low.includes('maintenance')||low.includes('services'))return'Services';
  if(low.includes('jewellery box')||low.includes('utility'))return'Accessories';
  if(low.includes('earring'))return'Earrings';if(low.includes(' ring'))return'Rings';if(low.includes('bracelet'))return'Bracelets';if(low.includes('necklace'))return'Necklaces';
  if(['charm','clip','dangle','medallion','spacer'].some(x=>low.includes(x)))return'Charms';return'Other'}
function recat(c,name){const n=String(name||'').toLowerCase();if(c==='Necklaces')return'Necklace and Pendant';if(c&&c!=='Other')return c;
  if(/safety/.test(n))return'Charms';if(/bracelet|bangle/.test(n))return'Bracelets';if(/pendant|necklace|collier/.test(n))return'Necklace and Pendant';
  if(/charm|clip|dangle|spacer|medallion|murano/.test(n))return'Charms';if(/earring|stud|hoop|huggie/.test(n))return'Earrings';if(/\bring/.test(n))return'Rings';return'Other'}
const catOf=r=>recat(catOfGroup(r[G]),r[N]);
const famOf=g=>{const f=String(g||'').split(' - ')[0].replace(/^\s*Pandora\s+/i,'').trim();return f?(f.length>2&&f===f.toUpperCase()?f.charAt(0)+f.slice(1).toLowerCase():f):'Other'};
const keyOf=r=>S.group==='fam'?famOf(r[G]):catOf(r);

function showErr(t){const e=$('err');e.hidden=!t;e.textContent=t||''}

async function load(){
  showErr('');$('dMsg').textContent='Loading…';
  try{
    const r=await fetch('/api/stock?from='+encodeURIComponent(S.from)+'&to='+encodeURIComponent(S.to),{credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.replace('/login.html');return}
    const j=await r.json().catch(()=>({}));
    if(r.status===404){empty('No stock balance yet','The super admin adds the Stock Balance report (.xlsx) on the All Uploads page.');return}
    if(!r.ok||!j.ok){$('dMsg').textContent='';showErr(j.error||'Could not load the stock balance.');return}
    S.meta=j;S.rows=j.rows||[];
    if(j.source==='erp'){S.from=j.from;S.to=j.to}
    $('controls').hidden=false;syncDates();render();
  }catch(e){$('dMsg').textContent='';showErr('Could not load. Check your connection.')}
}
function empty(h,p){$('controls').hidden=true;$('kpis').hidden=true;$('detail').hidden=true;$('items').hidden=true;$('catCard').hidden=false;$('catTitle').textContent='Stock balance';$('catMeta').textContent='';$('thead').innerHTML='';$('tbody').innerHTML='<tr><td class="empty" colspan="8" style="text-align:center;white-space:normal"><b>'+esc(h)+'</b><br>'+esc(p)+'</td></tr>'}

function syncDates(){
  const m=S.meta,can=!!m.canChangeDates;
  $('dFrom').value=S.from;$('dTo').value=S.to;$('dFrom').disabled=$('dTo').disabled=!can;
  document.querySelectorAll('[data-preset]').forEach(b=>b.hidden=!can);
  $('refresh').hidden=!can;
  $('dMsg').textContent=can?'':'The dates are those of the uploaded Excel file.'+(m.note?' '+m.note:'');
  $('subtitle').textContent=can?'Closing balance on '+nice(S.to)+' · movement since '+nice(S.from):'From the Excel file “'+(m.file||'Stock balance')+'” · added '+nice(String(m.uploadedAt||m.asOf||'').slice(0,10));
  $('foot').textContent=can?('Read from ERP'+(m.fetchedAt?' at '+new Date(m.fetchedAt).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+'.'):'Pieces and values are as in the uploaded file.';
}

const isPandora=r=>/^\s*pandora\b/i.test(String(r[G]||''));
/* Pandora is the default brand; if the data has no Pandora groups at all, show everything instead of an empty page */
function brandNow(){return S.brand==='Pandora'&&S.rows.some(isPandora)?'Pandora':'ALL'}
function visibleRows(skipCat){
  const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean),bn=brandNow();
  return S.rows.filter(r=>(bn==='ALL'||isPandora(r))&&(S.loc==='ALL'||r[W]===S.loc)&&(skipCat||S.cat==='ALL'||keyOf(r)===S.cat)&&(!q.length||q.every(w=>(r[C]+' '+r[N]).toLowerCase().includes(w))));
}
function agg(rows){
  const m=new Map();
  for(const r of rows){const k=keyOf(r);let o=m.get(k);if(!o)m.set(k,o={name:k,o:0,i:0,u:0,b:0,v:0,items:new Set(),locs:new Set(),neg:0,rows:[]});
    o.o+=r[O];o.i+=r[I];o.u+=r[U];o.b+=r[B];o.v+=r[V];o.items.add(r[C]);o.locs.add(r[W]);if(r[B]<0)o.neg++;o.rows.push(r)}
  return [...m.values()].sort((a,b)=>b.b-a.b);
}

function render(){
  const m=S.meta;
  // location chips come from every row the person is allowed to see
  const locs=[...new Set(S.rows.map(r=>r[W]))].sort((a,b)=>a.localeCompare(b));
  if(S.loc!=='ALL'&&!locs.includes(S.loc))S.loc='ALL';
  $('locChips').innerHTML=['ALL',...locs].map(l=>`<button class="chip" type="button" data-loc="${esc(l)}" aria-pressed="${l===S.loc}">${l==='ALL'?'All stores':esc(l)}</button>`).join('');
  document.querySelectorAll('#grp button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===S.group));
  const hasBoth=S.rows.some(isPandora)&&S.rows.some(r=>!isPandora(r));
  $('brandRow').hidden=!hasBoth;
  $('brandChips').innerHTML=[['Pandora','Pandora'],['ALL','All brands']].map(b=>`<button class="chip" type="button" data-brand="${b[0]}" aria-pressed="${b[0]===brandNow()}">${b[1]}</button>`).join('');
  $('catLbl').textContent=S.group==='fam'?'Collection':'Category';
  const cats=[...new Set(visibleRows(true).map(keyOf))].sort((a,b)=>a.localeCompare(b));
  if(S.cat!=='ALL'&&!cats.includes(S.cat))S.cat='ALL';
  $('catChips').innerHTML=['ALL',...cats].map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${c==='ALL'?(S.group==='fam'?'All collections':'All categories'):esc(c)}</button>`).join('');

  $('items').hidden=true;
  const rows=visibleRows(),list=agg(rows);
  const hasMove=S.rows.some(r=>r[O]||r[I]||r[U]), showVal=false; /* value is not shown on this page */
  const T=list.reduce((t,x)=>({o:t.o+x.o,i:t.i+x.i,u:t.u+x.u,b:t.b+x.b,v:t.v+x.v}),{o:0,i:0,u:0,b:0,v:0});
  const items=new Set(rows.map(r=>r[C])),negN=rows.filter(r=>r[B]<0).length;

  const k=[['Pieces in stock',pcs(T.b),'closing balance']];
  if(showVal)k.push(['Stock value',egp(T.v),'at valuation']);
  if(hasMove){k.push(['Opening',pcs(T.o),'on '+nice(S.from)]);}
  k.push([S.group==='fam'?'Collections':'Categories',nf0.format(list.length),nf0.format(items.size)+' items']);
  if(negN)k.push(['Negative balances',nf0.format(negN),'lines to check']);
  $('kpis').hidden=false;$('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="k">${esc(x[0])}</div><div class="v">${esc(x[1])}</div><div class="s">${esc(x[2])}</div></div>`).join('');

  $('catCard').hidden=false;
  $('catTitle').textContent=S.group==='fam'?'Stock by collection':'Stock by category';
  $('catMeta').textContent=(S.loc==='ALL'?'All locations':S.loc)+' · select a row for the detail';
  const cols=[['l',S.group==='fam'?'Collection':'Category']];
  if(hasMove)cols.push(['','Opening']);
  cols.push(['','Closing'],['','Share']);
  if(showVal)cols.push(['','Value']);
  cols.push(['','Items'],['','Locations']);
  $('thead').innerHTML='<tr>'+cols.map(c=>`<th class="${c[0]}">${c[1]}</th>`).join('')+'</tr>';
  if(!S.rows.length){const d=m.diag;$('tbody').innerHTML=`<tr><td class="empty" colspan="${cols.length}" style="text-align:center;white-space:normal"><b>ERP returned no stock lines for ${esc(nice(S.from))} to ${esc(nice(S.to))}.</b><br>${d?`Company “${esc(d.company)}” · ${d.raw} rows came back, ${d.kept} kept.${d.keys.length?' Fields: '+esc(d.keys.join(', ')):''}`:'Try other dates, or add the Excel file on All Uploads.'}</td></tr>`;$('detail').hidden=true;return}
  if(!list.length){$('tbody').innerHTML=`<tr><td class="empty" colspan="${cols.length}" style="text-align:center">Nothing matches this search or location.</td></tr>`;$('detail').hidden=true;return}
  if(S.sel&&!list.some(x=>x.name===S.sel))S.sel='';
  const max=Math.max(...list.map(x=>Math.abs(x.b)),1);
  const cell=(x,id,v)=>`<td>${v}</td>`;
  $('tbody').innerHTML=list.map(x=>`<tr class="cat" data-key="${esc(x.name)}" aria-selected="${x.name===S.sel}"><td class="l"><b>${esc(x.name)}</b>${x.neg?`<small class="neg">${x.neg} negative</small>`:''}</td>`+
    (hasMove?`<td>${pcs(x.o)}</td>`:'')+
    `<td class="cellbar"><i style="width:${Math.max(1,Math.abs(x.b)/max*100)}%"></i><span><b>${pcs(x.b)}</b></span></td><td>${T.b?nf0.format(x.b/T.b*100):0}%</td>`+
    (showVal?`<td>${egp(x.v)}</td>`:'')+`<td>${nf0.format(x.items.size)}</td><td>${nf0.format(x.locs.size)}</td></tr>`).join('')+
    `<tr class="total"><td class="l">Total</td>`+(hasMove?`<td>${pcs(T.o)}</td>`:'')+`<td>${pcs(T.b)}</td><td>100%</td>`+(showVal?`<td>${egp(T.v)}</td>`:'')+`<td>${nf0.format(items.size)}</td><td>${nf0.format(new Set(rows.map(r=>r[W])).size)}</td></tr>`;
  detail(list,showVal);
  itemsTable(rows);
}

/* Balance Qty for every item: one column per branch (when All locations is chosen) and the total */
const shortWh=w=>String(w||'').replace(/\s+-\s+[A-Z]{1,4}$/,'');
function itemsTable(rows){
  const card=$('items');
  const scope=S.sel?rows.filter(r=>keyOf(r)===S.sel):rows;
  if(!scope.length){card.hidden=true;return}
  const locs=S.loc==='ALL'?[...new Set(scope.map(r=>r[W]))].sort((a,b)=>a.localeCompare(b)):[];
  const m=new Map();
  for(const r of scope){let o=m.get(r[C]);if(!o)m.set(r[C],o={code:r[C],name:r[N],cat:catOf(r),b:0,w:new Map()});o.b+=r[B];o.w.set(r[W],(o.w.get(r[W])||0)+r[B])}
  const all=[...m.values()].sort((a,b)=>b.b-a.b||String(a.code).localeCompare(String(b.code)));
  const shown=all.slice(0,S.itemsN);
  const q=v=>`<td${v<0?' class="neg"':''}>${pcs(v)}</td>`;
  card.hidden=false;
  $('itemsMeta').textContent=(S.sel?S.sel+' · ':'')+(S.loc==='ALL'?'All locations':S.loc)+' · '+nf0.format(all.length)+' item'+(all.length===1?'':'s');
  $('ithead').innerHTML='<tr><th class="l">Item</th><th class="l">Category</th>'+locs.map(l=>`<th title="${esc(l)}">${esc(shortWh(l))}</th>`).join('')+'<th>Balance Qty</th></tr>';
  $('itbody').innerHTML=shown.map(i=>`<tr><td class="l">${esc(i.name||i.code)}<small>${esc(i.code)}</small></td><td class="l">${esc(i.cat)}</td>`+locs.map(l=>q(i.w.get(l)||0)).join('')+`<td${i.b<0?' class="neg"':''}><b>${pcs(i.b)}</b></td></tr>`).join('')
    +`<tr class="total"><td class="l">Total</td><td class="l"></td>`+locs.map(l=>`<td>${pcs(all.reduce((t,i)=>t+(i.w.get(l)||0),0))}</td>`).join('')+`<td>${pcs(all.reduce((t,i)=>t+i.b,0))}</td></tr>`;
  $('itMore').hidden=all.length<=S.itemsN;
  $('itMore').textContent='Show more items ('+nf0.format(all.length-S.itemsN)+' left)';
}

function detail(list,showVal){
  const el=$('detail'),x=list.find(y=>y.name===S.sel);
  if(!x){el.hidden=true;return}
  el.hidden=false;
  const byLoc=new Map();x.rows.forEach(r=>byLoc.set(r[W],(byLoc.get(r[W])||0)+r[B]));
  const locs=[...byLoc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,14),lmax=Math.max(...locs.map(l=>Math.abs(l[1])),1);
  const byItem=new Map();
  x.rows.forEach(r=>{let o=byItem.get(r[C]);if(!o)byItem.set(r[C],o={code:r[C],name:r[N],b:0,v:0,l:new Set()});o.b+=r[B];o.v+=r[V];if(r[B]!==0)o.l.add(r[W])});
  const its=[...byItem.values()].sort((a,b)=>b.b-a.b),top=its.slice(0,10),neg=its.filter(i=>i.b<0).slice(-5).reverse();
  const itemRow=i=>`<tr><td class="l">${esc(i.name||i.code)}<small>${esc(i.code)}</small></td><td>${pcs(i.b)}</td>${showVal?`<td>${egp(i.v)}</td>`:''}<td>${nf0.format(i.l.size)}</td></tr>`;
  const head=`<tr><th class="l">Item</th><th>Pieces</th>${showVal?'<th>Value</th>':''}<th>Locations</th></tr>`;
  el.innerHTML=`<div class="cardhead"><h2>${esc(x.name)}</h2><span class="meta">${pcs(x.b)} pieces in ${nf0.format(byLoc.size)} location${byLoc.size===1?'':'s'}${showVal?' · '+egp(x.v):''}</span></div>
   <div class="two"><div><h3>By location</h3>${locs.map(l=>`<div class="bar"><span class="n" title="${esc(l[0])}">${esc(l[0])}</span><span class="t"><i style="width:${Math.max(1,Math.abs(l[1])/lmax*100)}%"></i></span><span class="v${l[1]<0?' neg':''}">${pcs(l[1])}</span></div>`).join('')}</div>
   <div><h3>Most stock by item</h3><div class="tablewrap"><table style="min-width:0"><thead>${head}</thead><tbody>${top.map(itemRow).join('')}</tbody></table></div>
   ${neg.length?`<h3 style="margin-top:14px">Negative balances to check</h3><div class="tablewrap"><table style="min-width:0"><thead>${head}</thead><tbody>${neg.map(itemRow).join('')}</tbody></table></div>`:''}</div></div>`;
}

document.addEventListener('click',e=>{
  const r=e.target.closest('tr.cat'),l=e.target.closest('[data-loc]'),g=e.target.closest('#grp [data-g]'),p=e.target.closest('[data-preset]');
  if(r){S.sel=S.sel===r.dataset.key?'':r.dataset.key;S.itemsN=100;render();if(S.sel)$('detail').scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(l){S.loc=l.dataset.loc;S.itemsN=100;render()}
  else if(e.target.closest('[data-brand]')){S.brand=e.target.closest('[data-brand]').dataset.brand;S.cat='ALL';S.sel='';S.itemsN=100;render()}
  else if(e.target.closest('[data-cat]')){S.cat=e.target.closest('[data-cat]').dataset.cat;S.sel='';S.itemsN=100;render()}
  else if(g){S.group=g.dataset.g;S.sel='';S.cat='ALL';S.itemsN=100;render()}
  else if(e.target.closest('#itMore')){S.itemsN+=200;render()}
  else if(p){const t=new Date();let f=new Date(t);
    if(p.dataset.preset==='month')f=new Date(t.getFullYear(),t.getMonth(),1);else if(p.dataset.preset==='30')f.setDate(f.getDate()-29);
    setDates(lIso(f),lIso(t))}
});
$('refresh').addEventListener('click',async()=>{const b=$('refresh');b.disabled=true;$('dMsg').textContent='Syncing from ERP… this can take up to a minute.';
  try{const r=await fetch('/api/stock?fresh=1&from='+encodeURIComponent(S.from)+'&to='+encodeURIComponent(S.to),{credentials:'same-origin',cache:'no-store'});const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)showErr(j.error||'Could not refresh.');else{S.meta=j;S.rows=j.rows||[];syncDates();render();$('dMsg').textContent='Synced at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'.'}}catch(_){showErr('No connection.')}
  b.disabled=false});
$('q').addEventListener('input',e=>{S.q=e.target.value;S.itemsN=100;render()});
let dt=null;
function setDates(f,t){if(!ISO.test(f)||!ISO.test(t))return;if(f>t){const x=f;f=t;t=x}S.from=f;S.to=t;
  try{history.replaceState(null,'','?from='+f+'&to='+t)}catch(_){}
  clearTimeout(dt);dt=setTimeout(load,250)}
$('dFrom').addEventListener('change',()=>setDates($('dFrom').value,$('dTo').value));
$('dTo').addEventListener('change',()=>setDates($('dFrom').value,$('dTo').value));
load();
</script>
</body>
</html>
