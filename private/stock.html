<style>
:root{--bg:#FBF6F7;--surface:#FFFFFF;--ink:#2A1F24;--ink2:#6B5A61;--line:#EADCDF;--accent:#FF93A0;--accent-text:#2A1F24;--fill-soft:#FFE4E8;--hover:#FFF1F3;--good:#1F7A4D;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}

:root[data-theme="dark"]{--bg:#171013;--surface:#241A1E;--ink:#F6EBEE;--ink2:#B9A5AC;--line:#3A2A30;--accent:#FF93A0;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--good:#5CC48E;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{word-spacing:.09em;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}

.actions{display:flex;gap:8px;flex-wrap:wrap}

th.l,td.l{text-align:left}

tr.cat[aria-selected="true"] .cellbar i{background:var(--accent);opacity:.45}

.bar .t{height:12px;background:var(--line);border-radius:0 6px 6px 0;position:relative}.bar .t i{display:block;height:100%;background:var(--accent);border-radius:0 6px 6px 0;min-width:2px}

.irow{cursor:pointer}.irow:hover td{background:var(--hover)}
.smodal{position:fixed;inset:0;z-index:61;background:rgba(20,12,14,.45);display:grid;place-items:center;padding:20px}.smodal[hidden]{display:none}

@media(max-width:640px){.smodal .pthumb.big{width:100%;height:auto;max-width:200px}}
.pthumb.big{width:150px;height:150px;border-radius:18px;font-size:34px;flex:none}
.hit{display:flex;gap:20px;align-items:flex-start;padding:6px 0 18px;border-top:1px solid var(--line);margin-top:6px}.hit:first-of-type{border-top:0}
.hbody{flex:1;min-width:0}.hname{font-size:20px;font-weight:800;letter-spacing:-.02em;word-break:break-word}
.hmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--ink2);font-size:12.5px;margin:4px 0 10px}.hchip{background:var(--fill-soft);color:var(--accent-text);border-radius:999px;padding:3px 10px;font-weight:700}
.htotal{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.htotal b{font-size:38px;font-weight:800;letter-spacing:-.03em}.htotal span{color:var(--ink2);font-size:13px}
.hlocs{display:grid;gap:7px;max-width:560px}.hloc{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:13px}.hloc .hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-weight:600}.hloc b{text-align:right}
.htrack{height:10px;border-radius:10px;background:var(--fill-soft);overflow:hidden}.htrack i{display:block;height:100%;border-radius:10px;background:var(--accent)}.htrack i.neg{background:#C0394B}
.hzero,.hnone{color:var(--ink2);font-size:12px;margin-top:10px}
@media(max-width:640px){.hit{flex-direction:column}.pthumb.big{width:100%;height:auto;aspect-ratio:1/1;max-width:260px}.hloc{grid-template-columns:96px 1fr 40px}}
.pthumb:hover,.pthumb:focus-visible{transform:scale(1.08);border-color:var(--accent);outline:none}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pmodal{position:fixed;inset:0;z-index:60;background:rgba(20,12,14,.45);display:grid;place-items:center;padding:20px}.pmodal[hidden]{display:none}
.pmodal .pcard{background:var(--surface);color:var(--text);border-radius:18px;padding:14px 14px 16px;width:min(340px,100%);box-shadow:0 18px 50px rgba(0,0,0,.28);animation:ppop .16s ease-out}
.pmodal .pbig{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center}
.pmodal .pbig img{width:100%;height:100%;object-fit:contain;display:block}
.pmodal .pname{margin:12px 2px 2px;font-weight:700;font-size:13px;line-height:1.35}.pmodal .pinfo{margin:0 2px;color:var(--muted);font-size:11.5px}
.pmodal .pclose{float:right;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;margin:-4px -2px 4px 8px}
</style>

<body>
<div class="wrap">
  <header class="top"><div><a class="crumb" href="/">&larr; Home</a><h1>Stock balance</h1><div class="sub" id="subtitle">How many pieces are in stock in each category.</div></div><div class="actions"></div></header>
  <div class="err" id="err" hidden></div>

  <section class="card controls" id="controls" aria-label="Filters" hidden>
    <div class="row"><span class="lbl">Dates</span>
      <label class="dlab">From <input type="date" id="dFrom"></label><label class="dlab">To <input type="date" id="dTo"></label>
      <div class="chips"><button class="chip" type="button" data-preset="today">Today</button><button class="chip" type="button" data-preset="month">This month</button><button class="chip" type="button" data-preset="30">Last 30 days</button><button class="chip" type="button" id="refresh" hidden>Sync</button></div>
      <span class="dmsg" id="dMsg" role="status"></span></div>
    <div class="row" id="brandRow"><span class="lbl">Brand</span><div class="chips" id="brandChips"></div></div>
    <div class="row"><span class="lbl">Store</span><div class="chips" id="locChips"></div></div>
    <div class="row"><span class="lbl" id="catLbl">Category</span><div class="chips" id="catChips"></div></div>
    <div class="row"><span class="lbl">Group by</span><div class="seg" id="grp" role="group" aria-label="Group by"><button type="button" data-g="cat" aria-pressed="true">Category</button><button type="button" data-g="fam" aria-pressed="false">Collection</button></div>
      <input class="search" id="q" type="search" placeholder="Search SKU, item or description" aria-label="Search SKU, item or description"></div>
  </section>

  <section class="kpis" id="kpis" hidden></section>

  <section class="card" id="catCard" hidden>
    <div class="cardhead"><h2 id="catTitle">Stock by category</h2><span class="meta" id="catMeta"></span></div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>

  <section class="card" id="hit" hidden></section>

  <section class="card" id="detail" hidden></section>

  <section class="card" id="items" hidden>
    <div class="cardhead"><h2>Balance Qty by item</h2><span class="meta" id="itemsMeta"></span></div>
    <div class="tablewrap"><table><thead id="ithead"></thead><tbody id="itbody"></tbody></table></div>
    <div style="margin-top:12px;text-align:center"><button class="btn" type="button" id="itMore" hidden>Show more items</button></div>
  </section>
  <div class="smodal" id="sModal" hidden><div class="scard" role="dialog" aria-modal="true" aria-label="Quantity in each store"><button type="button" class="pclose" id="sClose" aria-label="Close">&times;</button><div id="sBody"></div></div></div>
  <div class="pmodal" id="pModal" hidden><div class="pcard" role="dialog" aria-modal="true" aria-label="Product picture"><button type="button" class="pclose" id="pClose" aria-label="Close">&times;</button><div class="pbig" id="pBig"></div><div class="pname" id="pName"></div><div class="pinfo" id="pInfo"></div></div></div>
<footer class="pagefoot" id="foot"></footer>
</div>
<script>
/* Product thumbnails beside product rows: built-in pictures first (super admin), then the pandoraeg.com site; click a thumbnail to enlarge it. */
window.PPic=(function(){
  const KEY='pandora-pics-v1',D=(window.__PICS=window.__PICS||{});
  let cache={};try{cache=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const key=s=>String(s||'').trim().toUpperCase(),base=s=>key(s).split('-')[0];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const https=u=>u?String(u).replace(/^http:/,'https:'):u;
  const tried=new Map(); let loadedPack=false, queue=[], busy=0;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(cache))}catch(e){}}
  function builtin(sku){const v=D[base(sku)];return v?'data:image/jpeg;base64,'+v:''}
  function loadPack(){ /* the 4 picture files only open for the super admin; for anyone else they are simply refused */
    if(loadedPack)return;loadedPack=true;let left=4;
    for(let i=1;i<=4;i++){const sc=document.createElement('script');sc.src='/stockcount-pics-'+i+'.js';sc.async=true;sc.onload=sc.onerror=()=>{if(--left===0)fill(document)};document.head.appendChild(sc)}
  }
  async function lookup(sku){
    const b=base(sku);if(!b||b==='—')return '';
    if(cache[key(sku)])return cache[key(sku)];if(cache[b])return cache[b];
    try{
      const r=await fetch('/api/pic?sku='+encodeURIComponent(b),{credentials:'same-origin'}); /* the server asks pandoraeg.com: the browser is not allowed to */
      const j=await r.json();const u=j&&j.url;
      if(u){cache[b]=u;save();return u}
    }catch(e){}
    return '';
  }
  function pump(){
    while(busy<3&&queue.length){const job=queue.shift();busy++;lookup(job.sku).then(job.done).finally(()=>{busy--;pump()})}
  }
  function get(sku){
    const bi=builtin(sku);if(bi)return Promise.resolve(bi);
    const b=base(sku);if(cache[key(sku)])return Promise.resolve(cache[key(sku)]);if(cache[b])return Promise.resolve(cache[b]);
    if(!tried.has(b))tried.set(b,new Promise(res=>{queue.push({sku,done:res});pump()}));
    return tried.get(b);
  }
  function show(btn,u){if(!u||btn.querySelector('img'))return;const im=new Image();im.alt='';im.referrerPolicy='no-referrer';im.onload=()=>{btn.textContent='';btn.appendChild(im)};im.src=https(u)}
  /* Preloading: the full-size picture is found, downloaded and decoded in the background (for thumbnails on screen, or as soon as one is touched), so opening it shows the sharp picture at once. */
  const R=new Map(),L=new Map(),F=new Map();
  function loadBig(sku){
    const b=base(sku);if(!b||b==='—')return Promise.resolve('');
    if(R.has(b))return Promise.resolve(R.get(b).src);if(L.has(b))return L.get(b);
    if(F.has(b)&&Date.now()-F.get(b)<60000)return Promise.resolve('');
    const p=lookup(sku).then(u=>u?new Promise(res=>{const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{const d=()=>{R.set(b,{src:im.src,u});res(im.src)};im.decode?im.decode().then(d,d):d()};im.onerror=()=>res('');im.src=big(u)}):'');
    L.set(b,p);p.then(s=>{L.delete(b);if(!s)F.set(b,Date.now())});return p;
  }
  let wio=null;const wq=[];let wbusy=0;
  function wpump(){while(wbusy<3&&wq.length){const s=wq.shift();wbusy++;loadBig(s).finally(()=>{wbusy--;wpump()})}}
  function watch(root){
    if(!('IntersectionObserver' in window))return;
    if(!wio)wio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;wio.unobserve(e.target);wq.push(e.target.dataset.sku);wpump()}),{rootMargin:'200px'});
    (root||document).querySelectorAll('.pthumb:not([data-w])').forEach(b=>{b.dataset.w='1';wio.observe(b)});
  }
  ['pointerover','pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target&&e.target.closest&&e.target.closest('.pthumb');if(t)loadBig(t.dataset.sku)},{capture:true,passive:true}));
  let io=null;
  function fill(root){
    loadPack();watch(root);
    const btns=(root||document).querySelectorAll('.pthumb:not(:has(img))');
    btns.forEach(b=>{
      const bi=builtin(b.dataset.sku);if(bi){show(b,bi);return}
      if(!('IntersectionObserver' in window)){get(b.dataset.sku).then(u=>show(b,u));return}
      if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);get(e.target.dataset.sku).then(u=>show(e.target,u))}),{rootMargin:'120px'});
      io.observe(b);
    });
  }
  function thumb(p,info){return `<button type="button" class="pthumb" data-sku="${esc(p.sku)}" data-name="${esc(p.name)}" data-info="${esc(info||'')}" title="Click to enlarge" aria-label="Enlarge picture of ${esc(p.name)}">◇</button>`}
  const modal=()=>document.getElementById('pModal');
  function big(u){try{const x=new URL(https(u),location.href);if(/shopify|pandoraeg/i.test(x.hostname)){x.searchParams.set('width','900');x.searchParams.delete('height')}return x.href}catch(e){return https(u)}}
  async function open(btn){
    const m=modal(),box=document.getElementById('pBig');
    document.getElementById('pName').textContent=btn.dataset.name||'';
    document.getElementById('pInfo').textContent=[btn.dataset.sku,btn.dataset.info].filter(Boolean).join(' · ');
    const mine=btn.querySelector('img'),token=btn;open.t=token;
    const sharp=(src)=>{const im=new Image();im.alt=btn.dataset.name||'';im.referrerPolicy='no-referrer';im.src=src;return im};
    const hit=R.get(base(btn.dataset.sku));
    box.textContent='';
    /* already preloaded: show the sharp picture immediately */
    if(hit){box.appendChild(sharp(hit.src));m.hidden=false;show(btn,hit.u);return}
    /* not ready yet: never show the small blurry picture first; wait for the sharp one (small one only as a fallback after 1.5 s or if there is no sharp one) */
    box.textContent='Loading picture…';m.hidden=false;
    const fb=setTimeout(()=>{if(open.t===token&&mine&&!box.querySelector('img')){box.textContent='';const im=new Image();im.alt=btn.dataset.name||'';im.src=mine.src;box.appendChild(im)}},1500);
    const s=await loadBig(btn.dataset.sku);clearTimeout(fb);if(open.t!==token)return;
    if(!s){if(box.querySelector('img'))return;if(mine){box.textContent='';const im=new Image();im.alt=btn.dataset.name||'';im.src=mine.src;box.appendChild(im)}else box.textContent='No picture for this item';return}
    box.textContent='';box.appendChild(sharp(s));const r=R.get(base(btn.dataset.sku));if(r)show(btn,r.u);
  }
  function close(){open.t=null;modal().hidden=true}
  document.addEventListener('click',e=>{const b=e.target.closest('.pthumb');if(b){e.preventDefault();open(b);return}if(e.target.id==='pModal'||e.target.id==='pClose')close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal().hidden)close()});
  return {thumb,fill};
})();
</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const egp=v=>'EGP '+nf0.format(v);
const pcs=v=>nf0.format(v);
const lIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>{const p=String(s).split('-');return p.length===3?(+p[2])+' '+MON[+p[1]-1]+' '+p[0]:s};
const ISO=/^\d{4}-\d{2}-\d{2}$/;

/* row: [code, name, group, warehouse, opening, in, out, balance, value, description] */
const C=0,N=1,G=2,W=3,O=4,I=5,U=6,B=7,V=8,D=9;
const S={rows:[],meta:null,loc:'ALL',group:'cat',q:'',sel:'',from:'',to:'',itemsN:100,brand:'Pandora',cat:'ALL'};
{const u=new URLSearchParams(location.search),t=new Date();
 S.from=ISO.test(u.get('from')||'')?u.get('from'):lIso(new Date(t.getFullYear(),t.getMonth(),1));
 S.to=ISO.test(u.get('to')||'')?u.get('to'):lIso(t)}

/* category of a stock line: from the item group, then the item name (same rules as the dashboards) */
function catOfGroup(g){const low=String(g||'').toLowerCase();
  if(low.includes('maintenance')||low.includes('services'))return'Services';
  if(low.includes('jewellery box')||low.includes('utility'))return'Accessories';
  if(low.includes('earring'))return'Earrings';if(low.includes(' ring'))return'Rings';if(low.includes('bracelet'))return'Bracelets';if(low.includes('necklace'))return'Necklaces';
  if(['charm','clip','dangle','medallion','spacer'].some(x=>low.includes(x)))return'Charms';return'Other'}
function recat(c,name){const n=String(name||'').toLowerCase();if(c==='Necklaces')return'Necklace and Pendant';if(c&&c!=='Other')return c;
  if(/safety/.test(n))return'Charms';if(/bracelet|bangle/.test(n))return'Bracelets';if(/pendant|necklace|collier/.test(n))return'Necklace and Pendant';
  if(/charm|clip|dangle|spacer|medallion|murano/.test(n))return'Charms';if(/earring|stud|hoop|huggie/.test(n))return'Earrings';if(/\bring/.test(n))return'Rings';return'Other'}
const catOf=r=>recat(catOfGroup(r[G]),r[N]);
const famOf=g=>{const f=String(g||'').split(' - ')[0].replace(/^\s*Pandora\s+/i,'').trim();return f?(f.length>2&&f===f.toUpperCase()?f.charAt(0)+f.slice(1).toLowerCase():f):'Other'};
const keyOf=r=>S.group==='fam'?famOf(r[G]):catOf(r);

/* some items have a barcode-like number as their code and the real design code (793905C01-5700…) as their name: the website knows the design code */
const picSku=i=>/^\d{8,}$/.test(String(i.code||''))&&/^[A-Za-z0-9]{4,}(-|$)/.test(String(i.name||''))?i.name:i.code;
function showErr(t){const e=$('err');e.hidden=!t;e.textContent=t||''}

let loadId=0;
async function getStock(q,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch('/api/stock?'+q+'from='+encodeURIComponent(S.from)+'&to='+encodeURIComponent(S.to),{credentials:'same-origin',cache:'no-store',signal:c.signal});
    return {r,j:await r.json().catch(()=>({}))}}finally{clearTimeout(t)}}
function apply(j){S.meta=j;S.rows=j.rows||[];if(j.source==='erp'){S.from=j.from;S.to=j.to}$('controls').hidden=false;syncDates();render()}
async function load(){
  const id=++loadId;showErr('');$('dMsg').textContent='Loading…';
  let shown=false;
  /* 1) instant: the last saved copy for these dates, so the page opens straight away */
  try{const {r,j}=await getStock('cached=1&',15000);
    if(id!==loadId)return;
    if(r.status===401){location.replace('/login.html');return}
    if(r.ok&&j.ok&&!j.miss&&j.rows&&j.rows.length){apply(j);shown=true;$('dMsg').textContent='Updating from ERP…'}}catch(_){}
  /* 2) the live read (up to 2 tries: the first one can be slow when ERP is waking up) */
  for(let n=0;n<2;n++){
    try{const {r,j}=await getStock('',58000);
      if(id!==loadId)return;
      if(r.status===401){location.replace('/login.html');return}
      if(r.status===404){if(!shown)empty('No stock balance yet','The super admin adds the Stock Balance report (.xlsx) on the All Uploads page.');return}
      if(r.ok&&j.ok){apply(j);return}
      if(n===1){if(!shown){$('dMsg').textContent='';showErr(j.error||'Could not load the stock balance.')}else $('dMsg').textContent='Showing the last saved copy; ERP did not answer.';return}
    }catch(e){if(id!==loadId)return;if(n===1){if(!shown){$('dMsg').textContent='';showErr('Could not load. Check your connection and refresh.')}else $('dMsg').textContent='Showing the last saved copy; ERP did not answer.';return}}
  }
}
function empty(h,p){$('controls').hidden=true;$('kpis').hidden=true;$('detail').hidden=true;$('items').hidden=true;$('catCard').hidden=false;$('catTitle').textContent='Stock balance';$('catMeta').textContent='';$('thead').innerHTML='';$('tbody').innerHTML='<tr><td class="empty" colspan="8" style="text-align:center;white-space:normal"><b>'+esc(h)+'</b><br>'+esc(p)+'</td></tr>'}

function syncDates(){
  const m=S.meta,can=!!m.canChangeDates;
  $('dFrom').value=S.from;$('dTo').value=S.to;$('dFrom').disabled=$('dTo').disabled=!can;
  document.querySelectorAll('[data-preset]').forEach(b=>b.hidden=!can);

  $('foot').textContent=(m.namesNote?'Names: '+m.namesNote+'. ':'')+(can?('Read from ERP'+(m.fetchedAt?' at '+new Date(m.fetchedAt).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+'.'):'Pieces and values are as in the uploaded file.');

const isPandora=r=>/^\s*pandora\b/i.test(String(r[G]||''));
/* Pandora is the default brand; if the data has no Pandora groups at all, show everything instead of an empty page */
function brandNow(){return S.brand==='Pandora'&&S.rows.some(isPandora)?'Pandora':'ALL'}
/* smart search: ignores case, accents, punctuation, plurals and word order; forgives small typos; a few everyday synonyms */
const SYN={band:'ring',bangle:'bracelet',studs:'earring',stud:'earring',hoop:'earring',hoops:'earring',pendant:'necklace',collier:'necklace',gold:'rose',golden:'rose',sterling:'silver'};
const stem=w=>{w=w.replace(/(ies)$/,'y').replace(/(es)$/,w.length>4?'':'es').replace(/s$/,w.length>3?'':'s');return SYN[w]||w};
const toks=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').split(' ').filter(Boolean);
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){let c=[i],m=i;for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<m)m=v}if(m>max)return max+1;p=c}return p[b.length]}
function wordHit(w,words){/* 0 = no match, higher = better */
  let best=0;const ws=stem(w),mx=ws.length>=7?2:ws.length>=4?1:0;
  for(const x of words){if(x===w||x===ws)return 4;if(x.startsWith(ws)||x.startsWith(w))best=Math.max(best,3);else if(ws.length>=3&&x.includes(ws))best=Math.max(best,2);
    else if(mx&&best<1&&lev(ws,x.slice(0,ws.length+1),mx)<=mx)best=1}
  return best}
function rowWords(r){return r._w||(r._w=[...new Set(toks(r[C]+' '+r[N]+' '+(r[D]||'')+' '+r[G]).flatMap(x=>[x,stem(x)]))])}
function searchScore(r,q){let sc=0,hit=0;const words=rowWords(r);for(const w of q){const h=wordHit(w,words);if(h){hit++;sc+=h}}return{hit,sc}}
function visibleRows(skipCat){
  const q=toks(S.q),bn=brandNow();
  if(!skipCat)S.exact=false;
  const base=S.rows.filter(r=>(bn==='ALL'||isPandora(r))&&(S.loc==='ALL'||r[W]===S.loc)&&(skipCat||S.cat==='ALL'||keyOf(r)===S.cat));
  if(!q.length)return base;
  /* a full code typed in (item code, barcode or design code) shows only that item, not everything that looks similar */
  const nk=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,''),qk=nk(S.q);
  if(qk.length>=5){const ex=base.filter(r=>nk(r[C])===qk||nk(r[N])===qk||nk(String(r[N]).split('-')[0])===qk||nk(String(r[C]).split('-')[0])===qk);
    if(ex.length){if(!skipCat)S.exact=true;return ex}}
  const sc=base.map(r=>[r,searchScore(r,q)]);
  let out=sc.filter(x=>x[1].hit===q.length);
  if(!out.length&&q.length>1){const need=Math.ceil(q.length/2);out=sc.filter(x=>x[1].hit>=need)}/* nothing has every word: show the closest matches */
  return out.sort((a,b)=>b[1].sc-a[1].sc).map(x=>x[0]);
}
function agg(rows){
  const m=new Map();
  for(const r of rows){const k=keyOf(r);let o=m.get(k);if(!o)m.set(k,o={name:k,o:0,i:0,u:0,b:0,v:0,items:new Set(),locs:new Set(),neg:0,rows:[]});
    o.o+=r[O];o.i+=r[I];o.u+=r[U];o.b+=r[B];o.v+=r[V];o.items.add(r[C]);o.locs.add(r[W]);if(r[B]<0)o.neg++;o.rows.push(r)}
  return [...m.values()].sort((a,b)=>b.b-a.b);
}

  $('locChips').innerHTML=['ALL',...locs].map(l=>`<button class="chip" type="button" data-loc="${esc(l)}" aria-pressed="${l===S.loc}">${l==='ALL'?'All stores':esc(l)}</button>`).join('');

  $('items').hidden=true;

  $('hit').hidden=true;
  const hasMove=S.rows.some(r=>r[O]||r[I]||r[U]), showVal=false; /* value is not shown on this page */
  const T=list.reduce((t,x)=>({o:t.o+x.o,i:t.i+x.i,u:t.u+x.u,b:t.b+x.b,v:t.v+x.v}),{o:0,i:0,u:0,b:0,v:0});

  $('kpis').hidden=false;$('kpis').innerHTML=k.map(x=>`<div class="kpi"><div class="k">${esc(x[0])}</div><div class="v">${esc(x[1])}</div><div class="s">${esc(x[2])}</div></div>`).join('');

  const cols=[['l',S.group==='fam'?'Collection':'Category']];

  cols.push(['','Closing'],['','Share']);

  if(!S.rows.length){const d=m.diag;$('tbody').innerHTML=`<tr><td class="empty" colspan="${cols.length}" style="text-align:center;white-space:normal"><b>ERP returned no stock lines for ${esc(nice(S.from))} to ${esc(nice(S.to))}.</b><br>${d?`Company “${esc(d.company)}” · ${d.raw} rows came back, ${d.kept} kept.${d.keys.length?' Fields: '+esc(d.keys.join(', ')):''}`:'Try other dates, or add the Excel file on All Uploads.'}</td></tr>`;$('detail').hidden=true;return}
  if(!list.length){$('tbody').innerHTML=`<tr><td class="empty" colspan="${cols.length}" style="text-align:center">Nothing matches this search or location.</td></tr>`;$('detail').hidden=true;return}
  if(S.sel&&!list.some(x=>x.name===S.sel))S.sel='';
  const max=Math.max(...list.map(x=>Math.abs(x.b)),1);
  const cell=(x,id,v)=>`<td>${v}</td>`;
  $('tbody').innerHTML=list.map(x=>`<tr class="cat" data-key="${esc(x.name)}" aria-selected="${x.name===S.sel}"><td class="l"><b>${esc(x.name)}</b>${x.neg?`<small class="neg">${x.neg} negative</small>`:''}</td>`+
    (hasMove?`<td>${pcs(x.o)}</td>`:'')+
    `<td class="cellbar"><i style="width:${Math.max(1,Math.abs(x.b)/max*100)}%"></i><span><b>${pcs(x.b)}</b></span></td><td>${T.b?nf0.format(x.b/T.b*100):0}%</td>`+
    (showVal?`<td>${egp(x.v)}</td>`:'')+`<td>${nf0.format(x.items.size)}</td><td>${nf0.format(x.locs.size)}</td></tr>`).join('')+
    `<tr class="total"><td class="l">Total</td>`+(hasMove?`<td>${pcs(T.o)}</td>`:'')+`<td>${pcs(T.b)}</td><td>100%</td>`+(showVal?`<td>${egp(T.v)}</td>`:'')+`<td>${nf0.format(items.size)}</td><td>${nf0.format(new Set(rows.map(r=>r[W])).size)}</td></tr>`;
  detail(list,showVal);

}


function itemBlock(i){
    const allLocs=[...new Set(S.rows.filter(r=>brandNow()==='ALL'||isPandora(r)).map(r=>r[W]))].sort((a,b)=>a.localeCompare(b));
    const have=allLocs.map(l=>[l,i.w.get(l)||0]).filter(x=>x[1]!==0).sort((a,b)=>b[1]-a[1]),none=allLocs.filter(l=>!i.w.get(l));

/* exact search result: the item as a card with a big picture, its total and every store's quantity */
function hitCard(rows){
  const m=new Map();
  for(const r of rows){let o=m.get(r[C]);if(!o)m.set(r[C],o={code:r[C],name:r[N],desc:r[D]||'',cat:catOf(r),b:0,w:new Map()});if(!o.desc&&r[D])o.desc=r[D];o.b+=r[B];o.w.set(r[W],(o.w.get(r[W])||0)+r[B])}
  const items=[...m.values()].sort((a,b)=>b.b-a.b);
  const allLocs=[...new Set(S.rows.filter(r=>brandNow()==='ALL'||isPandora(r)).map(r=>r[W]))].sort((a,b)=>a.localeCompare(b));
  const card=$('hit');card.hidden=false;
  card.innerHTML=`<div class="cardhead"><h2>Exact match</h2><span class="meta">${items.length>1?nf0.format(items.length)+' items share this code · ':''}<button type="button" class="btn" id="hitClear">Clear search</button></span></div>`+items.slice(0,8).map(itemBlock).join('')+(items.length>8?`<div class="hzero">…and ${items.length-8} more with the same code.</div>`:'');
  PPic.fill(card);
}
/* Balance Qty for every item: one column per branch (when All locations is chosen) and the total */
const shortWh=w=>String(w||'').replace(/\s+-\s+[A-Z]{1,4}$/,'');

   <div class="two"><div><h3>By location</h3>${locs.map(l=>`<div class="bar"><span class="n" title="${esc(l[0])}">${esc(l[0])}</span><span class="t"><i style="width:${Math.max(1,Math.abs(l[1])/lmax*100)}%"></i></span><span class="v${l[1]<0?' neg':''}">${pcs(l[1])}</span></div>`).join('')}</div>

   ${neg.length?`<h3 style="margin-top:14px">Negative balances to check</h3><div class="tablewrap"><table style="min-width:0"><thead>${head}</thead><tbody>${neg.map(itemRow).join('')}</tbody></table></div>`:''}</div></div>`;
  PPic.fill(el);
}

document.addEventListener('click',e=>{
  const r=e.target.closest('tr.cat'),l=e.target.closest('[data-loc]'),g=e.target.closest('#grp [data-g]'),p=e.target.closest('[data-preset]');
  if(r){S.sel=S.sel===r.dataset.key?'':r.dataset.key;S.itemsN=100;render();if(S.sel)$('detail').scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(l){S.loc=l.dataset.loc;S.itemsN=100;render()}
  else if(e.target.closest('[data-brand]')){S.brand=e.target.closest('[data-brand]').dataset.brand;S.cat='ALL';S.sel='';S.itemsN=100;render()}
  else if(e.target.closest('[data-cat]')){S.cat=e.target.closest('[data-cat]').dataset.cat;S.sel='';S.itemsN=100;render()}
  else if(g){S.group=g.dataset.g;S.sel='';S.cat='ALL';S.itemsN=100;render()}
  else if(e.target.closest('#itMore')){S.itemsN+=200;render()}
  else if(p){const t=new Date();let f=new Date(t);
    if(p.dataset.preset==='month')f=new Date(t.getFullYear(),t.getMonth(),1);else if(p.dataset.preset==='30')f.setDate(f.getDate()-29);
    setDates(lIso(f),lIso(t))}
});
$('refresh').addEventListener('click',async()=>{const b=$('refresh');b.disabled=true;$('dMsg').textContent='Syncing from ERP… this can take up to a minute.';
  try{const r=await fetch('/api/stock?fresh=1&from='+encodeURIComponent(S.from)+'&to='+encodeURIComponent(S.to),{credentials:'same-origin',cache:'no-store'});const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)showErr(j.error||'Could not refresh.');else{S.meta=j;S.rows=j.rows||[];syncDates();render();$('dMsg').textContent='Synced at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'.'}}catch(_){showErr('No connection.')}
  b.disabled=false});
document.addEventListener('click',e=>{
  if(e.target.id==='sClose'||e.target.id==='sModal'){$('sModal').hidden=true;return}
  if(e.target.closest('.pthumb'))return;
  const tr=e.target.closest('tr.irow');if(!tr)return;
  const code=tr.dataset.code,rows=S.rows.filter(r=>r[C]===code&&(brandNow()==='ALL'||isPandora(r)));if(!rows.length)return;
  const o={code,name:rows[0][N],desc:'',cat:catOf(rows[0]),b:0,w:new Map()};
  for(const r of rows){if(!o.desc&&r[D])o.desc=r[D];o.b+=r[B];o.w.set(r[W],(o.w.get(r[W])||0)+r[B])}
  $('sBody').innerHTML=itemBlock(o);PPic.fill($('sBody'));$('sModal').hidden=false;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sModal').hidden=true});
document.addEventListener('click',e=>{if(e.target.id==='hitClear'){S.q='';$('q').value='';S.itemsN=100;render();$('q').focus()}});
$('q').addEventListener('input',e=>{S.q=e.target.value;S.itemsN=100;render()});
let dt=null;
function setDates(f,t){if(!ISO.test(f)||!ISO.test(t))return;if(f>t){const x=f;f=t;t=x}S.from=f;S.to=t;
  try{history.replaceState(null,'','?from='+f+'&to='+t)}catch(_){}
  clearTimeout(dt);dt=setTimeout(load,250)}
$('dFrom').addEventListener('change',()=>setDates($('dFrom').value,$('dTo').value));
$('dTo').addEventListener('change',()=>setDates($('dFrom').value,$('dTo').value));
load();
</script>
</body>
