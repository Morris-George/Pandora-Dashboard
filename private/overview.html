<!doctype html>
<html lang="en">
<head><link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Store Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#FBF6F7;--surface:#FFFFFF;--surface2:#FAF3F5;--ink:#2A1F24;--ink2:#6B5A61;--muted:#9A878E;--line:#EADCDF;--accent:#FF93A0;--accent-text:#B83A52;--fill-soft:#FFE4E8;--hover:#FFF1F3;--up:#1F7A4D;--up-bg:#E3F4EA;--down:#B83A52;--down-bg:#FFE4E8;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171013;--surface:#241A1E;--surface2:#2B2024;--ink:#F6EBEE;--ink2:#B9A5AC;--muted:#8E7B82;--line:#3A2A30;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--up:#5CC48E;--up-bg:#1B3A2B;--down:#FF93A0;--down-bg:#3A2229}}
:root[data-theme="dark"]{--bg:#171013;--surface:#241A1E;--surface2:#2B2024;--ink:#F6EBEE;--ink2:#B9A5AC;--muted:#8E7B82;--line:#3A2A30;--accent-text:#FF93A0;--fill-soft:#3A2229;--hover:#2D2025;--up:#5CC48E;--up-bg:#1B3A2B;--down:#FF93A0;--down-bg:#3A2229}
*{box-sizing:border-box}[hidden]{display:none!important}
body{word-spacing:.06em;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
h1{margin:4px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--ink2);font-size:13px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;font-size:13px}.btn:hover{background:var(--hover)}.btn:disabled{opacity:.5;cursor:wait}
section h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.02em}
section .range{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.card.main{background:linear-gradient(160deg,var(--fill-soft),var(--surface) 70%)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden}
.val small{font-size:.5em;font-weight:700;color:var(--ink2);margin-right:.35em;letter-spacing:0}
.note{font-size:12px;color:var(--ink2);min-height:18px}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:11.5px;font-weight:700}
.chip.up{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}
#out section+section{margin-top:26px}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:700px){.stores{grid-template-columns:1fr}}
.st h3{margin:0 0 4px;font-size:16px;font-weight:800}
.st table{width:100%;border-collapse:collapse;font-size:12.5px}
.st th{padding-left:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700;text-align:right;padding:2px 0}
.st th:first-child,.st td:first-child{text-align:left}
.st td{text-align:right;padding:4px 0 4px 10px;border-top:1px solid var(--line);font-weight:700;white-space:nowrap}
.st td:first-child{color:var(--ink2);font-weight:600}
.mt{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.mt table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.mt th{padding:10px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700;text-align:right;background:var(--surface2);position:sticky;top:0}
.mt td{padding:8px 12px;text-align:right;border-top:1px solid var(--line);font-weight:600}
.mt th:first-child,.mt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700;z-index:1}
.mt th:first-child{background:var(--surface2)}
.mt tr.tot td{background:var(--fill-soft);font-weight:800}.mt tr.tot td:first-child{background:var(--fill-soft)}
.mt td.sum,.mt th.sum{font-weight:800;border-left:1px solid var(--line)}
.mt td.zero{color:var(--muted);font-weight:500}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:700;font-size:12.5px;padding:6px 16px;cursor:pointer}
.tg button.on{background:var(--accent);color:#2A1F24}
.mc{display:flex;gap:8px;align-items:center}
.pw{position:relative}
.fb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}.fb:hover{background:var(--hover)}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(42,31,36,.18);display:flex;flex-direction:column;gap:6px}
.pop .pt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin-bottom:2px}
.pop label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.pop input{accent-color:#FF93A0;width:15px;height:15px}
.pa{display:flex;gap:6px;margin-top:4px}.pa button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:4px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.foot{color:var(--muted);font-size:12px}
.err{background:var(--down-bg);color:var(--down);border-radius:12px;padding:12px 14px;font-weight:600}
.loading{padding:60px 0;text-align:center;color:var(--ink2)}
.loader{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--fill-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loader{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Store Overview</h1>
      <div class="sub" id="sub">Simple numbers for all stores, net of VAT.</div>
    </div>
    <div class="actions"><button class="btn" id="refresh" type="button">Refresh</button></div>
  </header>
  <div id="out"><div class="loading"><div class="loader"></div>Loading the numbers…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  var out=document.getElementById('out'),sub=document.getElementById('sub'),foot=document.getElementById('foot'),btn=document.getElementById('refresh');
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function n(v){return Math.round(v||0).toLocaleString('en-US')}
  function egp(v){return '<small>EGP</small>'+n(v)}
  function dmy(iso){var p=iso.split('-');return +p[2]+' '+MON[+p[1]-1].slice(0,3)+' '+p[0]}
  function chip(p,txt){if(p==null)return '';var up=p>=0;return '<span class="chip '+(up?'up':'down')+'">'+(up?'+':'')+p.toFixed(1)+'% '+esc(txt)+'</span>'}
  function card(label,val,note,main){return '<div class="card'+(main?' main':'')+'"><div class="lbl">'+esc(label)+'</div><div class="val">'+val+'</div><div class="note">'+(note||'')+'</div></div>'}
  function block(title,p,vsTxt){

    var v=p.vs;
    var top=p.top?esc(p.top.name):'-';
    var html='<section><h2>'+esc(title)+'</h2><div class="range">'+dmy(p.from)+' to '+dmy(p.to)+' &middot; '+p.stores+' stores selling</div><div class="grid">'
      +card('Total sales',egp(p.sales),v?chip(v.sales,vsTxt):'',true)
      +card('Average sales per store',egp(p.avgPerStore),v?chip(v.avgPerStore,vsTxt):'',true)
      +card('Average ticket (ATV)',egp(p.atv),v?chip(v.atv,vsTxt):'',true)
      +card('Orders',n(p.orders),'Invoices with sales')
      +card('Units per ticket (UPT)',(p.upt||0).toFixed(1),v?chip(v.upt,vsTxt):'Pieces in each order')
      +card('Average price per piece',egp(p.asp),'Sales divided by pieces')
      +card('Average per store per day',egp(p.avgPerStorePerDay),'Average store, one day')
      +(p.months?card('Average month (total, all stores)',egp(p.avgMonth),MON[+p.monthsFrom.slice(5)-1].slice(0,3)+' to '+MON[+p.monthsTo.slice(5)-1].slice(0,3)+', '+p.months+' full months',true)
        +card('Average month, average store',egp(p.avgMonthPerStore),'One store, one month',true):'')
      +card('Top store',p.top?'<span style="font-size:.78em">'+top+'</span>':'-',p.top?'EGP '+n(p.top.sales):'')
      +'</div></section>';
    return html;
  }
  function stores(d){
    var list=(d.ytd.perStore||[]).slice();
    var E=function(v){return n(v)};
    return '<section><h2>Per store</h2><div class="range">Each store, year to date ('+dmy(d.ytd.from)+' to '+dmy(d.ytd.to)+'). The average month counts full months only.</div><div class="stores">'+list.map(function(x){
      return '<div class="card st"><h3>'+esc(x.name)+'</h3><table><tr><th></th><th>Year to date</th><th>Avg month</th></tr>'
        +'<tr><td>Sales (EGP)</td><td>'+E(x.sales)+'</td><td>'+(x.avgMonth?E(x.avgMonth):'-')+'</td></tr>'
        +'<tr><td>Share of chain</td><td>'+x.share.toFixed(1)+'%</td><td>-</td></tr>'
        +'<tr><td>Avg ticket (EGP)</td><td>'+E(x.atv)+'</td><td>-</td></tr>'
        +'<tr><td>Orders</td><td>'+E(x.orders)+'</td><td>-</td></tr>'
        +'<tr><td>UPT</td><td>'+x.upt.toFixed(1)+'</td><td>-</td></tr></table></div>'}).join('')+'</div></section>';
  }
  var basis='net',off={};
  try{off=JSON.parse(localStorage.getItem('ov_off')||'{}')||{}}catch(e){off={}}
  function saveOff(){try{localStorage.setItem('ov_off',JSON.stringify(off))}catch(e){}}
  // adds the cells up for the chosen basis, leaving out the unticked categories
  function sum(d){
    var mm=d.monthly,ix=basis==='net'?3:4,months={},st={},onl={byMonth:{},total:0},any=false;
    mm.cells.forEach(function(c){
      if(off[c[2]])return;
      months[c[1]]=1;any=true;
      if(c[5]){onl.byMonth[c[1]]=(onl.byMonth[c[1]]||0)+c[ix];onl.total+=c[ix];return}
      var o=st[c[0]]||(st[c[0]]={name:c[0],byMonth:{},total:0});
      o.byMonth[c[1]]=(o.byMonth[c[1]]||0)+c[ix];o.total+=c[ix];
    });
    var list=Object.keys(months).sort(),stores=Object.keys(st).map(function(k){return st[k]}).filter(function(x){return x.total>0}).sort(function(a,b){return b.total-a.total});
    var totals={},total=0;list.forEach(function(k){totals[k]=0;stores.forEach(function(x){totals[k]+=x.byMonth[k]||0})});
    stores.forEach(function(x){total+=x.total});
    return{months:list,stores:stores,totals:totals,total:total,online:onl.total?onl:null,any:any};
  }
  function table(d){
    var m=sum(d),partial=d.monthly.partial;
    if(!m.any||!m.months.length)return '<div class="range">Nothing ticked. Tick at least one category.</div>';
    var cell=function(v){return '<td'+(v?'':' class="zero"')+'>'+(v?n(v):'-')+'</td>'};
    var head='<tr><th>Store</th>'+m.months.map(function(k){return '<th>'+MON[+k.slice(5)-1].slice(0,3)+(k===partial?'*':'')+'</th>'}).join('')+'<th class="sum">Total</th></tr>';
    var rows=m.stores.map(function(x){return '<tr><td>'+esc(x.name)+'</td>'+m.months.map(function(k){return cell(x.byMonth[k])}).join('')+'<td class="sum">'+n(x.total)+'</td></tr>'}).join('');
    var tot='';
    if(m.online)tot+='<tr><td>Online shop</td>'+m.months.map(function(k){return cell(m.online.byMonth[k])}).join('')+'<td class="sum">'+n(m.online.total)+'</td></tr>';
    var ot=m.online||{byMonth:{},total:0};
    tot+='<tr class="tot"><td>Total</td>'+m.months.map(function(k){return '<td>'+n(m.totals[k]+(ot.byMonth[k]||0))+'</td>'}).join('')+'<td class="sum">'+n(m.total+ot.total)+'</td></tr>';
    var left=d.monthly.cats.filter(function(c){return off[c]});
    return '<div class="range">Every store, each month of '+d.year+' (EGP, '+(basis==='net'?'net of VAT':'gross, VAT included')+').'+(m.online?'':'')+(partial?' * '+MON[+partial.slice(5)-1]+' is still running, so far up to '+dmy(d.upTo)+'.':'')+(left.length?' Left out: '+esc(left.join(', '))+'.':'')+'</div><div class="mt"><table>'+head+rows+tot+'</table></div>';
  }
  function monthly(d){
    var mm=d.monthly;if(!mm||!mm.cells.length)return '';
    var tg='<div class="tg"><button type="button" data-b="net" class="'+(basis==='net'?'on':'')+'">Net</button><button type="button" data-b="gross" class="'+(basis==='gross'?'on':'')+'">Gross</button></div>';
    var pop='<div class="pw"><button type="button" class="fb" id="fbtn" aria-haspopup="true" aria-expanded="false">Filter</button><div class="pop" id="fpop" hidden><div class="pt">Include in the table</div>'
      +mm.cats.map(function(c,i){return '<label><input type="checkbox" data-c="'+i+'"'+(off[c]?'':' checked')+'> '+esc(c)+'</label>'}).join('')
      +'<div class="pa"><button type="button" data-all="1">All</button><button type="button" data-all="0">None</button></div></div></div>';
    return '<section id="mon"><div class="mh"><h2>Sales by month</h2><div class="mc">'+pop+tg+'</div></div><div id="montbl">'+table(d)+'</div></section>';
  }
  var last=null;
  // long numbers shrink instead of wrapping onto a second line
  function fit(){
    document.querySelectorAll('.val').forEach(function(el){
      el.style.fontSize='';var size=parseFloat(getComputedStyle(el).fontSize);
      while(el.scrollWidth>el.clientWidth+1&&size>11){size-=1;el.style.fontSize=size+'px'}
    });
  }
  function paint(d){
    last=d;
    if(!d||!d.ok){out.innerHTML='<div class="err">'+esc((d&&d.error)||'Could not load the numbers.')+'</div>';return}
    if(d.empty){out.innerHTML='<div class="err">No sales data yet. Add it on the All Uploads page or press Sync from ERP.</div>';return}
    var m=MON[+d.month.slice(5,7)-1]+' '+d.year;
    sub.textContent='All stores, net of VAT. Sales up to '+dmy(d.upTo)+'. The Online shop is not counted as a store.';
    out.innerHTML=block('All stores together · year to date: '+d.year,d.ytd,'')+monthly(d)+stores(d);
    foot.textContent='Updated '+new Date(d.generatedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'. Figures are saved for 10 minutes; press Refresh for the latest.';
    fit();
  }
  function load(fresh){
    btn.disabled=true;
    fetch('/api/overview'+(fresh?'?fresh=1':''),{credentials:'same-origin',cache:'no-store'})
      .then(function(r){if(r.status===401){location.replace('/login.html');return null}return r.json().catch(function(){return{ok:false,error:'The server answered with something unexpected.'}})})
      .then(function(d){if(d)paint(d)})
      .catch(function(){out.innerHTML='<div class="err">Could not reach the server. Try again.</div>'})
      .then(function(){btn.disabled=false});
  }
  function redraw(){var t=document.getElementById('montbl');if(t&&last)t.innerHTML=table(last)}
  out.addEventListener('click',function(e){
    if(!last)return;
    var t=e.target,b=t.closest&&t.closest('.tg button');
    if(b){basis=b.getAttribute('data-b');document.querySelectorAll('.tg button').forEach(function(x){x.classList.toggle('on',x===b)});redraw();return}
    var f=t.closest&&t.closest('#fbtn');
    if(f){var p=document.getElementById('fpop');p.hidden=!p.hidden;f.setAttribute('aria-expanded',String(!p.hidden));return}
    var a=t.closest&&t.closest('.pa button');
    if(a){var on=a.getAttribute('data-all')==='1';last.monthly.cats.forEach(function(c){off[c]=!on});document.querySelectorAll('#fpop input').forEach(function(i){i.checked=on});saveOff();redraw()}
  });
  out.addEventListener('change',function(e){
    var i=e.target;if(!last||!i.matches||!i.matches('#fpop input'))return;
    off[last.monthly.cats[+i.getAttribute('data-c')]]=!i.checked;saveOff();redraw();
  });
  document.addEventListener('click',function(e){var p=document.getElementById('fpop');if(p&&!p.hidden&&!(e.target.closest&&e.target.closest('.pw'))){p.hidden=true;var f=document.getElementById('fbtn');if(f)f.setAttribute('aria-expanded','false')}});
  btn.addEventListener('click',function(){load(true)});
  addEventListener('resize',fit);
  load(false);
})();
</script>
</body>
</html>
